---
# ApplicationSet for security infrastructure
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-security
  annotations:
    argocd-diff-preview/watch-pattern: 'infra/k8s/security/.*'
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/guilhermewolf/atoca.house
        revision: HEAD
        files:
          - path: "infra/k8s/security/*/app-config.yaml"

  template:
    metadata:
      name: '{{.app.name}}'
      annotations:
        argocd-diff-preview/watch-pattern: 'infra/k8s/security/{{.app.name}}/.*'
      namespace: argocd
    spec:
      project: infra
      destination:
        namespace: '{{.app.namespace}}'
        server: https://kubernetes.default.svc

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  # sources live in the patch because skipSchemaValidation is a bool and plain
  # template fields only take strings. Opt in per app with
  # `app.skipSchemaValidation: true` in app-config.yaml (e.g. crowdsec, whose
  # chart schema rejects the `kubernetes` acquisition source).
  templatePatch: |
    spec:
      sources:
        - chart: '{{.app.chart}}'
          repoURL: '{{.app.chartRepo}}'
          targetRevision: '{{.app.chartVersion}}'
          helm:
            skipSchemaValidation: {{ dig "app" "skipSchemaValidation" false . }}
            valueFiles:
              - $values/infra/k8s/security/{{.app.name}}/values.yaml

        - repoURL: https://github.com/guilhermewolf/atoca.house
          targetRevision: HEAD
          ref: values

        - repoURL: https://github.com/guilhermewolf/atoca.house
          targetRevision: HEAD
          path: 'infra/k8s/security/{{.app.name}}'
          directory:
            exclude: '{application.yaml,values.yaml,app-config.yaml}'
