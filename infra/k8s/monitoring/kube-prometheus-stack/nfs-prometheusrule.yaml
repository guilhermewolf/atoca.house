---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nfs-monitoring
  namespace: monitoring
spec:
  groups:
    - name: nfs.stale.rules
      rules:
        # Primary stale-handle detector.
        #
        # node-exporter's filesystem collector runs statfs(2) against every
        # mount in a goroutine with a timeout. If the call returns an error
        # (ESTALE) or never returns (dead server), it sets device_error=1
        # instead of emitting size/avail. This is the only signal that catches
        # the failure mode seen on 2026-08-27: pods stay Running 1/1 with zero
        # restarts for 24h while every read against the mount returns ESTALE,
        # so nothing at the Kubernetes API level ever goes unhealthy.
        #
        # Requires the narrowed mount-points-exclude in the node-exporter
        # extraArgs (see kube-prometheus-stack values.yaml) — the chart default
        # excludes all of /var/lib/kubelet/ and hides these mounts entirely.
        # NOTE: `nodename` is only set on in-cluster targets (applied by the
        # ServiceMonitor relabeling). External node-exporters scraped via
        # scrape-config.yaml — nas.internal, hass.internal — have no nodename,
        # so `instance` is the label to key on in annotations.
        # ENOENT is excluded: the hass.internal node-exporter runs as a
        # Supervisor add-on. It parses the HOST /proc/mounts but statfs()s
        # inside its own container namespace, so every host path it cannot
        # reach (/mnt/data, /mnt/boot, /var/lib/docker, and the Supervisor
        # NFS mount under /mnt/data/supervisor/mounts/) reports
        # device_error="no such file or directory" permanently. That is a
        # namespace artifact, not a stale handle — a real ESTALE reports
        # "stale file handle" or a timeout.
        - alert: NFSMountStale
          expr: |-
            node_filesystem_device_error{fstype=~"nfs.*", device_error!="no such file or directory"} == 1
          for: 5m
          annotations:
            summary: >-
              NFS mount unreadable on {{ $labels.instance }} ({{ $labels.mountpoint }})
            description: >-
              statfs() against {{ $labels.device }} mounted at {{ $labels.mountpoint }}
              on {{ $labels.instance }} has been failing for 5m — typically a stale
              NFS file handle. Consumers keep running but every file operation
              returns ESTALE.
              On a Talos node: `talosctl -n {{ $labels.instance }} list {{ $labels.mountpoint }}`
              and `talosctl -n {{ $labels.instance }} dmesg | grep -i "nfs.*error"`.
              Fix: delete the owning pod so kubelet remounts. Only if the pod hangs
              Terminating, force-unmount on the node via `just kube node-shell`.
          labels:
            severity: warning

        - alert: NFSMountStaleCritical
          expr: |-
            node_filesystem_device_error{fstype=~"nfs.*", device_error!="no such file or directory"} == 1
          for: 30m
          annotations:
            summary: >-
              NFS mount stale for 30m on {{ $labels.instance }} ({{ $labels.mountpoint }})
            description: >-
              {{ $labels.mountpoint }} on {{ $labels.instance }} has been unreadable
              for 30 minutes. Data is unreachable for everything bound to this mount.
          labels:
            severity: critical

        # Catches the shfs inode churn that produces the stale handles in the
        # first place, before the mount actually dies. Every observed ESTALE on
        # this cluster was preceded by "NFS: server nas.internal error: fileid
        # changed" in the node kernel log, because subdirectory mounts of an
        # Unraid share have no stable fsid (only share roots in /etc/exports do).
        #
        # Depends on the kernel log being scraped into VictoriaLogs/Loki and a
        # recording rule exporting the count. Left commented until that source
        # is wired up — see notes in the runbook.
        #
        # - alert: NFSFileIDChanged
        #   expr: increase(node_kernel_nfs_fileid_changed_total[1h]) > 0
        #   for: 5m
        #   labels:
        #     severity: warning

    - name: nfs.rules
      rules:
        # Retained from the original rule set. Note these only catch failures at
        # container *creation* time — they cannot detect a stale handle on an
        # already-running pod, which is what NFSMountStale above is for.
        - alert: NFSVolumeMountFailure
          expr: |-
            kube_pod_container_status_waiting_reason{reason=~"CreateContainerError|CreateContainerConfigError"} > 0
            and
            kube_pod_info * on(namespace, pod) group_left() kube_pod_status_phase{phase="Pending"} > 0
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is failing to mount volumes
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has been in {{ $labels.reason }} state for more than 5 minutes.
              This is often caused by stale NFS mounts or volume mount issues.
          labels:
            severity: warning

        - alert: NFSVolumeMountFailureCritical
          expr: |-
            kube_pod_container_status_waiting_reason{reason=~"CreateContainerError|CreateContainerConfigError"} > 0
            and
            kube_pod_info * on(namespace, pod) group_left() kube_pod_status_phase{phase="Pending"} > 0
          for: 15m
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck failing to mount volumes
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has been in {{ $labels.reason }} state for more than 15 minutes.
              Check for stale NFS mounts on node {{ $labels.node }} with:
              `talosctl -n {{ $labels.node }} dmesg | grep -i "nfs.*error\|stale"`
          labels:
            severity: critical

        - alert: PodRestartingFrequently
          expr: |-
            rate(kube_pod_container_status_restarts_total[15m]) * 3600 > 4
          for: 5m
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted {{ $value | humanize }} times per hour over the last 15 minutes.
              This may indicate volume mount issues or application problems.
          labels:
            severity: warning
