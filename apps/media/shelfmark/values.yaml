---
controllers:
  shelfmark:
    containers:
      shelfmark:
        image:
          repository: ghcr.io/calibrain/shelfmark
          tag: v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
        command:
          - gunicorn
        args:
          # - --log-level=debug
          - --access-logfile=-
          - --error-logfile=-
          - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
          - --workers=1
          - -t
          - "300"
          - -b
          - 0.0.0.0:8084
          - shelfmark.main:app
        env:
          # Authelia OIDC (authorization_policy: household); admins group maps
          # to Shelfmark admin. Local login kept as break-glass.
          AUTH_METHOD: oidc
          OIDC_DISCOVERY_URL: https://auth.atoca.house/.well-known/openid-configuration
          OIDC_CLIENT_ID: shelfmark
          OIDC_SCOPES: openid email profile groups
          OIDC_GROUP_CLAIM: groups
          OIDC_USE_ADMIN_GROUP: "true"
          OIDC_ADMIN_GROUP: admins
          OIDC_AUTO_PROVISION: "true"
        envFrom:
          - secretRef:
              name: shelfmark-secret
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: &port 8084
          readiness: *probe
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.18/24"],
        "mac": "72:ab:4e:91:3d:c8"
      }]
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - shelfmark.atoca.house
    rules:
      - backendRefs:
          - name: shelfmark
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /config/

  nfs-nas-media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data
    advancedMounts:
      shelfmark:
        shelfmark:
          - path: /data
  tmpfs:
    type: emptyDir
    sizeLimit: 1Gi
    globalMounts:
      - path: /tmp
        subPath: tmp
      - path: /var/log
        subPath: var-log
