---
controllers:
  postiz:
    labels:
      postgres: "true"
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      annotations:
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }

        k8s.ksgate.org/dragonfly-ready: |
          {
            "apiVersion": "dragonflydb.io/v1alpha1",
            "kind": "Dragonfly",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster",
            "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
          }
        k8s.ksgate.org/dragonfly-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster"
          }

        k8s.ksgate.org/temporal-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "temporal",
            "namespace": "temporal",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/temporal-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "temporal-app",
            "namespace": "temporal"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
        - name: k8s.ksgate.org/dragonfly-ready
        - name: k8s.ksgate.org/dragonfly-service
        - name: k8s.ksgate.org/temporal-deployment
        - name: k8s.ksgate.org/temporal-service
      hostAliases:
        - ip: "172.67.202.239"
          hostnames:
            - postiz.atoca.house
    containers:
      app:
        image:
          repository: ghcr.io/gitroomhq/postiz-app
          tag: v2.23.0@sha256:785f97312f66a347fb96cdccc4ded5a33ced69a672c89a9adc8054e7d6a21dc5
        env:
          # Combined image: Caddy on 5000 proxies / -> frontend(4200), /api -> backend(3000)
          MAIN_URL: "https://postiz.atoca.house"
          FRONTEND_URL: "https://postiz.atoca.house"
          NEXT_PUBLIC_BACKEND_URL: "https://postiz.atoca.house/api"
          BACKEND_INTERNAL_URL: "http://localhost:3000"
          IS_GENERAL: "true"
          RUN_CRON: "true"
          # Crunchy Postgres TLS is signed by the cert-manager postgres-ca,
          # mounted at /etc/ssl/postgres/ca.crt and added to Node's trust store
          # so the pg/Mastra client verifies it (no SELF_SIGNED_CERT_IN_CHAIN).
          NODE_EXTRA_CA_CERTS: /etc/ssl/postgres/ca.crt
          # Temporal workflow engine (required since Postiz v2.12.0)
          TEMPORAL_ADDRESS: "temporal-app.temporal.svc.cluster.local:7233"
          # Cloudflare R2 storage (app-native, replaces local PVC uploads)
          STORAGE_PROVIDER: "cloudflare"
          CLOUDFLARE_BUCKETNAME: "postiz"
          CLOUDFLARE_REGION: "auto"
          # SMTP email (host/port/user/pass/from via postiz-secret)
          EMAIL_PROVIDER: "nodemailer"
          EMAIL_SECURE: "true"
          EMAIL_FROM_NAME: "Postiz"
          # Redis (Dragonfly) - DB index 8 (5/6/7 already in use)
          REDIS_URL: "redis://dragonfly.dragonfly-cluster.svc.cluster.local:6379/8"
          # Flip to "true" once your first user is registered
          DISABLE_REGISTRATION: "true"
          API_LIMIT: "30"
          # OIDC login via Authelia (disables GitHub/Google login providers)
          POSTIZ_GENERIC_OAUTH: "true"
          NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: "Authelia"
          NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authelia.png"
          POSTIZ_OAUTH_URL: "https://auth.atoca.house"
          POSTIZ_OAUTH_AUTH_URL: "https://auth.atoca.house/api/oidc/authorization"
          POSTIZ_OAUTH_TOKEN_URL: "https://auth.atoca.house/api/oidc/token"
          POSTIZ_OAUTH_USERINFO_URL: "https://auth.atoca.house/api/oidc/userinfo"
        envFrom:
          - secretRef:
              name: postiz-secret
          - secretRef:
              name: postiz-db-secret
        securityContext:
          allowPrivilegeEscalation: false
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 5000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              periodSeconds: 10
              failureThreshold: 30
        resources:
          requests:
            cpu: 150m
            memory: 3Gi
          limits:
            memory: 4Gi

service:
  app:
    ports:
      http:
        port: 5000

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-external
        namespace: kube-system
    hostnames:
      - postiz.atoca.house
    rules:
      - backendRefs:
          - name: postiz
            port: 5000
        matches:
          - path:
              type: PathPrefix
              value: /uploads
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Content-Security-Policy
                  value: "default-src 'none'; img-src 'self'; media-src 'self'"
                - name: Cache-Control
                  value: "public, max-age=31536000, immutable"
                - name: Cross-Origin-Resource-Policy
                  value: cross-origin
      - backendRefs:
          - name: postiz
            port: 5000
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  postgres-ca:
    type: configMap
    name: postgres-ca
    globalMounts:
      - path: /etc/ssl/postgres/ca.crt
        subPath: ca.crt
        readOnly: true

  uploads:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 50Gi
    globalMounts:
      - path: /uploads

  config:
    type: emptyDir
    advancedMounts:
      postiz:
        app:
          - path: /config
  tmpfs:
    type: emptyDir
    advancedMounts:
      postiz:
        app:
          - path: /tmp
