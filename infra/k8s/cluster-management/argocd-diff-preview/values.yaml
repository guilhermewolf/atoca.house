---
# Dedicated, namespace-scoped Argo CD used only by .github/workflows/argocd-diff-preview.yaml
# (https://dag-andersen.github.io/argocd-diff-preview/reusing-clusters/lockdown-mode/).
# Never syncs anything: the tool strips syncPolicy and only asks for rendered manifests.
# Keep chartVersion in step with argocd/install/kustomization.yaml so diffs render like prod.
nameOverride: argocd-diff-preview
createClusterRoles: false

crds:
  install: false # shared with the prod Argo CD

global:
  networkPolicy:
    create: false

configs:
  cm:
    kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
  params:
    server.insecure: "true"

  # Stub of the prod argocd-vault-plugin CMP (same name, no AVP binary/1Password):
  # emits the raw manifests so `<path:...>` placeholders show up unresolved in the diff.
  cmp:
    create: true
    plugins:
      argocd-vault-plugin:
        allowConcurrency: true
        generate:
          command:
            - sh
          args:
            - "-c"
            - 'find . -name ''*.yaml'' -o -name ''*.yml'' | xargs -I {} sh -c ''grep
              -q "^kind:" "{}" && cat "{}" && echo "---" || true''
              2>/dev/null'

dex:
  enabled: false

notifications:
  enabled: false

# ApplicationSets are expanded through the server API; no controller needed.
applicationSet:
  replicas: 0

controller:
  # Read-only in its own namespace; Applications show "Unknown" health, which is fine.
  roleRules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: [get, list, watch]
    - apiGroups: [argoproj.io]
      resources: [applications, applications/status]
      verbs: [get, list, watch, update, patch]
    # Audit events for app operations; without it every reconcile logs a 403.
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]

repoServer:
  extraContainers:
    - name: avp
      command: [/var/run/argocd/argocd-cmp-server]
      image: quay.io/argoproj/argocd:v3.5.6@sha256:8e5cc5bb008df8a09dba439462e58c94c55b7735888d3ebde0c25fc05e4e5335
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: cmp-tmp
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: argocd-vault-plugin.yaml
          name: argocd-cmp-cm
  volumes:
    - name: cmp-tmp
      emptyDir: {}
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
