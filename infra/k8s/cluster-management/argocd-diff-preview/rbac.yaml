---
# Lets the diff-preview runners (infra/k8s/operators/arc-diff-runners) drive this
# Argo CD instance, and nothing outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-diff-runner
  namespace: argocd-diff-preview
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-diff-runner
  namespace: argocd-diff-preview
subjects:
  - kind: ServiceAccount
    name: arc-diff-runner
    namespace: arc-diff-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-diff-runner
