---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-secret-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pgadmin-secret-auth
    template:
      data:
        # App
        PGADMIN_PASSWORD: "{{ .PG_PASSWORD }}"
        # Python literal read by pgAdmin; secret must match Authelia's
        # /config/secret/PGADMIN_OAUTH_CLIENT_SECRET
        OAUTH2_CONFIG: >-
          [{'OAUTH2_NAME': 'authelia',
          'OAUTH2_DISPLAY_NAME': 'Authelia',
          'OAUTH2_CLIENT_ID': 'pgadmin',
          'OAUTH2_CLIENT_SECRET': '{{ .PGADMIN_OAUTH_CLIENT_SECRET }}',
          'OAUTH2_SERVER_METADATA_URL': 'https://auth.atoca.house/.well-known/openid-configuration',
          'OAUTH2_API_BASE_URL': 'https://auth.atoca.house/',
          'OAUTH2_TOKEN_URL': 'https://auth.atoca.house/api/oidc/token',
          'OAUTH2_AUTHORIZATION_URL': 'https://auth.atoca.house/api/oidc/authorization',
          'OAUTH2_USERINFO_ENDPOINT': 'https://auth.atoca.house/api/oidc/userinfo',
          'OAUTH2_SCOPE': 'openid email profile',
          'OAUTH2_USERNAME_CLAIM': 'email',
          'OAUTH2_CHALLENGE_METHOD': 'S256',
          'OAUTH2_RESPONSE_TYPE': 'code',
          'OAUTH2_ICON': 'fa-key',
          'OAUTH2_BUTTON_COLOR': '#1976d2'}]
  dataFrom:
    - extract:
        key: pgadmin-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres-cluster-store
  target:
    name: pgadmin-secret
    template:
      data:
        pgpass: |
          *:*:*:{{ .user }}:{{ .password }}
  dataFrom:
    - extract:
        key: postgres-pguser-postgres
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
