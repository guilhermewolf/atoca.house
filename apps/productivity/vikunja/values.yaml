controllers:
  vikunja:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      vikunja:
        image:
          repository: docker.io/vikunja/vikunja
          tag: 2.5.0@sha256:22df4c1bc8843c28d383bc5f52b59e7b601bf5f6560b36b29c0a500833c77fa3
        env:
          VIKUNJA_SERVICE_PUBLICURL: https://vikunja.atoca.house
          VIKUNJA_SERVICE_TIMEZONE: "Europe/Amsterdam"
          POSTGRES_ENABLED: "true"
          VIKUNJA_MAILER_ENABLED: true
          VIKUNJA_METRICS_ENABLED: true
          VIKUNJA_DEFAULTSETTINGS_DISCOVERABLE_BY_NAME: true
          VIKUNJA_DEFAULTSETTINGS_EMAIL_REMINDERS_ENABLED: true
          VIKUNJA_REDIS_ENABLED: true
          VIKUNJA_REDIS_HOST: dragonfly.dragonfly-cluster.svc.cluster.local:6379
          VIKUNJA_REDIS_DB: 3
          VIKUNJA_KEYVALUE_TYPE: redis
          discoverable_by_email: true
          overdue_tasks_reminders_time: "11:00"
          VIKUNJA_DEFAULTSETTINGS_WEEK_START: 1

          # postgres
          VIKUNJA_DATABASE_TYPE: postgres
        envFrom:
          - secretRef:
              name: vikunja-db-secret
          - secretRef:
              name: vikunja-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3456
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 150Mi
    pod:
      annotations:
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }

        k8s.ksgate.org/dragonfly-ready: |
          {
            "apiVersion": "dragonflydb.io/v1alpha1",
            "kind": "Dragonfly",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster",
            "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
          }
        k8s.ksgate.org/dragonfly-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
        - name: k8s.ksgate.org/dragonfly-ready
        - name: k8s.ksgate.org/dragonfly-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile: { type: RuntimeDefault }
service:
  vikunja:
    controller: vikunja
    ports:
      http:
        port: 3456
route:
  vikunja:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - vikunja.atoca.house
    rules:
      - backendRefs:
          - name: vikunja
            port: 3456
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  files:
    enabled: true
    size: 5Gi
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    globalMounts:
      - path: /app/vikunja/files
  config:
    type: secret
    name: vikunja-secret
    globalMounts:
      - path: /etc/vikunja/config.yml
        subPath: config.yml
        readOnly: true
