---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: excalidash-secret
  namespace: excalidash
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: excalidash-secret
    template:
      data:
        JWT_SECRET: "{{ .EXCALIDASH_JWT_SECRET }}"
        CSRF_SECRET: "{{ .EXCALIDASH_CSRF_SECRET }}"
        API_KEY_HASH_PEPPER: "{{ .EXCALIDASH_API_KEY_HASH_PEPPER }}"
        OIDC_CLIENT_SECRET: "{{ .EXCALIDASH_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: excalidash-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: excalidash-db-secret
  namespace: excalidash
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres-cluster-store
  target:
    name: excalidash-db-secret
    template:
      data:
        # Direct to the primary, not PgBouncer: the pooler runs in transaction
        # mode, which breaks the advisory locks used by `prisma migrate deploy`.
        # Prisma only verifies the server cert with sslaccept=strict.
        # Crunchy gives each user a schema that leads search_path, so migrations
        # land there; schema= makes the Prisma client query the same one.
        DATABASE_URL: 'postgresql://{{ index . "user" }}:{{ index . "password" }}@{{ index . "host" }}:{{ index . "port" | toString }}/{{ index . "dbname" }}?schema={{ index . "user" }}&sslmode=require&sslcert=/etc/ssl/postgres/ca.crt&sslaccept=strict'
  dataFrom:
    - extract:
        key: postgres-pguser-excalidash
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
