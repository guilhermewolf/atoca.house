---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kromgo-configmap
  namespace: kromgo
data:
  config.yaml: |
    badges:
      - id: talos_version
        query: node_os_info{name="Talos"}
        valueExpr: labels[?"version_id"].orValue("unknown")
        title: Talos

      - id: kubernetes_version
        query: kubernetes_build_info{service="kubernetes"}
        valueExpr: labels[?"git_version"].orValue("unknown")
        title: Kubernetes

      - id: argocd_version
        query: argocd_info
        valueExpr: labels[?"version"].orValue("unknown")
        title: ArgoCD

      - id: cluster_node_count
        query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
        colorExpr: '"green"'
        title: Nodes

      - id: cluster_pod_count
        query: sum(kube_pod_status_phase{phase="Running"})
        colorExpr: '"green"'
        title: Pods

      - id: cluster_cpu_usage
        query: round(100 - (avg(rate(node_cpu_seconds_total{mode="idle", instance!="hass.internal:9100", instance!="nas.internal:9100"}[5m])) * 100), 0.1)
        valueExpr: humanizeFloat(result) + "%"
        colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'
        title: CPU

      - id: cluster_memory_usage
        query: round(sum(node_memory_MemTotal_bytes{instance!="hass.internal:9100", instance!="nas.internal:9100"} - node_memory_MemAvailable_bytes{instance!="hass.internal:9100", instance!="nas.internal:9100"}) / sum(node_memory_MemTotal_bytes{instance!="hass.internal:9100", instance!="nas.internal:9100"}) * 100, 0.1)
        valueExpr: humanizeFloat(result) + "%"
        colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'
        title: Memory

      - id: cluster_power_usage
        query: round(upsHighPrecOutputLoad, 0.1)
        valueExpr: humanizeFloat(result) + "w"
        colorExpr: 'colorScale(result, [401.0, 751.0], ["green", "orange", "red"])'
        title: Power

      - id: cluster_age_days
        query: round((time() - min(kube_node_created) ) / 86400)
        valueExpr: humanizeFloat(result) + "d"
        colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'
        title: Age

      - id: cluster_uptime_days
        query: round(avg(node_time_seconds - node_boot_time_seconds) / 86400)
        valueExpr: humanizeFloat(result) + "d"
        colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'
        title: Uptime

      - id: unraid_version
        query: node_os_info{id="unraid-os"}
        valueExpr: labels[?"version_id"].orValue("unknown")
        title: Unraid

      - id: cluster_alert_count
        query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
        valueExpr: humanizeFloat(result)
        colorExpr: 'colorScale(result, [1.0], ["green", "red"])'
        title: Alerts
