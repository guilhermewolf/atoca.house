---
# Restore gate - see restore.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 15Gi
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: nextcloud-restore
