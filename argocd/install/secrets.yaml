---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-avp-token
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: argocd-avp-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        credential: "{{ .ARGOCD_AVP_TOKEN }}"
  dataFrom:
    - extract:
        key: argocd-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: argocd-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        auth: "{{ .REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: argocd-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        discord-webhook-url: "{{ .ARGOCD_DISCORD_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: argocd-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: argocd-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          # argocd-server only resolves $secret:key refs in secrets labelled part-of=argocd.
          # (No angle brackets in this dir: they trigger the AVP CMP auto-discovery.)
          app.kubernetes.io/part-of: argocd
      data:
        # Must match the value Authelia reads from /config/secret/ARGOCD_OAUTH_CLIENT_SECRET
        clientSecret: "{{ .ARGOCD_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
