---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glance-ops
  namespace: glance-ops
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: glance-ops
    template:
      data:
        # UniFi local API key (Site Settings -> Control Plane -> Integrations)
        UNIFI_API_KEY: "{{ .GLANCE_UNIFI_API_KEY }}"
        # Grafana service-account token with DataSource Reader
        GRAFANA_TOKEN: "{{ .GLANCE_GRAFANA_TOKEN }}"
        # Jellyfin API key (Dashboard -> API Keys)
        JELLYFIN_API_KEY: "{{ .GLANCE_JELLYFIN_API_KEY }}"
        # Reuse the *arr API keys already stored for the apps themselves
        RADARR_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: glance-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: radarr-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: sonarr-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
