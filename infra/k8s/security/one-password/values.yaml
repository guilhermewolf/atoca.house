---
connect:
  replicas: 2
  api:
    httpPort: 80
    imageRepository: ghcr.io/1password/connect-api
    serviceMonitor:
      enabled: true
  credentialsName: onepassword-connect-credentials-secret
  sync:
    imageRepository: ghcr.io/1password/connect-sync
  # Hard anti-affinity: never schedule both replicas on the same node
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: onepassword-connect
  pdb:
    enabled: true
    maxUnavailable: 1
