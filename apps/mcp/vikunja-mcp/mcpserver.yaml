---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: vikunja-mcp
spec:
  groupRef:
    name: mcp-tools
  # renovate: datasource=docker depName=docker.io/library/node
  image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  env:
    - name: VIKUNJA_URL
      value: https://vikunja.atoca.house/api/v1
    - name: NODE_ENV
      value: production
    - name: LOG_LEVEL
      value: info
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
  secrets:
    - name: vikunja-mcp-secret
      key: VIKUNJA_API_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - npx
          args:
            # renovate: datasource=npm depName=@democratize-technology/vikunja-mcp
            - "@democratize-technology/vikunja-mcp@0.2.0"
          volumeMounts:
            - name: tmpfs
              mountPath: /tmp
      volumes:
        - name: tmpfs
          emptyDir: {}
  transport: stdio
