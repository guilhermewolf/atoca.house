name: Argo CD Diff Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: argocd-diff-preview-${{ github.event.number }}
  # Runs take seconds; cancelling mid-run would leave orphaned Applications
  # in the shared argocd-diff-preview namespace.
  cancel-in-progress: false

jobs:
  diff:
    # Runs inside the cluster: never execute code from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Dedicated runners whose service account only reaches the argocd-diff-preview
    # namespace (infra/k8s/operators/arc-diff-runners).
    runs-on: arc-diff-runners
    env:
      # renovate: datasource=github-releases depName=dag-andersen/argocd-diff-preview
      ADP_VERSION: v0.2.17
      # sha256 of argocd-diff-preview-Linux-x86_64.tar.gz; update together with ADP_VERSION.
      ADP_SHA256: 3913c5ded0c4bb748ab8cabc47d9ea1060462fb797b4b61e1a12a805fc35a319
    steps:
      # Pin both sides to exact SHAs: the long-lived Argo CD caches branch refs
      # (https://dag-andersen.github.io/argocd-diff-preview/reusing-clusters/branch-vs-sha/).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: target-branch

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-branch

      - name: Install argocd-diff-preview
        run: |
          curl -fsSL -o "$RUNNER_TEMP/adp.tar.gz" \
            "https://github.com/dag-andersen/argocd-diff-preview/releases/download/${ADP_VERSION}/argocd-diff-preview-Linux-x86_64.tar.gz"
          echo "${ADP_SHA256}  $RUNNER_TEMP/adp.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/adp.tar.gz" -C "$RUNNER_TEMP" argocd-diff-preview
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate diff
        run: |
          argocd-diff-preview \
            --repo=${{ github.repository }} \
            --base-branch=${{ github.event.pull_request.base.sha }} \
            --target-branch=${{ github.sha }} \
            --create-cluster=false \
            --argocd-namespace=argocd-diff-preview \
            --argocd-ui-url=https://argocd.atoca.house

      - name: Post diff as comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
