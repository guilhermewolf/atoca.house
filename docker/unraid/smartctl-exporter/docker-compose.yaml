---
services:
  smartctl-exporter:
    container_name: smartctl-exporter
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    ports:
      - 9633:9633
    # privileged on purpose: an explicit devices: list (9 disks today) would silently
    # drop SMART metrics for any disk added to the array later
    privileged: true
    restart: unless-stopped
    user: root
