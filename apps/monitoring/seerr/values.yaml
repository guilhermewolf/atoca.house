controllers:
  seerr:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      seerr:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
        env:
          LOG_LEVEL: "info"
          PORT: &port 80
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/status
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/status
                port: *port
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/status
                port: *port
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 15m
            memory: 384Mi
          limits:
            memory: 512Mi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  seerr:
    controller: seerr
    ports:
      http:
        port: *port
route:
  seerr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-external
        namespace: kube-system
    hostnames: &hostname
      - seerr.atoca.house
    rules:
      - backendRefs:
          - name: seerr
            port: &port80 80
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Content-Security-Policy
                  value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://plex.tv; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
        matches:
          - path:
              type: PathPrefix
              value: /
  auth:
    enabled: true
    kind: HTTPRoute
    annotations:
      gatus.home-operations.com/enabled: "false"
    parentRefs:
      - name: atoca-house-external
        namespace: kube-system
    hostnames: *hostname
    rules:
      - backendRefs:
          - name: seerr
            port: *port80
        matches:
          - path:
              type: Exact
              value: /api/v1/auth/jellyfin
          - path:
              type: Exact
              value: /api/v1/auth/local
          - path:
              type: Exact
              value: /api/v1/auth/plex

persistence:
  seerr:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/config
  tmp:
    type: emptyDir
