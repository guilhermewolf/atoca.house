  w-jellyfin-stats.yml: |
    - type: custom-api
      title: Media Library
      base-url: ${JELLYFIN_URL}
      options:
        url: ${JELLYFIN_URL}
        key: ${JELLYFIN_API_KEY}

      template: |
        {{ $url := .Options.StringOr "url" "" }}
        {{ $key := .Options.StringOr "key" "" }}

        {{- if or (eq $url "") (eq $key "") -}}

          <p>Error: The URL or API Key was not configured in the widget options.</p>

        {{- else -}}

          {{- $requestUrl := printf "%s/emby/Items/Counts?api_key=%s" $url $key -}}
          {{- $jellyfinData := newRequest $requestUrl | getResponse -}}

          {{- if eq $jellyfinData.Response.StatusCode 200 -}}
            <div class="flex flex-column gap-5">
              <div class="flex justify-between text-center">

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "MovieCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Movies</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SeriesCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">TV Shows</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "EpisodeCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Episodes</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SongCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Songs</div>
                </div>

              </div>
            </div>
          {{- else -}}
            <p>Failed: {{ $jellyfinData.Response.Status }}</p>
          {{- end -}}
        {{- end -}}
  w-seerr-trending.yml: |
    - type: custom-api
      title: Trending Right Now
      title-url: ${OVERSEERR_URL}/discover/trending    # trending, movies, or tv
      url: ${OVERSEERR_URL}/api/v1/discover/trending   # trending, movies, or tv
      cache: 15m
      headers:
        accept: "application/json"
        x-api-key: ${OVERSEERR_API_KEY}
      parameters:
        language: "en" # this can be changed to other languages if desired
        page: "1"
      options:
        show-media-type: true # set to false to hide the "| TV" or "| Movie" suffix
        show-media-desc: true # set to false to hide the media's summary
      template: |
        {{ $showMediaType := .Options.BoolOr "show-media-type" true }}
        {{ $showMediaDesc := .Options.BoolOr "show-media-desc" true }}

        {{ if eq .Response.StatusCode 200 }}
          {{ $items := .JSON.Array "results" }}
          {{ if gt (len $items) 0 }}
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
            {{ range $items }}
              <li class="flex items-start gap-10 thumbnail-container thumbnail-parent">
                {{ $mediaType := .String "mediaType" }}
                {{ $mediaTitle := "" }}
                {{ $mediaTypeUpper := "" }}
                {{ if eq $mediaType "movie" }} {{ $mediaTitle = .String "title" }} {{ $mediaTypeUpper = "Movie" }}{{ else }}{{ $mediaTitle = .String "name" }} {{ $mediaTypeUpper = "TV" }}{{ end }}
                {{ $overseerrUrl := concat "${OVERSEERR_URL}" "/" $mediaType "/" ( .String "id" ) }}
                {{ $tmdbUrl := concat "https://www.themoviedb.org" "/" $mediaType "/" ( .String "id" ) }}
                <a href={{ $overseerrUrl }} target="_blank">
                <img src={{ concat "https://image.tmdb.org/t/p/w300" (.String "posterPath") }} style="border-radius: 5px; min-width: 5rem; max-width: 5rem;" class="card">
                </a>
                <div class="flex-1" style="padding-right: 5px;">
                  <p class="color-positive size-h4 text-truncate-2-lines margin-top-5" title={{ $mediaTitle }}><a href={{ $overseerrUrl }} target="_blank">{{ $mediaTitle }}</p>
                  <p class="size-h4" title="TMDB Rating"><a href={{ $tmdbUrl }} target="_blank">TMDB: {{ mul (.Float "voteAverage") 10 | toInt }}% {{ if $showMediaType }}| {{ $mediaTypeUpper }}{{ end }}</a></p>
                  {{ if $showMediaDesc }}<p class="color-subdue size-h4 text-truncate-2-lines" title={{ .String "overview" }}>{{ .String "overview" }}</p>{{ end }}
                </div>
              </li>
            {{ end }}
            </ul>
          {{ else }}
            <details style="margin-top:0.5rem">
              <summary> Raw JSON:</summary>
              <pre stye="font-size:10px">
          {{ (printf "%+v" .JSON) }}
              </pre>
            </details>
          {{ end }}
        {{ end }}
  w-youtube.yml: |
    - type: custom-api
      title: ${YOUTUBE_CHANNEL} on YouTube
      url: ${RSS_BRIDGE}
      parameters:
        action: display
        bridge: YoutubeBridge
        context: By username
        u: ${YOUTUBE_CHANNEL}
        duration_min: 3
        duration_max: nil
        format: Json
      frameless: true
      headers:
        content-type: application/json
      cache: 30m
      template: |
        {{ $arrayList := .JSON.Array "items" }}
        {{ $closeOutsideIframe := false }} {{/* Closes the popup anywhere around the iframe */}}
        {{ $popupWidth := "85%" }}
        {{ $popupHeight := "85%" }}
        {{ $author := .JSON.String "title" | trimSuffix " - YouTube" }}
        {{ $authorUrl := .JSON.String "home_page_url" | trimSuffix "/videos" }}
        <div class="cards-grid collapsible-container" data-collapse-after-rows="3">
          {{ if eq (len ($arrayList)) 0 }}
          <div>Nothing to show</div>
          {{ else }}
            {{ range $arrayList }}

            {{ $iframeAllow := "" }}

            {{ $youtubeUrl := .String "url" }}
            {{ $youtubeId := .String "_rssbridge.id" }}
            {{ $youtubeEmbedInstance := "https://www.youtube-nocookie.com/embed/" }}
            {{ $youtubeParameters := "" }}
            {{ $youtubeEmbedUrl := concat $youtubeEmbedInstance $youtubeId $youtubeParameters }}

            {{ $title := .String "title" }}
            {{ $timestamp := .String "date_modified" | parseTime "rfc3339" }}
            {{ $thumbnail := findSubmatch "img src=\"([^\"]+)" (.String "content_html") }}

            <div class="card widget-content-frame thumbnail-parent">
              <div onclick="
                const classPrefix = 'popup-youtube-';
                const embedClass = classPrefix + 'embed';
                const dimBgClass = classPrefix + 'dim';
                const closeBtnClass = classPrefix + 'close';
                const popupEmbedExistingDiv = document.querySelector('.' + embedClass);
                if (!popupEmbedExistingDiv) {
                  const dimBackground = document.createElement('div');
                  dimBackground.className = dimBgClass;
                  dimBackground.style = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--color-widget-background-highlight); opacity: 0.7;';
                  document.body.appendChild(dimBackground);

                  const popupEmbedDiv = document.createElement('div');
                  popupEmbedDiv.className = embedClass;
                  popupEmbedDiv.style = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: {{ $popupWidth }}; height: {{ $popupHeight }}; z-index: 11;';

                  const popupIframe = document.createElement('iframe');
                  popupIframe.className = classPrefix + 'iframe';
                  popupIframe.src = {{ $youtubeEmbedUrl }};
                  popupIframe.loading = 'lazy';
                  popupIframe.allowFullscreen = true;
                  popupIframe.allow = {{ $iframeAllow }};
                  popupIframe.style ='outline: 2px solid var(--color-primary); outline-offset: -0.1rem; border-radius: 20px; width: 100%; height: 100%; border: none; background-color: var(--color-popover-background);';

                  popupEmbedDiv.appendChild(popupIframe);
                  document.body.appendChild(popupEmbedDiv);

                  const closeBtn = document.createElement('span');
                  closeBtn.className = closeBtnClass;
                  closeBtn.innerHTML = '&times';
                  closeBtn.style = 'cursor: pointer; font-size: 3rem; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; position: absolute; top: 3rem; right: 3rem;';
                  document.body.appendChild(closeBtn);
                  document.body.style.overflowY = 'hidden';

                  const closePopup = () => {
                    popupEmbedDiv.remove();
                    dimBackground.remove();
                    closeBtn.remove();
                    document.body.style.overflowY = 'scroll';
                  }

                  {{ if $closeOutsideIframe }} dimBackground.onclick = closePopup; {{ end }}
                  closeBtn.onclick = closePopup;
                } else {
                  document.querySelector('.' + dimBgClass).remove();
                  document.querySelector('.' + closeBtnClass).remove();
                  document.body.style.overflowY = 'scroll';
                  popupEmbedExistingDiv.remove();
                }
              " style="cursor: pointer;">
                <span>
                  {{ if ne $thumbnail "" }}
                  <img class="video-thumbnail thumbnail" loading="lazy" src="{{ $thumbnail }}" alt="">
                  {{ else }}
                  <svg class="video-thumbnail thumbnail" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="var(--color-text-subdue)">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                  </svg>
                  {{ end }}
                </span>
              </div>
              <div class="margin-bottom-widget padding-inline-widget flex flex-column grow">
                <div class="margin-top-10 margin-bottom-auto">
                  <a href="{{ $youtubeUrl }}#" class="color-primary-if-not-visited text-truncate-2-lines" target="_blank" rel="noreferrer">
                    {{ $title }}
                  </a>
                </div>
                <ul class="list-horizontal-text flex-nowrap margin-top-7">
                  {{/* The public RSS-Bridge instance omits date_modified, which
                       parses to the zero time and renders as "56y". Only show
                       the age when the feed actually supplied a date. */}}
                  {{ if not $timestamp.IsZero }}
                  <li class="shrink-0" {{ $timestamp | toRelativeTime }}></li>
                  {{ end }}
                  <li class="min-width-0">
                    <a href="{{ $authorUrl }}" class="color-primary-if-not-visited text-truncate-2-lines" target="_blank" rel="noreferrer">
                      {{ $author }}
                    </a>
                  </li>
                </ul>
              </div>
            </div>
            {{ end }}
          {{ end }}
        </div>
