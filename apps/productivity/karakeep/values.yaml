---
controllers:
  app:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/karakeep-app/karakeep
          tag: 0.34.1
        env:
          BROWSER_WEB_URL: http://karakeep-chrome.karakeep.svc.cluster.local:9222
          COREPACK_INTEGRITY_KEYS: "0"
          CRAWLER_DOWNLOAD_BANNER_IMAGE: true
          CRAWLER_ENABLE_ADBLOCKER: true
          CRAWLER_STORE_SCREENSHOT: true
          CRAWLER_FULL_PAGE_SCREENSHOT: true
          DATA_DIR: /data
          # OIDC-only: allow OAuth users to auto-provision, but disable the
          # password signup/login form so OAuth is the only entry point.
          DISABLE_SIGNUPS: false
          DISABLE_PASSWORD_AUTH: true
          MAX_ASSET_SIZE_MB: 50
          MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
          NEXTAUTH_URL: https://karakeep.atoca.house
          DISABLE_NEW_RELEASE_CHECK: true
          INFERENCE_IMAGE_MODEL: "llava"
          INFERENCE_TEXT_MODEL: "gemma3:4b"
          INFERENCE_JOB_TIMEOUT_SEC: 600 # 10 Minutes
          OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:80"
          OLLAMA_KEEP_ALIVE: 5m
          CRAWLER_PARSER_MEM_LIMIT_MB: 1500
          # OIDC (Authelia)
          OAUTH_WELLKNOWN_URL: https://auth.atoca.house/.well-known/openid-configuration
          OAUTH_CLIENT_ID: karakeep
          OAUTH_PROVIDER_NAME: "Authelia"
          OAUTH_SCOPE: "openid email profile"
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
        envFrom:
          - secretRef:
              name: karakeep
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 1536Mi
          limits:
            memory: 3Gi
    pod:
      annotations:
        k8s.ksgate.org/karakeep-chrome-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "karakeep-chrome",
            "namespace": "karakeep",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/karakeep-chrome-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "karakeep-chrome",
            "namespace": "karakeep"
          }
        k8s.ksgate.org/karakeep-meilisearch-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "karakeep-meilisearch",
            "namespace": "karakeep",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/karakeep-meilisearch-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "karakeep-meilisearch",
            "namespace": "karakeep"
          }
        k8s.ksgate.org/ollama-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "ollama",
            "namespace": "ollama",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/ollama-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "ollama",
            "namespace": "ollama"
          }
      schedulingGates:
        - name: k8s.ksgate.org/karakeep-chrome-deployment
        - name: k8s.ksgate.org/karakeep-chrome-service
        - name: k8s.ksgate.org/karakeep-meilisearch-deployment
        - name: k8s.ksgate.org/karakeep-meilisearch-service
        - name: k8s.ksgate.org/ollama-deployment
        - name: k8s.ksgate.org/ollama-service

  chrome:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/karakeep-app/karakeep-chrome
          tag: 156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
        # The image entrypoint already runs headless with --no-sandbox and exposes
        # the DevTools port on 9222; these match upstream's docker-compose.
        args:
          - --disable-gpu
          - --disable-dev-shm-usage
          - --hide-scrollbars
          - --disable-blink-features=AutomationControlled
          - --window-size=1440,900
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 2Gi

  meilisearch:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/getmeili/meilisearch
          tag: v1.56.0
        env:
          MEILI_NO_ANALYTICS: true
          # Migrate the on-disk DB in place when the engine version bumps
          # (replaces the old MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE flag).
          MEILI_UPGRADE_DB: true
          MEILI_MASTER_KEY:
            valueFrom:
              secretKeyRef:
                name: karakeep
                key: MEILI_MASTER_KEY
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 4Gi

defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: karakeep
          topologyKey: "kubernetes.io/hostname"

service:
  app:
    controller: app
    ports:
      http:
        port: 3000
  chrome:
    controller: chrome
    ports:
      http:
        port: 9222
  meilisearch:
    controller: meilisearch
    ports:
      http:
        port: 7700

route:
  app:
    enabled: true
    kind: HTTPRoute
    annotations:
      gatus.io/enabled: "true"
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - karakeep.atoca.house
    rules:
      - backendRefs:
          - name: karakeep-app
            port: 3000
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 15Gi
    advancedMounts:
      app:
        app:
          - path: /data
            subPath: hoarder
      meilisearch:
        app:
          - path: /meili_data
            subPath: meilisearch
