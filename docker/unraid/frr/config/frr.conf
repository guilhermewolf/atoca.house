frr defaults traditional
hostname unraid-frr
log stdout
no ipv6 forwarding
!
router bgp 64515
 bgp router-id 192.168.40.160
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.40.1 remote-as 64513
 neighbor 192.168.40.1 description ucg-max
 !
 address-family ipv4 unicast
  network 192.168.60.250/32
 exit-address-family
exit
!
line vty
!
