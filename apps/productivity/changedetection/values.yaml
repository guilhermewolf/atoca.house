---
values:
controllers:
  changedetection:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          tag: 0.70.2
        env:
          PORT: &port 5000
          USE_X_SETTINGS: 1
          PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/chromium?stealth=true&blockAds=true&--disable-web-security=true
          ALLOW_IANA_RESTRICTED_ADDRESSES: true
          BASE_URL: "https://changedetection.atoca.house"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 15m
            memory: 320Mi
          limits:
            memory: 1Gi
      browser:
        securityContext:
          allowPrivilegeEscalation: false
        # browserless v1 (browserless/chrome) is unmaintained; its CVE report
        # outgrew etcd's request limit and broke trivy scans. v2 moved stealth
        # and ad-blocking to PLAYWRIGHT_DRIVER_URL query params.
        image:
          repository: ghcr.io/browserless/chromium
          tag: v2.61.0@sha256:bacd4022297429ff64f5e4d67b062263139a4fee4d5b49a480a022a072fb22d4
        env:
          - { name: TIMEOUT, value: "300000" }
          - { name: CONCURRENT, value: "10" }
          # Default logs :trace, which echoes every failed page sub-resource
          # ("error: Failed to load resource") into the hourly error alert.
          - { name: DEBUG, value: "browserless*,-**:trace,-**:verbose" }
        resources:
          requests:
            cpu: 25m
            memory: 1536Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.20/24"],
        "mac": "3e:d2:65:8a:17:c9"
      }]

service:
  app:
    controller: changedetection
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - changedetection.atoca.house
    rules:
      - backendRefs:
          - name: changedetection
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /datastore

  tmp:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      changedetection:
        browser:
          - path: /tmp

  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      changedetection:
        browser:
          - path: /dev/shm
