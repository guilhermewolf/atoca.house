---
# Admin-managed Ceph-CSI drivers (Rook v1.20+). Replaces the CSI settings that
# previously lived in the rook-ceph operator chart. Values here reproduce the
# live Driver/OperatorConfig CRs to keep CSI behaviour unchanged across upgrade.
operatorConfig:
  driverSpecDefaults:
    clusterName: rook-ceph
    # Chart default maxLogSize "10Gi" breaks the CSI log-rotator: logrotate's
    # size directive only accepts k/M/G, so "Gi" -> "unknown unit 'i'".
    log:
      rotation:
        maxLogSize: "10G"
    # Preserve: live CRs have enableMetadata: true (RBD image metadata).
    # Per-driver fields render null and inherit this default.
    enableMetadata: true
    controllerPlugin:
      # Required: CephCluster uses host networking (network.provider: host),
      # so the CSI provisioner must be on the host network to reach the mons.
      hostNetwork: true
      replicas: 2

drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    snapshotPolicy: volumeSnapshot
    # Chart renders the per-driver Driver CR with its own default maxLogSize
    # "10Gi", which beats operatorConfig.driverSpecDefaults in the operator
    # merge. Must override here too or logrotate fails: "unknown unit 'i'".
    log:
      rotation:
        maxLogSize: "10G"
    controllerPlugin:
      hostNetwork: true
      replicas: 2
      # ceph-csi-operator injects 512Mi/250m for plugins and 128Mi/100m for
      # sidecars when unset. 7d p99: plugin 70Mi, provisioner 63Mi, attacher
      # 57Mi, resizer 53Mi, snapshotter 51Mi; p95 cpu <=5m for all.
      # Limits are pinned to the operator's current defaults so behaviour is
      # unchanged; only requests are reduced.
      resources:
        plugin:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 1Gi
        provisioner:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
        attacher:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
        resizer:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
        snapshotter:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
    nodePlugin:
      # DaemonSet: these requests are charged on every node.
      # 7d p99: plugin 70Mi, driver-registrar 7Mi; p95 cpu <=2m.
      resources:
        plugin:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 1Gi
        registrar:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    snapshotPolicy: volumeGroupSnapshot
    kernelMountOptions:
      ms_mode: prefer-crc
    log:
      rotation:
        maxLogSize: "10G"
    controllerPlugin:
      hostNetwork: true
      replicas: 2
      # 7d p99: plugin 18Mi, provisioner 19Mi, resizer 16Mi, attacher 15Mi,
      # snapshotter 15Mi; p95 cpu <=3m. Limits pinned to current defaults.
      resources:
        plugin:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 1Gi
        provisioner:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        attacher:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        resizer:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        snapshotter:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
    nodePlugin:
      # DaemonSet: charged on every node. 7d p99: plugin 20Mi, registrar 7Mi.
      resources:
        plugin:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 1Gi
        registrar:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

  nfs:
    enabled: false

  nvmeof:
    enabled: false
