---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crowdsec-appsec
  namespace: crowdsec
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
