---
# Fields the Headlamp VictoriaLogs plugin queries on (namespace, workload, pod,
# job_name, node, source). They overwrite same-named keys an app may log via
# merge_log, so the plugin never matches on stray app fields.
luaScripts:
  headlamp_fields.lua: |
    function headlamp_fields(tag, ts, r)
      r["namespace"] = r["k_namespace_name"]
      r["pod"] = r["k_pod_name"]
      r["container"] = r["k_container_name"]
      r["node"] = r["k_host"]
      r["source"] = "kubernetes"
      r["job_name"] = nil
      local w = r["k_pod_name"]
      local refs = r["k_ownerReferences"]
      local o = type(refs) == "table" and refs[1] or nil
      if o and o["name"] then
        w = o["name"]
        if o["kind"] == "ReplicaSet" then
          -- strip pod-template-hash: ReplicaSet -> Deployment
          w = (string.gsub(w, "%-[^-]+$", ""))
        elseif o["kind"] == "Job" then
          r["job_name"] = o["name"]
          -- strip CronJob schedule suffix: Job -> CronJob
          w = (string.gsub(w, "%-%d+$", ""))
        end
      end
      r["workload"] = w
      r["k_ownerReferences"] = nil
      return 2, ts, r
    end
config:
  service: |-
    [SERVICE]
      daemon off
      flush {{ .Values.flush }}
      log_level {{ .Values.logLevel }}
      parsers_file /fluent-bit/etc/parsers.conf
      parsers_file /fluent-bit/etc/conf/custom_parsers.conf
      http_server on
      http_listen 0.0.0.0
      http_port {{ .Values.metricsPort }}
      health_check on
      storage.path /var/log/flb-storage/
      storage.sync normal
      storage.checksum off
      storage.backlog.mem_limit 50M

  inputs: |-
    [INPUT]
      name tail
      alias kubernetes
      path /var/log/containers/*.log
      parser containerd
      tag kubernetes.*
      skip_empty_lines on
      skip_long_lines on

  filters: |-
    [FILTER]
      name kubernetes
      match kubernetes.*
      merge_log on
      kube_tag_prefix kubernetes.var.log.containers.
      k8s-logging.parser on
      k8s-logging.exclude on
      namespace_labels off
      annotations off
      owner_references on

    [FILTER]
      name nest
      match kubernetes.*
      operation lift
      nested_under kubernetes
      add_prefix k_

    [FILTER]
      name lua
      match kubernetes.*
      script /fluent-bit/scripts/headlamp_fields.lua
      call headlamp_fields

    [FILTER]
      name nest
      match kubernetes.*
      operation lift
      nested_under k_labels
      add_prefix k_labels_

    [FILTER]
      name modify
      match kubernetes.*
      rename k_labels_app.kubernetes.io/name app
      rename k_labels_app app
      rename k_labels_k8s-app app

  customParsers: |-
    [PARSER]
      name containerd
      format regex
      regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
      time_key time
      time_format %Y-%m-%dT%H:%M:%S.%L%z

  outputs: |-
    [OUTPUT]
      name http
      match kubernetes.*
      host victoria-logs-server.victoria-logs.svc.cluster.local
      port 9428
      uri /insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app&_msg_field=log&_time_field=date
      format json_lines
      json_date_format iso8601
      compress gzip
      log_response_payload false
      retry_limit false
      net.keepalive on
      net.keepalive_idle_timeout 30
      net.connect_timeout 10
      workers 2

dashboards:
  enabled: true
serviceMonitor:
  enabled: true
logLevel: warn
