---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    # Hermes Agent configuration
    # Docs: https://hermes-agent.nousresearch.com/docs
    # Main model: ChatGPT Plus subscription, reached DIRECTLY through the
    # `openai-codex` provider (OAuth device-flow, `hermes auth add openai-codex`,
    # token in /opt/data/auth.json). It used to go through litellm's `chatgpt/*`
    # shim, which cannot refresh an OAuth subscription and fails every call with
    # "Unknown items in responses API response: []". hermes owns the credential
    # pool — refresh, rotation and exhaustion tracking — so it talks to the
    # subscription itself. The picker also offers gpt-5.5 / gpt-5.4-mini.
    model:
      default: gpt-5.4
      provider: openai-codex
    providers:
      litellm:
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        api_key: ${LITELLM_MASTER_KEY}
    # Fallback chain, tried in order on rate-limit / overload / connection error.
    # Subscription first (the other paid account), then litellm's keyed cloud
    # tiers, and only then local ollama — the GPU is the last resort, never the
    # default. Free-tier caps are small (groq 8k TPM, cerebras 30k TPM), so a
    # long conversation skips them via litellm's pre-call context checks and
    # lands wherever it fits.
    fallback_model:
      - provider: nous
        model: anthropic/claude-opus-4.8
        base_url: https://inference-api.nousresearch.com/v1
      - provider: custom:litellm
        model: cerebras-gpt-oss-120b
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        key_env: LITELLM_MASTER_KEY
      - provider: custom:litellm
        model: groq-gpt-oss-120b
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        key_env: LITELLM_MASTER_KEY
      - provider: custom:litellm
        model: qwen3.5-9b
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        key_env: LITELLM_MASTER_KEY
    # Side tasks never touch the metered subscriptions: they go to litellm's
    # free cloud tiers, which is exactly what those keys are for. Vision is the
    # exception — gpt-oss is text-only, so it uses the Nous default (gemini
    # flash class), the cheapest multimodal route available.
    auxiliary:
      title_generation:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      compression:
        provider: custom:litellm
        model: cerebras-gpt-oss-120b
      web_extract:
        provider: custom:litellm
        model: groq-gpt-oss-120b
        reasoning_effort: low
      session_search:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      vision:
        provider: nous
        model: ""
    toolsets:
      - hermes-cli
    terminal:
      backend: local
      # Default cwd is the atoca.house checkout maintained by the clone-repo
      # init container. Being inside the git root is what makes hermes pick up
      # the repo's CLAUDE.md as project context; the GitOps/PR procedure itself
      # is the `atoca-gitops` skill on the PVC (/opt/data/skills/devops/).
      cwd: /opt/data/workspace/atoca.house
      timeout: 300
      persistent_shell: true
      # GITHUB_TOKEN must reach the shell: /opt/data/.gitconfig sets a
      # credential helper that echoes it for github.com pushes. Without the
      # passthrough the sandbox filter strips it and every push 403s.
      env_passthrough:
        - GITHUB_TOKEN
    # Hermes' own markdown (SOUL.md, MEMORY.md, skills/) lives on the PVC and
    # nowhere else — not in this ConfigMap and not in the atoca.house tree. The
    # GitOps procedure is the `atoca-gitops` skill under
    # /opt/data/skills/devops/atoca-gitops/. Nothing to discover inside the
    # checkout, so project scanning stays off.
    skills:
      project_discovery: false
    # Git work is routine here, so the everyday commands are pre-approved and
    # the genuinely irreversible ones are denied outright (deny beats yolo).
    approvals:
      mode: smart
      deny:
        # Blind force-push is out; `--force-with-lease` stays allowed because
        # re-pushing a rebased feature branch needs it (the glob below does not
        # match it — it requires a space right after `--force`).
        - "git push --force *"
        - "git push -f *"
        - "git push origin main*"
        - "git push*HEAD:main*"
        - "git branch -D main*"
      smart_policy: |
        Context: this shell owns a checkout of guilhermewolf/atoca.house at
        /opt/data/workspace/atoca.house. That repo is GitOps — anything merged
        to main deploys to the live Kubernetes cluster.
        APPROVE routine repo work: git status/diff/log/fetch/pull/checkout/
        switch/branch/add/commit/stash/rebase onto origin/main, git push of a
        feature branch, kubectl get/describe/logs (read-only), yq/jq/grep/sed
        over files inside the checkout.
        ESCALATE anything that rewrites shared history, touches files outside
        /opt/data/workspace/atoca.house, or writes to the cluster
        (kubectl apply/delete/patch/scale, argocd sync).
        Never approve a direct push to main — changes reach main through a pull
        request that a human merges.
    command_allowlist:
      - git fetch *
      - git pull --rebase*
      - git rebase *
      - git push *
      - git push --force-with-lease*
      - git checkout *
      - git switch *
      - git restore *
      - git stash *
    # Memory: built-in MEMORY.md/USER.md always active; external provider is additive.
    # Holographic = local SQLite (FTS5 + trust scoring + contradiction detection),
    # zero extra infra, no LLM/embeddings/Qdrant, no GPU. DB lives on the /opt/data
    # PVC (covered by Volsync backup). See plugins.hermes-memory-store below.
    memory:
      provider: holographic
      auto_migrate: true
      auto_summarize:
        threshold: 50
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    group_sessions_per_user: false
    streaming:
      enabled: false
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    web:
      search_backend: searxng
    discord:
      require_mention: false
      auto_thread: false
      reactions: false
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
      tool_use_enforcement: auto
    # Holographic memory store (local SQLite on the /opt/data PVC).
    plugins:
      hermes-memory-store:
        db_path: /opt/data/memory_store.db
        auto_extract: true
        default_trust: 0.5
    # External MCP servers. In-cluster ones go through the toolhive proxies in
    # the mcp namespace (streamable HTTP at /mcp, no auth for in-cluster
    # traffic — the proxies hold the upstream credentials). Env vars expand
    # the same way as LITELLM_MASTER_KEY above.
    mcp_servers:
      # PR flow against guilhermewolf/atoca.house — the hermes-docs-recommended
      # stdio server with a tool whitelist ("best default for sensitive
      # systems"). Token is a fine-grained PAT scoped to that repo only
      # (Contents RW, Pull requests RW, Metadata R), from hermes-secret.
      # merge_pull_request intentionally NOT whitelisted — humans merge.
      #
      # Division of labour: all *content* changes go through the local git
      # checkout at /opt/data/workspace/atoca.house (branch, commit, rebase,
      # push — the only way to rebase and to see a real diff). This server is
      # for the GitHub-side operations git cannot do: opening/reading PRs,
      # CI status, issues. The file-writing tools (push_files,
      # create_or_update_file, create_branch) are deliberately left out so
      # there is exactly one write path and no divergence between them.
      github:
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
        tools:
          include:
            - get_file_contents
            - search_code
            - list_commits
            - create_pull_request
            - list_pull_requests
            - get_pull_request
            - get_pull_request_status
            - get_pull_request_files
            - get_pull_request_comments
            - get_pull_request_reviews
            - update_pull_request_branch
            - list_issues
            - get_issue
            - create_issue
            - update_issue
            - add_issue_comment
        prompts: false
        resources: false
      # n8n built-in instance-level MCP (N8N_MCP_ACCESS_ENABLED=true on the
      # n8n deploy). Probed: 401 without key = endpoint live.
      n8n:
        url: http://n8n.n8n.svc.cluster.local/mcp-server/http
        headers:
          Authorization: Bearer ${N8N_API_KEY}
      context7:
        url: http://mcp-context7-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      memory:
        url: http://mcp-memory-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      homeassistant:
        url: http://mcp-ha-mcp-proxy.mcp.svc.cluster.local:8080/mcp
    stt:
      enabled: true
      provider: local
      local:
        model: small
        language: ""
