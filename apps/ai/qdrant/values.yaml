---
controllers:
  qdrant:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/qdrant/qdrant
          tag: v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
        args:
          - ./qdrant
          - --disable-telemetry
        envFrom:
          - secretRef:
              name: qdrant-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &port 6333
              initialDelaySeconds: 15
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 640Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

service:
  app:
    controller: qdrant
    ports:
      http:
        port: 6333
      grpc:
        port: 6334

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ceph-block
    globalMounts:
      - path: /qdrant/storage

  snapshots:
    type: emptyDir
    globalMounts:
      - path: /qdrant/snapshots
