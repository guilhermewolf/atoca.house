---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-kf-config
  namespace: hermes-kf
data:
  # Copied over /opt/data/config.yaml on every start (copy-config init) — this
  # file is the source of truth; edits made in the dashboard are discarded.
  # SOUL.md, memories and skills live on the PVC only (not in this public repo).
  config.yaml: |
    # hermes-kf — KitchenFrequencies.TV team operator, WhatsApp group only.
    # Docs: https://hermes-agent.nousresearch.com/docs

    # --- Models ---------------------------------------------------------------
    # Every model goes through LiteLLM, which holds the only ChatGPT login and
    # the spend-capped Nous API key; this pod holds no OAuth (a login held in
    # two places revokes the other). Main = flat-rate ChatGPT Pro; Nous credit
    # ($10/mo key cap) is the fallback, never the default.
    model:
      provider: custom:litellm
      default: chatgpt/gpt-6.1-sol
    providers:
      litellm:
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        api_key: ${LITELLM_MASTER_KEY}
    fallback_providers:
      - provider: custom:litellm
        model: nous-claude-sonnet
      - provider: custom:litellm
        model: openrouter-free
      - provider: custom:litellm
        model: qwen3.5-9b
    delegation:
      provider: custom:litellm
      model: chatgpt/gpt-6-luna
    # Pin EVERY auxiliary task: anything unlisted runs on the main model.
    auxiliary:
      approval:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
        timeout: 30
      vision:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      compression:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      background_review:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      review:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      curator:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
        timeout: 600
      title_generation:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      memory_query_rewrite:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      skills_hub:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      mcp:
        provider: custom:litellm
        model: groq-gpt-oss-120b
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
      tool_use_enforcement: auto
      verify_on_stop: false
    timezone: Europe/Amsterdam

    # --- Workspace --------------------------------------------------------------
    # No git repo here: code/deploy work is handed off as a Vikunja ticket
    # (handoff skill). Shorts history lives in workspace/shorts/.
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
      env_passthrough:
        - POSTIZ_API_KEY
        - POSTIZ_API_URL
        - OPUS_API_KEY
    # Skills live on the PVC only (/opt/data/skills — private, Volsync-backed).
    skills:
      project_discovery: false
    # Scheduled jobs are created on purpose by a human (`hermes cron`), never by
    # the agent on its own; the weekly shorts job lives in cron/jobs.json.
    cron:
      allow_agent_scheduling: false

    # --- Guardrails -------------------------------------------------------------
    approvals:
      mode: smart
      deny:
        - "rm -rf *"
        - "postiz posts:create*-t now*"
        - "postiz posts:create*-t schedule*"
      smart_policy: |
        Context: KitchenFrequencies.TV team assistant in a WhatsApp group. The
        shell is for the postiz CLI, OpusClip API calls (curl), ffmpeg/scripts
        from the weekly-shorts skill, and files under /opt/data/workspace.
        APPROVE: read-only commands, postiz list/analytics commands,
        `postiz posts:create` with `-t draft`, curl GETs, scripts shipped in
        /opt/data/skills, file work inside /opt/data/workspace.
        ESCALATE anything that publishes or schedules content, sends messages
        to people outside the group, deletes data, or touches files outside
        /opt/data/workspace.
    security:
      redact_secrets: true
    privacy:
      redact_pii: true

    # --- Memory -----------------------------------------------------------------
    # Built-in MEMORY.md/USER.md (on the PVC) + holographic local
    # fact store (people/brand facts) + the atoca-memory graph via the `atoca-memory` MCP.
    memory:
      provider: holographic
    plugins:
      hermes-memory-store:
        db_path: /opt/data/memory_store.db
        auto_extract: true
        default_trust: 0.5
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20

    # --- WhatsApp -----------------------------------------------------------------
    # Baileys bridge in bot mode (WHATSAPP_MODE=bot in values.yaml). Group-only:
    # DMs are disabled; only the allowlisted group can trigger the bot.
    # ${GROUP_ID} is substituted by the copy-config init container.
    # Pairing (one-time): `hermes whatsapp` in the pod; the session persists on
    # the PVC at /opt/data/platforms/whatsapp/session.
    whatsapp:
      unauthorized_dm_behavior: ignore
      dm_policy: disabled
      group_policy: allowlist
      group_allow_from:
        - "${GROUP_ID}@g.us"
    # One shared session for the whole group.
    group_sessions_per_user: false
    # Explicit toolsets keep ~50 unused tool schemas out of every turn.
    platform_toolsets:
      whatsapp:
        - web
        - browser
        - vision
        - terminal
        - file
        - skills
        - memory
        - session_search
        - todo
        - clarify
        - vikunja
        - outline
        - context7
        - postiz
        - n8n
        - atoca-memory
    display:
      platforms:
        whatsapp:
          tool_progress: "off"
    streaming:
      enabled: false
    # Search via in-cluster SearXNG; pages/browsing via the local Chromium.
    web:
      search_backend: searxng
    # WhatsApp voice notes -> local faster-whisper on CPU.
    stt:
      enabled: true
      provider: local
      local:
        model: small
        language: ""

    # --- MCP servers --------------------------------------------------------------
    mcp_servers:
      # Tickets: project KITCHENFREQUENCIES.TV (id 69) only.
      vikunja:
        url: http://mcp-vikunja-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      # Docs: collection KitchenFrequencies.TV — the source of truth.
      outline:
        url: https://outline.atoca.house/mcp
        headers:
          Authorization: Bearer ${OUTLINE_API_KEY}
      context7:
        url: http://mcp-context7-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      # Postiz native MCP (channel listing, drafts). Drafts only, ever.
      postiz:
        url: https://postiz.atoca.house/api/mcp
        headers:
          Authorization: Bearer ${POSTIZ_API_KEY}
      # n8n instance MCP: kf-events / kf-notify / shorts pipeline workflows.
      n8n:
        url: http://n8n.n8n.svc.cluster.local/mcp-server/http
        headers:
          Authorization: Bearer ${N8N_API_KEY}
      # atoca-memory knowledge graph (shared with Claude Code).
      atoca-memory:
        url: http://mcp-memory-mcp-proxy.mcp.svc.cluster.local:8080/mcp
