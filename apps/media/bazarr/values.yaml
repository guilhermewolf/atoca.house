controllers:
  bazarr:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      bazarr:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/home-operations/bazarr
          tag: 1.6.2@sha256:b8434a7339ebd9c2bfe4464c28db79944e0f52f47da85345fc7e0563c19f83ac
          pullPolicy: IfNotPresent
        env:
          BAZARR__PORT: &port 6767
        resources:
          requests:
            cpu: 75m
            memory: 320Mi
          limits:
            memory: 1Gi
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/system/ping
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/system/ping
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
      exportarr:
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
        args: ["bazarr"]
        env:
          PORT: &metricsPort 9707
          URL: http://localhost:6767
          APIKEY:
            valueFrom:
              secretKeyRef:
                name: bazarr-secret
                key: BAZARR_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
service:
  bazarr:
    controller: bazarr
    ports:
      http:
        port: *port
      metrics:
        port: *metricsPort

serviceMonitor:
  bazarr:
    endpoints:
      - port: metrics

route:
  bazarr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - bazarr.atoca.house
    rules:
      - backendRefs:
          - name: bazarr
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  bazarr:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config

  data:
    enabled: true
    type: nfs
    server: nas.internal
    path: /mnt/user/data
    globalMounts:
      - path: /data
        readOnly: false

  tmp:
    type: emptyDir
