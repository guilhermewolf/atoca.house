---
controllers:
  bentopdf:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # renovate: datasource=docker depName=ghcr.io/alam00000/bentopdf
          repository: ghcr.io/alam00000/bentopdf
          tag: 2.8.10@sha256:039239902a01e58a5a0f52e29039fafa18ffc2a481bb8acd807599f1c6dde7ef
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 8080
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
defaultPodOptions:
  securityContext:
    # Image's nginx user
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile: { type: RuntimeDefault }
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - pdf.atoca.house
    rules:
      - backendRefs:
          - name: bentopdf
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
        subPath: tmp
      - path: /etc/nginx/tmp
        subPath: nginx
      - path: /var/cache/nginx
        subPath: cache
