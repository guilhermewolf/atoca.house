---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Renders the full runner config. The uuid/token pair comes from offline
# registration on the Forgejo server:
#   kubectl -n forgejo exec deploy/forgejo -- \
#     forgejo forgejo-cli actions register --secret <40-hex> --name k8s-runner
# The command prints the UUID; the token is the 40-hex secret itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-runner-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          log:
            level: info

          runner:
            capacity: 2
            timeout: 3h
            shutdown_timeout: 3h
            insecure: false
            fetch_timeout: 5s
            fetch_interval: 2s
            labels:
              - docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04
              - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04
              - self-hosted:docker://ghcr.io/catthehacker/ubuntu:act-22.04
            envs:
              # Job containers live inside the DinD daemon, so "host-gateway"
              # from their point of view is the dind container itself
              DOCKER_HOST: tcp://dind_container.docker.internal:2375

          cache:
            enabled: true
            dir: /data/cache

          container:
            network: bridge
            privileged: false
            docker_host: tcp://127.0.0.1:2375
            options: --add-host=dind_container.docker.internal:host-gateway
            valid_volumes: []
            workdir_parent: workspace

          host:
            workdir_parent: /data/workspace

          server:
            connections:
              forgejo:
                url: https://forge.atoca.house/
                uuid: "{{ .FORGEJO_RUNNER_UUID }}"
                token: "{{ .FORGEJO_RUNNER_TOKEN }}"
  dataFrom:
    - extract:
        key: forgejo-runner-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
