---
# Scan jobs pull images and the trivy DB; keep concurrency low for a homelab.
excludeNamespaces: "kube-system,kube-public,kube-node-lease"

operator:
  scanJobsConcurrentLimit: 3
  scanJobTTL: 300s
  scanJobTimeout: 20m
  builtInTrivyServer: true
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerScanOnlyCurrentRevisions: true
  # Node collector reads kubelet/apiserver files from host paths that Talos
  # doesn't have, so the CIS infra assessment would only produce noise.
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  # SBOMs are big CRs in etcd and nothing consumes them here.
  sbomGenerationEnabled: false
  annotations:
    reloader.stakater.com/auto: "true"

trivy:
  slow: true
  storageClassName: ceph-block
  ignoreUnfixed: true
  severity: MEDIUM,HIGH,CRITICAL
  # Scanning big images (e.g. chromium) OOMs at the 500M default.
  resources:
    requests:
      cpu: 100m
      memory: 100M
    limits:
      cpu: 500m
      memory: 1Gi

trivyOperator:
  skipResourceByLabels: "app.kubernetes.io/created-by=volsync"
  # Scan containers are named after the scanned container; for bare pods that
  # includes the injected "k8tz" init container, so k8tz injecting its own
  # "k8tz" init container makes the scan pod invalid (duplicate name).
  scanJobAnnotations: "k8tz.io/inject=false"

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi
