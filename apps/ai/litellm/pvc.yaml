---
# ChatGPT subscription OAuth token (auth.json). Must be writable and persistent:
# litellm rotates the single-use refresh token in place (~every 10 days).
# RWO is fine at replicas: 1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-chatgpt-auth
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 64Mi
