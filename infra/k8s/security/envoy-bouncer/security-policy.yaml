---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-bouncer
  namespace: kube-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: atoca-house-external
    # Internal Gateway deliberately NOT bound: its clients are LAN/pod IPs,
    # which crowdsecurity/whitelists drops, so no decision can ever exist for
    # them and IP reputation is a no-op there. Binding it only put the WAF on
    # every admin-UI request (latency + false positives) for no ban value.
  extAuth:
    failOpen: true
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: envoy-bouncer
          namespace: envoy-bouncer
          port: 8080
          weight: 1
