---
controllers:
  donetick:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # renovate: datasource=docker depName=docker.io/donetick/donetick
          repository: docker.io/donetick/donetick
          tag: v0.1.79@sha256:a1cc21dd5a37acb5009009f13e5d2529153049361afb0a1cd94bde312382d36a
        env:
          DT_ENV: selfhosted
          DT_NAME: Donetick
          DT_SERVER_PORT: &port 2021
          DT_SERVER_PUBLIC_HOST: https://donetick.atoca.house
          DT_SERVER_CORS_ALLOW_ORIGINS: https://donetick.atoca.house,capacitor://localhost,https://localhost,http://localhost
          # SSO-only: 403 on password signup/login/reset. OIDC users are still
          # auto-created on first login, gated by Authelia's donetick_policy.
          DT_DISABLE_PASSWORD_AUTH: true
          DT_IS_USER_CREATION_DISABLED: true
          DT_SERVER_SERVE_SWAGGER: false
          DT_EMAIL_APPHOST: https://donetick.atoca.house
          # Postgres (Crunchy) via PgBouncer: donetick hardcodes sslmode=disable
          # and Postgres itself only accepts hostssl, while PgBouncer allows
          # plaintext clients (client_tls_sslmode: prefer). Creds via donetick-db-secret.
          DT_DATABASE_TYPE: postgres
          DT_DATABASE_MIGRATION: true
          # Attachments/avatars in Garage S3 (keys via donetick-secret)
          DT_STORAGE_STORAGE_TYPE: remote
          DT_STORAGE_ENDPOINT: https://s3.atoca.house
          DT_STORAGE_REGION: eu-east-1
          DT_STORAGE_BUCKET_NAME: donetick
          DT_STORAGE_BASE_PATH: assets
          DT_STORAGE_PATH_STYLE: true
          # Authelia OIDC (client secret via donetick-secret)
          DT_OAUTH2_NAME: Authelia
          DT_OAUTH2_CLIENT_ID: donetick
          DT_OAUTH2_REDIRECT_URL: https://donetick.atoca.house/auth/oauth2
          DT_OAUTH2_AUTH_URL: https://auth.atoca.house/api/oidc/authorization
          DT_OAUTH2_TOKEN_URL: https://auth.atoca.house/api/oidc/token
          DT_OAUTH2_USER_INFO_URL: https://auth.atoca.house/api/oidc/userinfo
          DT_OAUTH2_SCOPES: openid,profile,groups,email
          # No DT_OAUTH2_ADMIN_GROUPS: the v0.1.79 web frontend hardcodes
          # scope 'openid profile email', so the groups claim never arrives and
          # the per-login role sync would demote every admin to member.
          # Circle roles are managed in the Donetick UI instead.
          # Put every OIDC user in one shared household circle
          DT_SINGLE_CIRCLE_INSTANCE: true
        envFrom:
          - secretRef:
              name: donetick-db-secret
          - secretRef:
              name: donetick-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
    pod:
      annotations:
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }
        k8s.ksgate.org/garage-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "garage",
            "namespace": "garage"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
        - name: k8s.ksgate.org/garage-service

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    seccompProfile: { type: RuntimeDefault }

service:
  app:
    controller: donetick
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - donetick.atoca.house
    rules:
      - backendRefs:
          - name: donetick
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
