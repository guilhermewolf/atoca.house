controllers:
  sonarr:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      sonarr:
        image:
          repository: ghcr.io/home-operations/sonarr
          tag: 5.0.0.2838@sha256:5d4f89a36a06fe44039e7533e743b4c7bf0e0d82868c86ea8ed8178abd1cbe4b
        env:
          SONARR__APP__INSTANCENAME: Sonarr
          SONARR__APP__THEME: dark
          # OIDC (Authelia, authorization_policy: admins). Secret + allowed user in sonarr-secret.
          SONARR__AUTH__METHOD: Oidc
          SONARR__AUTH__OIDCAUTHORITY: https://auth.atoca.house
          SONARR__AUTH__OIDCCLIENTID: sonarr
          SONARR__LOG__DBENABLED: "False"
          SONARR__LOG__LEVEL: info
          SONARR__SERVER__PORT: &port 80
          # Trust X-Forwarded-Proto from the gateway (pod CIDR) so the OIDC redirect_uri is https.
          SONARR__SERVER__TRUSTEDNETWORKS: 10.244.0.0/16
        envFrom:
          - secretRef:
              name: "sonarr-secret"
        probes:
          liveness:
            enabled: true
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: *port
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  sonarr:
    controller: sonarr
    ports:
      http:
        port: *port

route:
  sonarr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - sonarr.atoca.house
    rules:
      - backendRefs:
          - name: sonarr
            port: 80
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /config/

  scripts:
    type: configMap
    name: sonarr-configmap
    defaultMode: 0775
    globalMounts:
      - readOnly: true
  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/
    globalMounts:
      - path: /data
  tmp:
    type: emptyDir
