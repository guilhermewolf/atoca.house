controllers:
  n8n:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      n8n:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: 2.38.3@sha256:4b76b9c5a69dc1c0f26bedd21b4e281ac2c84bd88d33857487b9e63dd0a42e87
          pullPolicy: IfNotPresent
        env:
          N8N_PROTOCOL: https
          N8N_PORT: &port 80
          N8N_HOST: &hostName n8n.atoca.house
          N8N_WEBHOOK_URL: https://hooks.atoca.house
          N8N_EDITOR_BASE_URL: https://n8n.atoca.house
          GENERIC_TIMEZONE: Europe/Amsterdam
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
          N8N_COMMUNITY_PACKAGES_ENABLED: "true"
          N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
          N8N_RUNNERS_TASK_TIMEOUT: "300"
          N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
          N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
          N8N_PROXY_HOPS: "1"
          N8N_MCP_MANAGED_BY_ENV: "true"
          N8N_MCP_ACCESS_ENABLED: "true"
          NODE_FUNCTION_ALLOW_BUILTIN: crypto
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
        envFrom:
          - secretRef:
              name: n8n-app-secret
        resources:
          requests:
            cpu: 10m
            memory: 768Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [1000]
        seccompProfile:
          type: RuntimeDefault

service:
  n8n:
    controller: n8n
    ports:
      http:
        port: *port

route:
  n8n:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - *hostName
    rules:
      - backendRefs:
          - name: n8n
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

  webhooks:
    enabled: true
    kind: HTTPRoute
    annotations:
      gatus.home-operations.com/endpoint: |-
        url: https://hooks.atoca.house/webhook/gatus-probe
        conditions: ["[STATUS] == 403"]
    parentRefs:
      - name: atoca-house-external
        namespace: kube-system
    hostnames:
      - hooks.atoca.house
    rules:
      - backendRefs:
          - name: n8n
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /webhook/

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /home/node/.n8n
