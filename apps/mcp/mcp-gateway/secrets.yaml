---
# 1Password items:
#   authelia    -> MCP_GATEWAY_OAUTH_CLIENT_SECRET (same item Authelia reads)
#   mcp-gateway -> everything else
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mcp-gateway-secret
    creationPolicy: Owner
    template:
      data:
        AUTHELIA_CLIENT_SECRET: "{{ .MCP_GATEWAY_OAUTH_CLIENT_SECRET }}"
        # Stored base64-encoded (single line) so 1Password can't mangle the
        # PEM newlines: openssl ecparam -genkey -name prime256v1 -noout | base64
        SIGNING_KEY: "{{ .MCP_GATEWAY_SIGNING_KEY | b64dec }}"
        HMAC_SECRET: "{{ .MCP_GATEWAY_HMAC_SECRET }}"
        OUTLINE_OAUTH_CLIENT_SECRET: "{{ .OUTLINE_OAUTH_CLIENT_SECRET }}"
        N8N_AUTHORIZATION: "Bearer {{ .N8N_MCP_TOKEN }}"
  # Only this one field from `authelia`: extracting the whole item collides
  # with same-named keys (authelia has its own OUTLINE_OAUTH_CLIENT_SECRET for
  # Outline's OIDC login, which silently overrode ours).
  data:
    - secretKey: MCP_GATEWAY_OAUTH_CLIENT_SECRET
      remoteRef:
        key: authelia
        property: MCP_GATEWAY_OAUTH_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
  dataFrom:
    - extract:
        key: mcp-gateway
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
