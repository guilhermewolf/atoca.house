---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: trek-restore
  namespace: trek
spec:
  trigger:
    manual: restore-once
  restic:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheStorageClassName: openebs-hostpath
    cleanupCachePVC: true
    cleanupTempPVC: true
    enableFileDeletion: true
    repository: trek-r2-secret
    copyMethod: Snapshot
    destinationPVC: trek-data
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: trek-uploads-restore
  namespace: trek
spec:
  trigger:
    manual: restore-once
  restic:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheStorageClassName: openebs-hostpath
    cleanupCachePVC: true
    cleanupTempPVC: true
    enableFileDeletion: true
    repository: trek-uploads-garage-secret
    copyMethod: Snapshot
    destinationPVC: trek-uploads
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
