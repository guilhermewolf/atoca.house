---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
#
# GENERATED LAYOUT — community widget templates are vendored verbatim from
# https://github.com/glanceapp/community-widgets with only options/env patched.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-ops
  annotations:
    reloader.stakater.com/match: "true"
data:
  glance.yml: |
    server:
      port: 80
      proxied: true

    branding:
      logo-text: "#"
      app-name: atoca ops

    theme:
      background-color: 240 21 15
      primary-color: 224 76 65
      positive-color: 142 71 45
      negative-color: 0 72 51

    pages:
      # =========================================================================
      # OPS — cluster health at a glance.
      # =========================================================================
      - name: Ops
        show-mobile-header: true
        head-widgets:
          - type: markets
            hide-header: true
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: EURUSD=X
                name: EUR/USD
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Europe/Amsterdam
                    label: Amsterdam

              - type: extension
                title: Cluster Nodes
                url: http://glance-ops-k8s-extension:8080/extension/nodes
                allow-potentially-dangerous-html: true
                cache: 10s

              - $include: w-unifi.yml

          - size: full
            widgets:
              - type: search
                search-engine: https://search.atoca.house/search?q={QUERY}
                new-tab: true
                autofocus: true
                bangs:
                  - title: GitHub repo
                    shortcut: "!r"
                    url: https://github.com/guilhermewolf/atoca.house/search?q={QUERY}
                  - title: Kubernetes docs
                    shortcut: "!k8s"
                    url: https://kubernetes.io/search/?q={QUERY}
                  - title: Artifact Hub
                    shortcut: "!ah"
                    url: https://artifacthub.io/packages/search?ts_query_web={QUERY}

              - $include: w-cluster-health.yml

              - type: monitor
                title: Core Infrastructure
                cache: 2m
                sites:
                  - title: ArgoCD
                    url: https://argocd.atoca.house
                    icon: sh:argo-cd-light
                  - title: Headlamp
                    url: https://headlamp.atoca.house
                    icon: sh:headlamp-light
                  - title: Grafana
                    url: https://grafana.atoca.house
                    icon: sh:grafana-light
                  - title: Prometheus
                    url: https://prometheus.atoca.house
                    icon: sh:prometheus-light
                  - title: Gatus
                    url: https://status.atoca.house
                    icon: sh:gatus-light
                  - title: Authelia
                    url: https://auth.atoca.house
                    icon: sh:authelia-light
                  - title: LLDAP
                    url: https://lldap.atoca.house
                    icon: sh:lldap-light
                  - title: Rook-Ceph
                    url: https://rook.atoca.house
                    icon: sh:ceph-light
                  - title: n8n
                    url: https://n8n.atoca.house
                    icon: sh:n8n-light

              - type: repository
                repository: guilhermewolf/atoca.house
                pull-requests-limit: 10
                issues-limit: 3
                commits-limit: 5

          - size: small
            widgets:
              - type: bookmarks
                groups:
                  - title: Cluster
                    color: 224 90 65
                    links:
                      - title: ArgoCD
                        url: https://argocd.atoca.house
                        icon: sh:argo-cd-light
                      - title: Headlamp
                        url: https://headlamp.atoca.house
                        icon: sh:headlamp-light
                      - title: Rook-Ceph
                        url: https://rook.atoca.house
                        icon: sh:ceph-light
                      - title: pgAdmin
                        url: https://pgadmin.atoca.house
                        icon: sh:pgadmin-light

                  - title: Observability
                    color: 38 85 55
                    links:
                      - title: Grafana
                        url: https://grafana.atoca.house
                        icon: sh:grafana-light
                      - title: Prometheus
                        url: https://prometheus.atoca.house
                        icon: sh:prometheus-light
                      - title: AlertManager
                        url: https://alertmanager.atoca.house
                        icon: mdi:bell-alert
                      - title: VictoriaLogs
                        url: https://victorialogs.atoca.house
                        icon: sh:victoriametrics-light
                      - title: Gatus
                        url: https://status.atoca.house
                        icon: sh:gatus-light

                  - title: Identity & Network
                    color: 262 72 65
                    links:
                      - title: Authelia
                        url: https://auth.atoca.house
                        icon: sh:authelia-light
                      - title: LLDAP
                        url: https://lldap.atoca.house
                        icon: sh:lldap-light
                      - title: UniFi Toolkit
                        url: https://ui-toolkit.atoca.house
                        icon: sh:ubiquiti-unifi-light
                      - title: Cloudflare
                        url: https://dash.cloudflare.com
                        icon: sh:cloudflare-light

                  - title: Personal
                    color: 300 60 60
                    links:
                      - title: Tasks
                        url: https://vikunja.atoca.house
                        icon: sh:vikunja-light
                      - title: Saved Links
                        url: https://karakeep.atoca.house
                        icon: sh:karakeep-light
                      - title: Contacts
                        url: https://twenty.atoca.house
                        icon: sh:twenty-crm-light
                      - title: Notes & Docs
                        url: https://outline.atoca.house
                        icon: sh:outline-light
                      - title: Shell history
                        url: https://atuin.atoca.house
                        icon: sh:atuin-light

                  - title: AI & Automation
                    color: 160 60 45
                    links:
                      - title: Open WebUI
                        url: https://chat.atoca.house
                        icon: sh:open-webui-light
                      - title: LiteLLM
                        url: https://litellm.atoca.house
                        icon: sh:litellm-light
                      - title: n8n
                        url: https://n8n.atoca.house
                        icon: sh:n8n-light
                      - title: SearXNG
                        url: https://search.atoca.house
                        icon: sh:searxng-light
                      - title: TheLounge
                        url: https://thelounge.atoca.house
                        icon: sh:the-lounge-light

      # =========================================================================
      # MEDIA OPS — the *arr stack and download automation.
      # =========================================================================
      - name: Media Ops
        show-mobile-header: true
        columns:
          - size: small
            widgets:
              - $include: w-qbittorrent.yml

              - $include: w-jellyfin-stats.yml

              - type: bookmarks
                groups:
                  - title: Downloads
                    color: 38 85 55
                    links:
                      - title: qBittorrent
                        url: https://qbittorrent.atoca.house
                        icon: sh:qbittorrent-light
                      - title: qui
                        url: https://qui.atoca.house
                        icon: sh:qui-light
                      - title: Autobrr
                        url: https://autobrr.atoca.house
                        icon: sh:autobrr-light
                      - title: SLSKD
                        url: https://slskd.atoca.house
                        icon: sh:slskd-light
                      - title: Soulsync
                        url: https://soulsync.atoca.house
                        icon: mdi:sync
                      - title: Shelfmark
                        url: https://shelfmark.atoca.house
                        icon: sh:shelfmark-light

          - size: full
            widgets:
              - $include: w-radarr-upcoming.yml

              - $include: w-sonarr-upcoming.yml

              - type: monitor
                title: Media Services
                cache: 2m
                sites:
                  - title: Jellyfin
                    url: https://jellyfin.atoca.house
                    icon: sh:jellyfin-light
                  - title: Jellystat
                    url: https://jellystat.atoca.house
                    icon: mdi:chart-donut
                  - title: Seerr
                    url: https://seerr.atoca.house
                    icon: sh:seerr-light
                  - title: Radarr
                    url: https://radarr.atoca.house
                    icon: sh:radarr-light
                  - title: Sonarr
                    url: https://sonarr.atoca.house
                    icon: sh:sonarr-light
                  - title: Bazarr
                    url: https://bazarr.atoca.house
                    icon: sh:bazarr-light
                  - title: Prowlarr
                    url: https://prowlarr.atoca.house
                    icon: sh:prowlarr-light
                  - title: qBittorrent
                    url: https://qbittorrent.atoca.house
                    icon: sh:qbittorrent-light
                  - title: Autobrr
                    url: https://autobrr.atoca.house
                    icon: sh:autobrr-light
                  - title: SLSKD
                    url: https://slskd.atoca.house
                    icon: sh:slskd-light
                  - title: Dispatcharr
                    url: https://dispatcharr.atoca.house
                    icon: sh:dispatcharr-light

          - size: small
            widgets:
              - type: bookmarks
                groups:
                  - title: Content Managers
                    color: 224 90 65
                    links:
                      - title: Radarr
                        url: https://radarr.atoca.house
                        icon: sh:radarr-light
                      - title: Sonarr
                        url: https://sonarr.atoca.house
                        icon: sh:sonarr-light
                      - title: Bazarr
                        url: https://bazarr.atoca.house
                        icon: sh:bazarr-light
                      - title: Prowlarr
                        url: https://prowlarr.atoca.house
                        icon: sh:prowlarr-light
                      - title: Jellystat
                        url: https://jellystat.atoca.house
                        icon: mdi:chart-donut
                      - title: Spoolman
                        url: https://spoolman.atoca.house
                        icon: sh:spoolman-light

              - type: releases
                title: Upstream Releases
                cache: 6h
                collapse-after: 6
                repositories:
                  - glanceapp/glance
                  - argoproj/argo-cd
                  - siderolabs/talos
                  - rook/rook
                  - cilium/cilium
                  - kubernetes-sigs/external-dns
                  - TwiN/gatus

      # =========================================================================
      # FEED — tech news and community.
      # =========================================================================
      - name: Feed
        show-mobile-header: true
        columns:
          - size: full
            widgets:
              - type: group
                widgets:
                  - type: hacker-news
                    sort-by: best
                    limit: 18
                    collapse-after: 8

                  - type: lobsters
                    sort-by: hot
                    limit: 18
                    collapse-after: 8

                  - type: reddit
                    subreddit: selfhosted
                    show-thumbnails: true
                    sort-by: top
                    limit: 15
                    collapse-after: 8

                  - type: reddit
                    subreddit: homelab
                    show-thumbnails: true
                    sort-by: top
                    limit: 15
                    collapse-after: 8

                  - type: reddit
                    subreddit: kubernetes
                    show-thumbnails: true
                    sort-by: top
                    limit: 15
                    collapse-after: 8

                  - type: reddit
                    subreddit: homeautomation
                    show-thumbnails: true
                    sort-by: top
                    limit: 15
                    collapse-after: 8

          - size: small
            widgets:
              - type: rss
                title: Self-Hosted & Infra
                cache: 6h
                limit: 12
                collapse-after: 5
                feeds:
                  - url: https://selfh.st/rss/
                    title: selfh.st
                  - url: https://blog.cloudflare.com/rss
                    title: Cloudflare
                  - url: https://kubernetes.io/feed.xml
                    title: Kubernetes

      # =========================================================================
      # STATUS — every discovered endpoint, with icons.
      # =========================================================================
      - name: Status
        show-mobile-header: true
        columns:
          - size: full
            widgets:
              - $include: gatus.yml
  gatus.yml: |
    - type: custom-api
      title: Service Status
      cache: 5m
      options:
        base-url: https://status.atoca.house

        style: full
        duration: 24h
        # NOTE: option keys below MUST be kebab-case — the template reads them
        # via .Options.StringOr "show-only-configured" etc. camelCase keys are
        # silently ignored and fall back to their defaults.
        group: ""
        compact-metric: uptime
        show-failing-only: false
        # Only render endpoints that have BOTH an icon and a -url mapping below.
        show-only-configured: true

        # <endpoint-name>: <icon>  /  <endpoint-name>-url: <link>
        # Names must match the Gatus endpoint `name` exactly (auto-discovered
        # by gatus-sidecar from the Service/HTTPRoute name, so lowercase).
        Cloudflare: sh:cloudflare-light
        Cloudflare-url: https://dash.cloudflare.com
        Google: sh:google-light
        Google-url: https://www.google.com
        Quad9: mdi:dns
        Quad9-url: https://quad9.net
        authelia: sh:authelia-light
        authelia-url: https://auth.atoca.house
        error-pages-external: mdi:alert-circle-outline
        error-pages-external-url: https://status.atoca.house
        filebrowser: sh:file-browser-light
        filebrowser-url: https://filebrowser.atoca.house
        kromgo: mdi:chart-box-outline
        kromgo-url: https://kromgo.atoca.house
        postiz: sh:postiz-light
        postiz-url: https://postiz.atoca.house
        whoami: mdi:account-question
        whoami-url: https://whoami.atoca.house
        argocd-server: sh:argo-cd-light
        argocd-server-url: https://argocd.atoca.house
        atuin: sh:atuin-light
        atuin-url: https://atuin.atoca.house
        audiobookshelf: sh:audiobookshelf-light
        audiobookshelf-url: https://audiobookshelf.atoca.house
        autobrr: sh:autobrr-light
        autobrr-url: https://autobrr.atoca.house
        bazarr: sh:bazarr-light
        bazarr-url: https://bazarr.atoca.house
        changedetection: sh:changedetection-light
        changedetection-url: https://changedetection.atoca.house
        companion: mdi:view-grid
        companion-url: https://companion.atoca.house
        context7-mcp: mdi:book-open-variant
        context7-mcp-url: https://context7.atoca.house
        dispatcharr: sh:dispatcharr-light
        dispatcharr-url: https://dispatcharr.atoca.house
        flaresolverr: sh:flaresolverr-light
        flaresolverr-url: https://flaresolverr.atoca.house
        garage: sh:garage-light
        garage-url: https://garage.atoca.house
        garage-ui: sh:garage-light
        garage-ui-url: https://garage-ui.atoca.house
        glance: sh:glance-light
        glance-url: https://home.atoca.house
        glance-ops: sh:glance-light
        glance-ops-url: https://ops.atoca.house
        grafana: sh:grafana-light
        grafana-url: https://grafana.atoca.house
        ha-mcp: sh:home-assistant-light
        ha-mcp-url: https://ha-mcp.atoca.house
        headlamp: sh:headlamp-light
        headlamp-url: https://headlamp.atoca.house
        hermes: mdi:message-fast
        hermes-url: https://hermes.atoca.house
        hermes-kf: mdi:message-fast
        hermes-kf-url: https://hermes-kf.atoca.house
        homebridge: sh:homebridge-light
        homebridge-url: https://homebridge.atoca.house
        it-tools: sh:it-tools-light
        it-tools-url: https://it-tools.atoca.house
        jellyfin: sh:jellyfin-light
        jellyfin-url: https://jellyfin.atoca.house
        jellystat: mdi:chart-donut
        jellystat-url: https://jellystat.atoca.house
        karakeep: sh:karakeep-light
        karakeep-url: https://karakeep.atoca.house
        kavita: sh:kavita-light
        kavita-url: https://kavita.atoca.house
        kokoro: mdi:waveform
        kokoro-url: https://kokoro.atoca.house
        kopia: sh:kopia-light
        kopia-url: https://kopia.atoca.house
        kube-prometheus-stack-moni-alertmanager: mdi:bell-alert
        kube-prometheus-stack-moni-alertmanager-url: https://alertmanager.atoca.house
        kube-prometheus-stack-moni-prometheus: sh:prometheus-light
        kube-prometheus-stack-moni-prometheus-url: https://prometheus.atoca.house
        ledfx: mdi:led-strip-variant
        ledfx-url: https://ledfx.atoca.house
        litellm: sh:litellm-light
        litellm-url: https://litellm.atoca.house
        lldap: sh:lldap-light
        lldap-url: https://lldap.atoca.house
        mediamtx: sh:mediamtx-light
        mediamtx-url: https://mediamtx.atoca.house
        memory-mcp: mdi:brain
        memory-mcp-url: https://memory-mcp.atoca.house
        mousetrap: mdi:mouse
        mousetrap-url: https://mousetrap.atoca.house
        n8n: sh:n8n-light
        n8n-url: https://n8n.atoca.house
        ollama: sh:ollama-light
        ollama-url: https://ollama.atoca.house
        omni-tools: mdi:tools
        omni-tools-url: https://omni-tools.atoca.house
        ontime: sh:ontime-light
        ontime-url: https://ontime.atoca.house
        open-webui: sh:open-webui-light
        open-webui-url: https://chat.atoca.house
        openwa: mdi:whatsapp
        openwa-url: https://openwa.atoca.house
        outline: sh:outline-light
        outline-url: https://outline.atoca.house
        pgadmin: sh:pgadmin-light
        pgadmin-url: https://pgadmin.atoca.house
        prowlarr: sh:prowlarr-light
        prowlarr-url: https://prowlarr.atoca.house
        qbittorrent: sh:qbittorrent-light
        qbittorrent-url: https://qbittorrent.atoca.house
        qui: sh:qui-light
        qui-url: https://qui.atoca.house
        radarr: sh:radarr-light
        radarr-url: https://radarr.atoca.house
        rook-ceph-dashboard: sh:ceph-light
        rook-ceph-dashboard-url: https://rook.atoca.house
        searxng: sh:searxng-light
        searxng-url: https://search.atoca.house
        seerr: sh:seerr-light
        seerr-url: https://seerr.atoca.house
        shelfmark: sh:shelfmark-light
        shelfmark-url: https://shelfmark.atoca.house
        slskd: sh:slskd-light
        slskd-url: https://slskd.atoca.house
        sonarr: sh:sonarr-light
        sonarr-url: https://sonarr.atoca.house
        soulsync: mdi:sync
        soulsync-url: https://soulsync.atoca.house
        suwayomi: sh:suwayomi-light
        suwayomi-url: https://suwayomi.atoca.house
        thelounge: sh:the-lounge-light
        thelounge-url: https://thelounge.atoca.house
        trek: sh:trek-light
        trek-url: https://trek.atoca.house
        twenty: sh:twenty-crm-light
        twenty-url: https://twenty.atoca.house
        unifi-toolkit: sh:ubiquiti-unifi-light
        unifi-toolkit-url: https://ui-toolkit.atoca.house
        victoria-logs-server: sh:victoriametrics-light
        victoria-logs-server-url: https://victorialogs.atoca.house
        vikunja: sh:vikunja-light
        vikunja-url: https://vikunja.atoca.house
      template: |
        {{/* Required config options */}}
        {{ $baseURL := .Options.StringOr "base-url" "" }}

        {{/* Optional config options */}}
        {{ $duration := .Options.StringOr "duration" "24h" }}
        {{ $style := .Options.StringOr "style" "full" }}
        {{ $groupFilter := .Options.StringOr "group" "" }}
        {{ $compactMetric := .Options.StringOr "compact-metric" "uptime" }}
        {{ $showFailingOnly := .Options.BoolOr "show-failing-only" false }}
        {{ $showOnlyConfigured := .Options.BoolOr "show-only-configured" false }}


        {{/* Error message template */}}
        {{ define "errorMsg" }}
          <div class="widget-error-header">
            <div class="color-negative size-h3">ERROR</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="break-all">{{ . }}</p>
        {{ end }}

        {{/* Popover template */}}
        {{ define "popover" }}
          <div data-popover-html>
            <div style="margin: 5px;">
              <p class="margin-top-12" style="overflow-y: auto; text-align: justify; max-height: 20rem;">
                {{ range .Array "conditionResults" }}
                  {{ if (.Bool "success") }}
                    <p class="color-positive">{{ .String "condition" }}</p>
                  {{ else }}
                    <p class="color-negative">{{ .String "condition" }}</p>
                  {{ end }}
                {{ end }}
              </p>
            </div>
          </div>
        {{ end }}

        {{ $endpoints := newRequest (print $baseURL "/api/v1/endpoints/statuses")
            | getResponse }}

        {{ $options := .Options }}
        {{ $displayedItems := 0 }}
        {{ if eq $style "compact" }}
          <ul class="dynamic-columns list-gap-8 ">
          {{ range $i, $endpoint := $endpoints.JSON.Array "" }}
              {{ $name := $endpoint.String "name" }}
              {{ $key := $endpoint.String "key" }}
              {{ $group := $endpoint.String "group" }}
              {{ $linkUrlOption := $options.StringOr (concat $name "-url") "" }}
              {{ $linkUrl := $options.StringOr (concat $name "-url") (concat $baseURL "/endpoints/" $key) }}
              {{ $lastResult := index ( $endpoint.Array "results" ) (sub (len ($endpoint.Array "results")) 1) }}
              {{ $latestSuccess := $lastResult.Bool "success" }}

              {{ if and $groupFilter (not (eq $groupFilter $group)) }} {{ continue }} {{ end }}
              {{ if and $showFailingOnly $latestSuccess }} {{ continue }} {{ end }}
              {{ if and $showOnlyConfigured (eq $linkUrlOption "") }} {{ continue }} {{ end }}
              {{ $displayedItems = add $displayedItems 1 }}

              {{ $responseTime := "" }}
              {{ $uptime := "" }}
              {{ $uptimeValue := "" }}

              {{ if eq $compactMetric "uptime" }}
                {{ $uptime = newRequest (print $baseURL "/api/v1/endpoints/" $key "/uptimes/" $duration )
                    | getResponse }}
                {{ $uptimeValue = mul 100 ($uptime.JSON.Float "") }}
              {{ else }}
                {{ $responseTime = newRequest (print $baseURL "/api/v1/endpoints/" $key "/response-times/" $duration )
                    | getResponse }}
              {{ end }}

              <div class="flex items-center gap-12">
                <a class="size-title-dynamic color-highlight text-truncate block grow" href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">{{ $name }}</a>
                <a href="{{ $linkUrl | safeURL }}"  target="_blank" rel="noreferrer">
                  {{ if eq $compactMetric "uptime" }}
                    <div>{{ printf "%.1f" $uptimeValue }}%</div>
                  {{ else }}
                    <div>{{ $responseTime.JSON.Int "" }}ms</div>
                  {{ end }}
                </a>

                {{ if $latestSuccess }}
                  <div class="monitor-site-status-icon-compact">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ else }}
                  <div class="monitor-site-status-icon-compact">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ end }}

              </div>
            {{ end }}
          </ul>
        {{ else }}

          <ul class="dynamic-columns list-gap-20 list-with-separator">
          {{ range $i, $endpoint := $endpoints.JSON.Array "" }}
              {{ $name := $endpoint.String "name" }}
              {{ $key := $endpoint.String "key" }}
              {{ $group := $endpoint.String "group" }}
              {{ $icon := $options.StringOr $name "" }}
              {{ $linkUrlOption := $options.StringOr (concat $name "-url") "" }}
              {{ $linkUrl := $options.StringOr (concat $name "-url") (concat $baseURL "/endpoints/" $key) }}
              {{ $lastResult := index ( $endpoint.Array "results" ) (sub (len ($endpoint.Array "results")) 1) }}
              {{ $latestSuccess := $lastResult.Bool "success" }}

              {{ if and $groupFilter (not (eq $groupFilter $group)) }} {{ continue }} {{ end }}
              {{ if and $showFailingOnly $latestSuccess }} {{ continue }} {{ end }}
              {{ if and $showOnlyConfigured (or (eq $linkUrlOption "") (eq $icon "")) }} {{ continue }} {{ end }}
              {{ $displayedItems = add $displayedItems 1 }}

              {{ $uptime := newRequest (print $baseURL "/api/v1/endpoints/" $key "/uptimes/" $duration )
                  | getResponse }}
              {{ $responseTime := newRequest (print $baseURL "/api/v1/endpoints/" $key "/response-times/" $duration )
                  | getResponse }}

              {{ $uptimeValue := mul 100 ($uptime.JSON.Float "") }}

              {{ $iconUrl := "" }}
              {{ if $icon }}
                {{ $iconPrefix := findMatch "^(si|di|mdi|sh):" $icon }}
                {{ $iconBase := replaceMatches "^(si|di|mdi|sh):" "" $icon }}

                {{ $iconExt := findMatch "\\.[a-z]+$" $iconBase }}
                {{ $iconExt := replaceMatches "\\." "" $iconExt }}
                {{ $iconBase = replaceMatches "\\.[a-z]+$" "" $iconBase }}
                {{ if eq $iconExt "" }} {{ $iconExt = "svg" }} {{ end }}

                {{ if eq $iconPrefix "si:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" $iconBase ".svg" }}
                {{ else if eq $iconPrefix "di:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/" $iconExt "/" $iconBase "." $iconExt }}
                {{ else if eq $iconPrefix "mdi:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/" $iconBase ".svg" }}
                {{ else if eq $iconPrefix "sh:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/" $iconExt "/" $iconBase "." $iconExt }}
                {{ else }}
                  {{ $iconUrl = $icon }}
                {{ end }}
              {{ end }}

              <div class="monitor-site flex items-center gap-15">
                {{ if $iconUrl }}
                  <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                    <img class="monitor-site-icon" src="{{ $iconUrl | safeURL }}" alt="" loading="lazy">
                  </a>
                {{ end }}
                <div class="grow min-width-0">
                  <a class="size-h3 color-highlight text-truncate block" href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">{{ $name }}</a>

                  <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                    <ul class="list-horizontal-text">
                      <li class="{{ if not $latestSuccess }}color-negative{{ end }}">{{ printf "%.1f" $uptimeValue }}%</li>
                      <li>{{ $responseTime.JSON.Int "" }}ms</li>
                    </ul>
                  </a>
                </div>

                {{ if $latestSuccess }}
                  <div class="monitor-site-status-icon">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ else }}
                  <div class="monitor-site-status-icon">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ end }}

              </div>
            {{ end }}
          </ul>
        {{ end }}

        {{ if eq $displayedItems 0 }}
          <div class="flex items-center justify-center gap-10 padding-block-5">
            <p>All sites are online</p>
            <svg class="shrink-0" style="width: 1.7rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--color-positive)">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd" />
            </svg>
          </div>
        {{ end }}
  w-unifi.yml: |
    - type: custom-api
      title: Unifi
