---
fullnameOverride: unifi-dns
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/home-operations/external-dns-unifi-webhook
      tag: 0.10.12@sha256:5338b99662e2e15048b4e14b49e17279d384970fdcb3c29169f509f806f49cbe
    env:
      - name: UNIFI_HOST
        value: https://unifi.internal
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-unifi-secret
            key: external_dns_api_key
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5

extraArgs:
  - --annotation-filter=externaldns.enable.custom/internal notin (false,no)
  # UCG API spikes >5s under load; default 5s read timeout makes startup fatal
  - --webhook-provider-read-timeout=30s

triggerLoopOnEvent: true
policy: sync

sources:
  - gateway-httproute
  - service

txtOwnerId: main

txtPrefix: "k8s-%{record_type}."

domainFilters:
  - atoca.house

serviceMonitor:
  enabled: true

podAnnotations:
  secret.reloader.stakater.com/reload: external-dns-unifi-secret
