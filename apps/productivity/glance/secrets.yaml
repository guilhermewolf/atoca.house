---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glance
  namespace: glance
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: glance
    template:
      data:
        # Home Assistant long-lived access token
        HASS_API_KEY: "{{ .GLANCE_HASS_TOKEN }}"
        # Jellyfin API key (Dashboard -> API Keys). Two names: the
        # jellyfin-latest widget reads JELLYFIN_KEY, jellyfin-stats reads
        # JELLYFIN_API_KEY. Same value.
        JELLYFIN_KEY: "{{ .GLANCE_JELLYFIN_API_KEY }}"
        JELLYFIN_API_KEY: "{{ .GLANCE_JELLYFIN_API_KEY }}"
        # Seerr API key (Settings -> General -> API Key)
        OVERSEERR_API_KEY: "{{ .GLANCE_SEERR_API_KEY }}"
  dataFrom:
    - extract:
        key: glance-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
