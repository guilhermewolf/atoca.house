  w-jellyfin-stats.yml: |
    - type: custom-api
      title: Media Library
      base-url: ${JELLYFIN_URL}
      options:
        url: ${JELLYFIN_URL}
        key: ${JELLYFIN_API_KEY}

      template: |
        {{ $url := .Options.StringOr "url" "" }}
        {{ $key := .Options.StringOr "key" "" }}

        {{- if or (eq $url "") (eq $key "") -}}

          <p>Error: The URL or API Key was not configured in the widget options.</p>

        {{- else -}}

          {{- $requestUrl := printf "%s/Items/Counts?api_key=%s" $url $key -}}
          {{- $jellyfinData := newRequest $requestUrl | getResponse -}}

          {{- if eq $jellyfinData.Response.StatusCode 200 -}}
            <div class="flex flex-column gap-5">
              <div class="flex justify-between text-center">

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "MovieCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Movies</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SeriesCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">TV Shows</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "EpisodeCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Episodes</div>
                </div>

                <div>
                  <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SongCount" | formatNumber }}</div>
                  <div class="size-h5 uppercase">Songs</div>
                </div>

              </div>
            </div>
          {{- else -}}
            <p>Failed: {{ $jellyfinData.Response.Status }}</p>
          {{- end -}}
        {{- end -}}
  w-seerr-trending.yml: |
    - type: custom-api
      title: Trending Right Now
      title-url: ${OVERSEERR_URL}/discover/trending    # trending, movies, or tv
      url: ${OVERSEERR_URL}/api/v1/discover/trending   # trending, movies, or tv
      cache: 15m
      headers:
        accept: "application/json"
        x-api-key: ${OVERSEERR_API_KEY}
      parameters:
        language: "en" # this can be changed to other languages if desired
        page: "1"
      options:
        show-media-type: true # set to false to hide the "| TV" or "| Movie" suffix
        show-media-desc: true # set to false to hide the media's summary
      template: |
        {{ $showMediaType := .Options.BoolOr "show-media-type" true }}
        {{ $showMediaDesc := .Options.BoolOr "show-media-desc" true }}

        {{ if eq .Response.StatusCode 200 }}
          {{ $items := .JSON.Array "results" }}
          {{ if gt (len $items) 0 }}
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
            {{ range $items }}
              <li class="flex items-start gap-10 thumbnail-container thumbnail-parent">
                {{ $mediaType := .String "mediaType" }}
                {{ $mediaTitle := "" }}
                {{ $mediaTypeUpper := "" }}
                {{ if eq $mediaType "movie" }} {{ $mediaTitle = .String "title" }} {{ $mediaTypeUpper = "Movie" }}{{ else }}{{ $mediaTitle = .String "name" }} {{ $mediaTypeUpper = "TV" }}{{ end }}
                {{ $overseerrUrl := concat "${OVERSEERR_URL}" "/" $mediaType "/" ( .String "id" ) }}
                {{ $tmdbUrl := concat "https://www.themoviedb.org" "/" $mediaType "/" ( .String "id" ) }}
                <a href={{ $overseerrUrl }} target="_blank">
                <img src={{ concat "https://image.tmdb.org/t/p/w300" (.String "posterPath") }} style="border-radius: 5px; min-width: 5rem; max-width: 5rem;" class="card">
                </a>
                <div class="flex-1" style="padding-right: 5px;">
                  <p class="color-positive size-h4 text-truncate-2-lines margin-top-5" title={{ $mediaTitle }}><a href={{ $overseerrUrl }} target="_blank">{{ $mediaTitle }}</p>
                  <p class="size-h4" title="TMDB Rating"><a href={{ $tmdbUrl }} target="_blank">TMDB: {{ mul (.Float "voteAverage") 10 | toInt }}% {{ if $showMediaType }}| {{ $mediaTypeUpper }}{{ end }}</a></p>
                  {{ if $showMediaDesc }}<p class="color-subdue size-h4 text-truncate-2-lines" title={{ .String "overview" }}>{{ .String "overview" }}</p>{{ end }}
                </div>
              </li>
            {{ end }}
            </ul>
          {{ else }}
            <details style="margin-top:0.5rem">
              <summary> Raw JSON:</summary>
              <pre stye="font-size:10px">
          {{ (printf "%+v" .JSON) }}
              </pre>
            </details>
          {{ end }}
        {{ end }}
  w-calendar.yml: |
    # atoca: HA family calendar + Donetick chores
    - type: custom-api
      title: Coming Up
      title-url: https://hass.atoca.house/calendar
      cache: 15m
      url: ${HASS_URL}/api/
      headers:
        Authorization: "Bearer ${HASS_API_KEY}"
      options:
        hass-url: ${HASS_URL}
        token: ${HASS_API_KEY}
        days: 14
      template: |
        {{ $hass := .Options.StringOr "hass-url" "" }}
        {{ $auth := concat "Bearer " (.Options.StringOr "token" "") }}
        {{ $start := now | formatTime "2006-01-02T15:04:05Z07:00" }}
        {{ $end := offsetNow (printf "%dh" (mul (.Options.IntOr "days" 14) 24)) | formatTime "2006-01-02T15:04:05Z07:00" }}

        {{ define "events" }}
          {{ if eq .Response.StatusCode 200 }}
            {{ $events := .JSON.Array "" }}
            {{ if eq (len $events) 0 }}
              <p class="color-subdue size-h6">Nothing planned</p>
            {{ else }}
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range $events }}
                {{ $dt := .String "start.dateTime" }}
                <li class="flex gap-10 items-baseline">
                  <span class="color-primary size-h6 shrink-0" style="min-width: 6.5rem;">
                    {{ if ne $dt "" }}{{ ($dt | parseTime "rfc3339").Format "Mon 2 Jan 15:04" }}{{ else }}{{ ((.String "start.date") | parseTime "DateOnly").Format "Mon 2 Jan" }}{{ end }}
                  </span>
                  <span class="color-highlight text-truncate">{{ .String "summary" }}</span>
                </li>
              {{ end }}
              </ul>
            {{ end }}
          {{ else }}
            <p class="color-negative size-h6">Home Assistant: HTTP {{ .Response.StatusCode }}</p>
          {{ end }}
        {{ end }}

        {{ $family := newRequest (concat $hass "/api/calendars/calendar.our_calendar")
            | withParameter "start" $start | withParameter "end" $end
            | withHeader "Authorization" $auth | getResponse }}
        {{ $chores := newRequest (concat $hass "/api/calendars/calendar.donetick_chores_chores")
            | withParameter "start" $start | withParameter "end" $end
            | withHeader "Authorization" $auth | getResponse }}

        <div class="size-h5 color-subdue margin-bottom-5">Family</div>
        {{ template "events" $family }}
        <div class="size-h5 color-subdue margin-top-15 margin-bottom-5">Chores</div>
        {{ template "events" $chores }}
  w-mealie.yml: |
    # vendored from glanceapp/community-widgets/widgets/mealie-todays-meal
    - type: custom-api
      title: Today's Meal
      title-url: https://mealie.atoca.house/household/mealplan/planner/view
      cache: 15m
      url: ${MEALIE_URL}/api/households/mealplans/today
      headers:
        Authorization: Bearer ${MEALIE_API_TOKEN}
      template: |
        <div class="flex gap-15 justify-between">
          {{ range .JSON.Array "" }}
            <div class="card widget-content-frame flex-1" style="min-width: 0; max-width: calc(50% - 7.5px);">
              <div class="absolute" style="top: 10px; left: 10px; background-color: var(--color-widget-background); padding: 4px 8px; border-radius: var(--border-radius); z-index: 1;">
                <span class="size-h5 uppercase color-primary">{{.String "entryType"}}</span>
              </div>
              <div class="relative" style="height: 180px; overflow: hidden; border-radius: var(--border-radius) var(--border-radius) 0 0;">
                <img src="https://mealie.atoca.house/api/media/recipes/{{.String "recipeId"}}/images/original.webp" 
                    class="max-width-100" style="width: 100%; height: 100%; object-fit: cover;"/>
              </div>
              <div class="padding-block-5 padding-inline-widget">
                <h3 class="size-h3 color-highlight margin-block-5 text-truncate">{{.String "recipe.name"}}</h3>
              </div>
            </div>
          {{ else }}
            <p class="text-center color-subdue padding-block-5 flex-1">No meals planned for today</p>
          {{ end }}
        </div>
  w-weather-week.yml: |
    # vendored from glanceapp/community-widgets/widgets/weather-seven-day
    - type: custom-api
      title: This Week
      body-type: string
      cache: 1h
      options:
        location: Amsterdam 
      template: | 
        {{/* THESE VALUES CAN BE CHANGED BY ADDING AN ENTRY TO THE OPTIONS SECTION */}}
          {{ $temp_unit := .Options.StringOr "temp_unit" "celsius" }}
          {{ $weekend_color := .Options.StringOr "weekend_color" "var(--color-separator)" }}
          {{ $overlay_color := .Options.StringOr "overlay_color" "hsl(var(--bghs), var(--bgl), 50%)" }}
          {{/* the following variables define the coloring of the sunny/cloudy/etc. weather icons*/}}
            {{ $color_clear := .Options.StringOr "color_clear" "var(--color-text-highlight)" }}
            {{ $color_partly := .Options.StringOr "color_partly" "var(--color-text-highlight)"}}
            {{ $color_cloud := .Options.StringOr "color_cloud" "var(--color-text-highlight)"}}
            {{ $color_smog := .Options.StringOr "color_smog" "var(--color-text-highlight)"}}
            {{ $color_drizzle := .Options.StringOr "color_drizzle" "var(--color-text-highlight)"}}
            {{ $color_rain := .Options.StringOr "color_rain" "var(--color-text-highlight)"}}
            {{ $color_freezing_rain := .Options.StringOr "color_freezing_rain" "var(--color-text-highlight)"}}
            {{ $color_snow := .Options.StringOr "color_snow" "var(--color-text-highlight)F"}}
            {{ $color_thunderstorm := .Options.StringOr "color_thunderstorm" "var(--color-text-highlight)"}}
            {{ $color_other := .Options.StringOr "color_other" "var(--color-text-highlight)"}}
          {{/* the following variables define the temperature gradient coloring for the daily rectangles */}}
          {{ $color_red := .Options.StringOr "color_red" "var(--color-negative)" }}  
          {{ $color_yellow := .Options.StringOr "color_yellow" "var(--color-text-subdue)" }}
          {{ $color_blue := .Options.StringOr "color_blue" "var(--color-positive)" }}
          {{ $color_white := .Options.StringOr "color_white" "var(--color-text-highlight)" }}
          {{ $temp_red := .Options.FloatOr "temp_red" 27 }}
          {{ $temp_yellow := .Options.FloatOr "temp_yellow" 20 }}
          {{ $temp_blue := .Options.FloatOr "temp_blue" 10.0 }}
          {{ $temp_white := .Options.FloatOr "temp_white" 0 }}
          {{ if eq $temp_unit "fahrenheit" }}
            {{ $temp_red = .Options.FloatOr "temp_red" 80.0 }}
            {{ $temp_yellow = .Options.FloatOr "temp_yellow" 70.0 }}
            {{ $temp_blue = .Options.FloatOr "temp_blue" 50.0 }}
            {{ $temp_white = .Options.FloatOr "temp_white" 30.0 }}
          {{end}}

        {{/* Request 1: get latitude and longitude for user's city */}}
        {{ $location_string := replaceAll " " "%20" (.Options.StringOr "location" "") }}
        {{ $url1 := printf "https://geocoding-api.open-meteo.com/v1/search?name=%s&count=20&language=en&format=json" $location_string }}
        {{ $req1 := newRequest $url1 | getResponse }}
        {{ $latitude := $req1.JSON.String "results.0.latitude" }}
        {{ $longitude := $req1.JSON.String "results.0.longitude" }}

        {{/* Request 2: get daily weather forecast based on latitude and longitude */}}
        {{ $url2 := printf "https://api.open-meteo.com/v1/forecast?latitude=%s&longitude=%s&temperature_unit=%s&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Amsterdam" $latitude $longitude $temp_unit}}    
        {{ $req2 := newRequest $url2 | getResponse }}

        <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">

          {{/* Show abbreivated day of week */}}
          {{ $dates := $req2.JSON.Array "daily.time" }}
          <div style="position: relative; width: 100%; height: 25px;">  
            {{ range $index, $date := $dates }}

              {{/* prepare to print M Tu W Th F Sa Su */}}
              {{ $dateString := .String "" }}
              {{ $parsedDate := $dateString | parseTime "DateOnly" }}
              {{ $dayOfWeek := $parsedDate.Format "Monday" | trimSuffix "day" | trimSuffix "on" | trimSuffix "es" | trimSuffix "edn" | 
                  trimSuffix "urs" | trimSuffix "ri" | trimSuffix "tur" | trimSuffix "n" }}  

              {{/* highlight weekends (Sa Su) */}}
              {{ $day_color := "" }}
              {{ if eq $dayOfWeek "Sa" "Su" }}
                {{ $day_color = $weekend_color }}
              {{ end }}

              <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}%; position: absolute; background-color: {{ $day_color | safeCSS }} ">
                <p class="size-h4 color-paragraph">{{ $dayOfWeek }}</p> 
              </div>
            {{ end }}
          </div>

          {{/* Show numeric day of month */}}
          <div style="position: relative; width: 100%; height: 25px;">     
            {{ range $index, $date := $dates }}
              {{ $dateString := .String "" }}
              {{ $trimmedDate := replaceMatches "[0-9]+-[0-9]+-" "" $dateString }}
              <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}%; position: absolute;">
                <p class="size-h4 color-paragraph">{{ $trimmedDate }}</p> 
              </div>
            {{ end }}
          </div>

          {{/* Show weather conditions using fontawesome icons */}}
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
          {{ $codes := $req2.JSON.Array "daily.weathercode" }}

          <div style="position: relative; width: 100%; height: 30px;">     
            {{ range $index, $thiscode := $codes }}
              {{ $code := .Int "" }}

              <div style="text-align: center; width: 10%; height: 25px; line-height: 25px; margin: 0 10% 0 3%; left: {{ mul $index 14 }}% ; position: absolute;">
              {{ $wtype := "" }} 
              {{ $wicon := "" }} 
              {{ $wcolor := "" }} 
              {{ if eq $code 0 }}
                {{ $wtype = "Clear" }}
                {{ $wicon = "fas fa-sun" }}
                {{ $wcolor = $color_clear }}
              {{ else if eq $code 1 2 }}
                {{ $wtype = "Part Clear" }}
                {{ $wicon = "fas fa-cloud-sun" }}
                {{ $wcolor = $color_partly }} 
              {{ else if eq $code 3 }}
                {{ $wtype = "Cloudy" }}
                {{ $wicon = "fas fa-cloud" }}
                {{ $wcolor = $color_cloud }}
              {{ else if eq $code 45 48 }}
                {{ $wtype = "Fog" }}
                {{ $wicon = "fas fa-smog" }}
                {{ $wcolor = $color_smog }}
              {{ else if eq $code 51 53 55 56 57 }}
                {{ $wtype = "Drizzle" }}
                {{ $wicon = "fas fa-cloud-rain" }}
                {{ $wcolor = $color_drizzle }}
              {{ else if eq $code 61 63 65 80 81 82 }}
                {{ $wtype = "Rain" }}
                {{ $wicon = "fas fa-cloud-showers-heavy" }}
                {{ $wcolor = $color_rain }}
              {{ else if eq $code 66 67 }}
                {{ $wtype = "Freezing Rain" }}
                {{ $wicon = "fas fa-snowflake" }}
                {{ $wcolor = $color_freezing_rain }}
              {{ else if eq $code 71 73 75 77 85 86 }}
                {{ $wtype = "Snow" }}
                {{ $wicon = "fas fa-snowman" }}
                {{ $wcolor = $color_snow }}
              {{ else if eq $code 95 96 99 }}
                {{ $wtype = "Thunderstorm" }}
                {{ $wicon = "fas fa-bolt" }}
                {{ $wcolor = $color_thunderstorm }}
              {{ else }}
                {{ $wtype = "Other" }}
                {{ $wicon = "fa-solid fa-question" }}
                {{ $wcolor = $color_other }}
              {{ end }}
              <i class={{ $wicon }} style="font-size: 20px; color: {{ $wcolor | safeCSS }};", title = {{$wtype }}></i>
              </div>
            {{ end }}
          </div>
        </div>

        {{/* ===== show daily min and max temperatures ===== */}}
        {{ $maxTemps := $req2.JSON.Array "daily.temperature_2m_max" }}
        {{ $minTemps := $req2.JSON.Array "daily.temperature_2m_min" }} 

        {{/* get overall max and min temp over week's range */}}
        {{/* to determine vertical scale */}}
        <div style="display: flex; justify-content: flex-start; align-items: center;">

          {{ $max_max := 0 }}
          {{ range $maxTemps }}
              {{ if gt (.Int "") $max_max }}
                {{ $max_max = (.Int "") }}
              {{ end }}
          {{ end }}
          {{ $min_min := 999 }}
          {{ range $minTemps }}
              {{ if lt (.Int "") $min_min }}
                {{ $min_min = (.Int "") }}
              {{ end }}
          {{ end }}

          {{/* add a small buffer */}}
          {{ $max_max = add $max_max 1 }}
          {{ $min_min = sub $min_min 1 }}

          {{/* outer div to contain the temp chart */}}
          <div style="position: relative; width: 100%; height: 75px;">
            {{/* get relative % heights for each daily max and min */}}
            {{ $temp_range := sub $max_max $min_min }}

            {{ range $index, $thisHigh := $maxTemps }}
                {{ $thisLow := index $minTemps $index }}
                {{ $thisHigh = $thisHigh.Float "" }}
                {{ $thisLow = $thisLow.Float "" }}

                {{ $thisHighPct := sub 1 (div (sub $max_max $thisHigh) $temp_range) }}
                {{ $thisLowPct := div (sub $thisLow $min_min) $temp_range }}

                {{/* define color gradient per. values between $temp_red and $temp_yellow are shown as a color gradient from $color_red to $color_yellow */}}
                {{/* for colors partially in range, can represent as negative percent */}}
                {{ $thisTempRange := sub $thisHigh $thisLow }}
                {{ $red_pos := mul 100 (div (sub $thisHigh $temp_red) $thisTempRange) | toInt }}
                {{ $yel_pos := mul 100 (div (sub $thisHigh $temp_yellow) $thisTempRange) | toInt }}
                {{ $blu_pos := mul 100 (div (sub $thisHigh $temp_blue) $thisTempRange) | toInt }}
                {{ $whi_pos := mul 100 (div (sub $thisHigh $temp_white) $thisTempRange) | toInt }}
                {{ $gradient_string := printf "%s %d%%, %s %d%%, %s %d%%, %s %d%%" $color_red $red_pos $color_yellow $yel_pos $color_blue $blu_pos $color_white $whi_pos }}

                {{/* output daily div */}}
                <div style="left: {{ mul $index 14 | add 3 }}%; bottom: {{ mul $thisLowPct 100 | toInt }}%; 
                  height: {{ mul (sub $thisHighPct $thisLowPct) 100 | toInt }}%; position: absolute;
                  background:linear-gradient({{ $gradient_string | safeCSS }}); width: 10%; text-align: center; border-radius: 10px;">

                  {{/* Based on rectangle height & position, print high and low temperatures either inside or outside the rectangle. */}}
                  {{ $top_pos := -2 }}
                  {{ $bot_pos := -2 }}
                  {{ $pos_thresh := 0.20 }}
                  {{ if lt (div $thisTempRange $temp_range) $pos_thresh }} 
                    {{ $top_pos = -17 }}
                    {{ $bot_pos = -19 }}
                  {{ else if and (lt (div $thisTempRange $temp_range) (mul $pos_thresh 2)) (lt (sub 1 $thisHighPct) $thisLowPct) }}
                    {{ $bot_pos = -19 }}
                  {{ else if and (lt (div $thisTempRange $temp_range) (mul $pos_thresh 2)) (gt (sub 1 $thisHighPct) $thisLowPct) }}
                    {{ $top_pos = -17 }}
                  {{ end }}
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: {{ $overlay_color | safeCSS }}; z-index: 1;  border-radius: 10px;">
                      <p style='color: #F0F0F0; position: absolute; top: {{ $top_pos }}px; left: 0px; right: 0px'>{{ $thisHigh | toInt }}</p>
                      <p style='color: #F0F0F0; position: absolute; bottom: {{ $bot_pos }}px; left: 0px; right:0px'>{{ $thisLow | toInt }}</p>
                    </div>
                  </div>
            {{ end }}

          </div>
        </div>    
  w-seerr-requests.yml: |
    # vendored from glanceapp/community-widgets/widgets/seerr-requests
    - type: custom-api
      title: Seerr Requests
      title-url: https://seerr.atoca.house/requests?filter=all
      cache: 5m
      options:
        seerr-url: ${OVERSEERR_URL}
        api-key: ${OVERSEERR_API_KEY}
        link-url: https://seerr.atoca.house
        filter: all       # pending | all | approved | processing | available | unavailable | failed
        sort: added           # added | modified
        max-requests: 10
        collapse-after: 4
        show-posters: true
        ha-webhook-url: ""    # set to enable Approve / Decline, see README
      template: |
        {{ $baseUrl := .Options.StringOr "seerr-url" "" | trimSuffix "/" }}
        {{ $apiKey := .Options.StringOr "api-key" "" }}
        {{ $linkUrl := .Options.StringOr "link-url" $baseUrl | trimSuffix "/" }}
        {{ $filter := .Options.StringOr "filter" "pending" }}
        {{ $sort := .Options.StringOr "sort" "added" }}
        {{ $max := .Options.IntOr "max-requests" 10 }}
        {{ $collapseAfter := .Options.IntOr "collapse-after" 4 }}
        {{ $showPosters := .Options.BoolOr "show-posters" true }}
        {{ $webhook := .Options.StringOr "ha-webhook-url" "" }}

        {{ $list := newRequest (concat $baseUrl "/api/v1/request")
          | withParameter "take" (printf "%d" $max)
          | withParameter "filter" $filter
          | withParameter "sort" $sort
          | withHeader "Accept" "application/json"
          | withHeader "X-Api-Key" $apiKey
          | getResponse }}

        {{ if ne $list.Response.StatusCode 200 }}
          <div class="text-center">
            <p class="color-negative">Could not load requests (HTTP {{ $list.Response.StatusCode }})</p>
            <p class="size-h6 color-subdue margin-top-3">
              {{ if eq $list.Response.StatusCode 403 }}Check SEERR_API_KEY.{{ else }}Check SEERR_URL and that Seerr is reachable from Glance.{{ end }}
            </p>
          </div>
        {{ else }}
          {{ $requests := $list.JSON.Array "results" }}
          {{ if eq (len $requests) 0 }}
            <p class="text-center color-subdue">No {{ if ne $filter "all" }}{{ $filter }} {{ end }}requests</p>
          {{ else }}
            {{ if ne $webhook "" }}<iframe name="sink-seerr-requests" title="Fallback target for the Approve and Decline buttons" hidden></iframe>{{ end }}
            <ul class="list collapsible-container" data-collapse-after="{{ $collapseAfter }}"
              style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: 1.6rem 2.4rem;">
            {{ range $requests }}
              {{ $type := .String "type" }}
              {{ $tmdbId := .String "media.tmdbId" }}
              {{ $is4k := .Bool "is4k" }}
              {{ $link := concat $linkUrl "/" $type "/" $tmdbId }}

              {{ $details := newRequest (concat $baseUrl "/api/v1/" $type "/" $tmdbId)
                | withHeader "Accept" "application/json"
                | withHeader "X-Api-Key" $apiKey
                | getResponse }}

              {{ $title := concat "TMDB " $tmdbId }}
              {{ $year := "" }}
              {{ $poster := "" }}
              {{ if eq $details.Response.StatusCode 200 }}
                {{ if eq $type "movie" }}
                  {{ $title = $details.JSON.String "title" }}
                  {{ $year = findMatch "^[0-9]{4}" ($details.JSON.String "releaseDate") }}
                {{ else }}
                  {{ $title = $details.JSON.String "name" }}
                  {{ $year = findMatch "^[0-9]{4}" ($details.JSON.String "firstAirDate") }}
                {{ end }}
                {{ $poster = $details.JSON.String "posterPath" }}
              {{ end }}

              {{ $who := .String "requestedBy.displayName" }}
              {{ if eq $who "" }}{{ $who = .String "requestedBy.username" }}{{ end }}
              {{ if eq $who "" }}{{ $who = .String "requestedBy.email" }}{{ end }}

              {{ $requestStatus := .Int "status" }}
              {{ $mediaStatus := .Int "media.status" }}
              {{ if $is4k }}{{ $mediaStatus = .Int "media.status4k" }}{{ end }}
              {{ $statusLabel := "Approved" }}
              {{ $statusClass := "color-primary" }}
              {{ if eq $requestStatus 1 }}{{ $statusLabel = "Pending" }}{{ $statusClass = "color-highlight" }}
              {{ else if eq $requestStatus 3 }}{{ $statusLabel = "Declined" }}{{ $statusClass = "color-negative" }}
              {{ else if eq $requestStatus 4 }}{{ $statusLabel = "Failed" }}{{ $statusClass = "color-negative" }}
              {{ else if eq $mediaStatus 5 }}{{ $statusLabel = "Available" }}{{ $statusClass = "color-positive" }}
              {{ else if eq $mediaStatus 4 }}{{ $statusLabel = "Partial" }}{{ $statusClass = "color-positive" }}
              {{ else if eq $mediaStatus 3 }}{{ $statusLabel = "Processing" }}{{ $statusClass = "color-primary" }}
              {{ end }}

              <li class="flex items-center gap-15" style="margin-top: 0;" data-seerrha-id="{{ .Int "id" }}">
                {{ if $showPosters }}
                  <a href="{{ $link }}" target="_blank" rel="noreferrer" class="shrink-0">
                    {{ if ne $poster "" }}
                      <img src="https://image.tmdb.org/t/p/w185{{ $poster }}" alt="" loading="lazy"
                        style="display: block; width: 3.6rem; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--border-radius);">
                    {{ else }}
                      <div class="color-subdue size-h6 text-center"
                        style="display: flex; align-items: center; justify-content: center; width: 3.6rem; aspect-ratio: 2 / 3; border: 1px dashed currentColor; border-radius: var(--border-radius);">No art</div>
                    {{ end }}
                  </a>
                {{ end }}
                <div class="flex-1 min-width-0">
                  <a href="{{ $link }}" target="_blank" rel="noreferrer"
                    class="size-h4 block text-truncate color-primary" title="{{ $title }}">{{ $title }}{{ if ne $year "" }} ({{ $year }}){{ end }}</a>
                  <ul class="list-horizontal-text size-h6 margin-top-3">
                    <li class="{{ $statusClass }}" data-seerrha-status>{{ $statusLabel }}</li>
                    <li>{{ $who }}</li>
                    <li {{ .String "createdAt" | parseTime "rfc3339" | toRelativeTime }}></li>
                  </ul>
                  <ul class="list-horizontal-text size-h6 color-subdue margin-top-3">
                    <li>{{ if eq $type "movie" }}Movie{{ else }}Series{{ end }}</li>
                    {{ if eq $type "tv" }}
                      {{ $seasons := .Array "seasons" }}
                      {{ if gt (len $seasons) 0 }}
                        <li class="text-truncate">{{ if eq (len $seasons) 1 }}Season{{ else }}Seasons{{ end }} {{ range $i, $s := $seasons }}{{ if $i }}, {{ end }}{{ $s.Int "seasonNumber" }}{{ end }}</li>
                      {{ end }}
                    {{ end }}
                    {{ if $is4k }}<li>4K</li>{{ end }}
                  </ul>
                  {{ if eq $requestStatus 1 }}
                    {{ if ne $webhook "" }}
                      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" hidden data-seerrha-mark
                        onload="var row = this.closest('li'), key = 'seerrha-' + row.dataset.seerrhaId, cmd = this.dataset.cmd, saved;
                          if (!cmd) {
                            try { saved = JSON.parse(localStorage.getItem(key)); } catch (e) {}
                            if (!saved || Date.now() - saved.t > 600000) return;
                            cmd = saved.cmd;
                          }
                          var tone = cmd === 'approve' ? 'positive' : 'negative';
                          var tint = 'color-mix(in srgb, var(--color-' + tone + ') 14%, transparent)';
                          row.style.background = tint;
                          row.style.boxShadow = '0 0 0 0.6rem ' + tint;
                          row.style.borderRadius = 'var(--border-radius)';
                          row.querySelectorAll('img').forEach(function (img) { img.style.filter = 'grayscale(1)'; img.style.opacity = '0.6'; });
                          var status = row.querySelector('[data-seerrha-status]');
                          status.textContent = cmd === 'approve' ? 'Approve sent' : 'Decline sent';
                          status.className = 'color-' + tone;
                          row.querySelector('[data-seerrha-actions]').style.display = 'none';">
                    {{ end }}
                    {{ if or (ne $webhook "") (eq $type "tv") }}
                      <div class="flex items-center gap-10 margin-top-5" style="flex-wrap: wrap;" data-seerrha-actions>
                        {{ if ne $webhook "" }}
                        <form method="post" action="{{ $webhook }}" target="sink-seerr-requests" class="flex gap-10"
                          onsubmit="var form = this, row = form.closest('li'), cmd = event.submitter.value;
                            var status = row.querySelector('[data-seerrha-status]'), mark = row.querySelector('[data-seerrha-mark]');
                            var buttons = form.querySelectorAll('button');
                            var body = new URLSearchParams(new FormData(form));
                            body.set('cmd', cmd);
                            buttons.forEach(function (b) { b.disabled = true; });
                            status.textContent = 'Sending';
                            fetch(form.action, { method: 'POST', mode: 'no-cors', body: body })
                              .then(function () {
                                try { localStorage.setItem('seerrha-' + row.dataset.seerrhaId, JSON.stringify({ cmd: cmd, t: Date.now() })); } catch (e) {}
                                mark.dataset.cmd = cmd;
                                mark.onload();
                              })
                              .catch(function () {
                                buttons.forEach(function (b) { b.disabled = false; });
                                status.textContent = 'Home Assistant unreachable';
                                status.className = 'color-negative';
                              });
                            return false;">
                          <input type="hidden" name="request_id" value="{{ .Int "id" }}">
                          <button type="submit" name="cmd" value="approve" class="size-h6 color-positive"
                            style="background: none; border: 1px solid currentColor; border-radius: var(--border-radius); padding: 0.2rem 0.8rem; cursor: pointer; font-family: inherit; white-space: nowrap;">Approve</button>
                          <button type="submit" name="cmd" value="decline" class="size-h6 color-negative"
                            style="background: none; border: 1px solid currentColor; border-radius: var(--border-radius); padding: 0.2rem 0.8rem; cursor: pointer; font-family: inherit; white-space: nowrap;">Decline</button>
                        </form>
                        {{ end }}
                        {{ if eq $type "tv" }}
                          <a href="{{ $link }}?manage=1" target="_blank" rel="noreferrer" class="size-h6 color-subdue"
                            title="Opens the series in Seerr with its requests listed; the pencil there edits the seasons"
                            style="background: none; border: 1px solid currentColor; border-radius: var(--border-radius); padding: 0.2rem 0.8rem; cursor: pointer; font-family: inherit; text-decoration: none; white-space: nowrap;">Edit seasons</a>
                        {{ end }}
                      </div>
                    {{ end }}
                  {{ end }}
                </div>
              </li>
            {{ end }}
            </ul>
          {{ end }}
        {{ end }}
  w-jellyfin-now-playing.yml: |
    # vendored from glanceapp/community-widgets/widgets/jellyfin-now-playing
    - type: custom-api
      cache: 1m
      title: Now Playing
      url: ${JELLYFIN_URL}/Sessions
      headers:
        X-Emby-Token: ${JELLYFIN_API_KEY}
      template: |
        {{ $sessions := .JSON.Array "" }}
        {{ $found := false }}
        {{ $showArt := false }}

        {{ range $index, $s := $sessions }}

          {{ $type := $.JSON.String (printf "%d.NowPlayingItem.MediaType" $index) }}

          {{ if ne $type "" }}
            {{ $found = true }}

            {{ $user := $.JSON.String (printf "%d.UserName" $index) }}
            {{ $device := $.JSON.String (printf "%d.DeviceName" $index) }}
            {{ $client := $.JSON.String (printf "%d.Client" $index) }}

            {{ if eq $device "" }}
              {{ $device = $client }}
            {{ end }}

            {{ $name := $.JSON.String (printf "%d.NowPlayingItem.Name" $index) }}
            {{ $artist := $.JSON.String (printf "%d.NowPlayingItem.Artists.0" $index) }}
                    {{ if eq $artist "" }}{{ $artist = $.JSON.String (printf "%d.NowPlayingItem.SeriesName" $index) }}{{ end }}
            {{ $album := $.JSON.String (printf "%d.NowPlayingItem.Album" $index) }}
            {{ $albumId := $.JSON.String (printf "%d.NowPlayingItem.AlbumId" $index) }}

            {{ $position := $.JSON.Float (printf "%d.PlayState.PositionTicks" $index) }}
            {{ $runtime := $.JSON.Float (printf "%d.NowPlayingItem.RunTimeTicks" $index) }}

            {{ $progress := 0.0 }}
            {{ if gt $runtime 0.0 }}
              {{ $progress = mul (div $position $runtime) 100.0 }}
            {{ end }}

            <div style="
              display:flex;
              gap:12px;
              align-items:center;
              padding:12px;
              border-radius:12px;
              background:var(--color-subdue);
              margin-bottom:10px;
            ">

              {{ if and $showArt (ne $albumId "") }}
              <img
                src="${JELLYFIN_URL}/Items/{{ $albumId }}/Images/Primary?maxWidth=200&quality=80&api_key=${JELLYFIN_API_KEY}"
                style="width:60px;height:60px;border-radius:8px;object-fit:cover;"
              />
              {{ end }}

              <div style="flex:1; overflow:hidden;">

                <div style="font-size:12px;opacity:0.7;margin-bottom:2px;">
                  {{ $device }} · {{ $user }}
                </div>

                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  {{ $name }}
                </div>

                <div style="font-size:12px;opacity:0.7;">
                  {{ $artist }}
                </div>

                <div style="font-size:11px;opacity:0.5;">
                  {{ $album }}
                </div>

                <div style="margin-top:8px;">
                  <div style="
                    background:var(--color-highlight);
                    height:6px;
                    border-radius:5px;
                    overflow:hidden;
                  ">
                    <div style="
                      width:{{ printf "%.2f" $progress }}%;
                      background:var(--color-positive);
                      height:100%;
                      transition: width 0.5s ease;
                    "></div>
                  </div>
                </div>

              </div>
            </div>

          {{ end }}

        {{ end }}

        {{ if not $found }}
          <div style="opacity:0.6;">Nothing playing</div>
        {{ end }}
  w-onthisday.yml: |
    # vendored from glanceapp/community-widgets/widgets/wikipedia-on-this-day
    - type: custom-api
      title: On This Day
      cache: 6h
      url: https://api.github.com/rate_limit
      template: |
        {{/* Top-level URL is a cheap dummy JSON; the real work is done inside the template via newRequest so we can compute today's date. Wikipedia's REST API requires a descriptive User-Agent per their policy (https://meta.wikimedia.org/wiki/User-Agent_policy) — an unset UA returns 403. */}}
        {{ $month := now | formatTime "01" }}
        {{ $day := now | formatTime "02" }}
        {{ $url := concat "https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/" $month "/" $day }}
        {{
          $resp := newRequest $url
            | withHeader "Accept" "application/json"
            | withHeader "User-Agent" "glance-dashboard/1.0 (+https://github.com/glanceapp/glance)"
            | getResponse
        }}

        {{ if ne $resp.Response.StatusCode 200 }}
          <p class="color-negative">Failed to load Wikipedia events ({{ $resp.Response.Status }})</p>
        {{ else }}
          {{ $events := $resp.JSON.Array "events" }}
          {{ if eq (len $events) 0 }}
            <p class="color-subdue">No events found for today.</p>
          {{ else }}
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
              {{ range $events }}
                {{ $year := .Int "year" }}
                {{ $text := .String "text" }}
                {{ $pages := .Array "pages" }}
                {{ $link := "" }}
                {{ if gt (len $pages) 0 }}
                  {{ $firstPage := index $pages 0 }}
                  {{ $link = $firstPage.String "content_urls.desktop.page" }}
                {{ end }}
                <li>
                  <div class="flex items-baseline" style="gap: 0.6rem;">
                    <span class="color-primary size-h4" style="flex: 0 0 auto; min-width: 3rem;">{{ $year }}</span>
                    <span class="size-h5" style="flex: 1 1 auto;">
                      {{ if ne $link "" }}
                        <a href="{{ $link }}" target="_blank" rel="noreferrer" class="color-highlight">{{ $text }}</a>
                      {{ else }}
                        {{ $text }}
                      {{ end }}
                    </span>
                  </div>
                </li>
              {{ end }}
            </ul>
          {{ end }}
        {{ end }}
  w-xkcd.yml: |
    # vendored from glanceapp/community-widgets/widgets/xkcd-widget
    - type: custom-api
      title: xkcd
      cache: 6h
      url: https://xkcd.com/info.0.json
      template: | 
        <body> {{ .JSON.String "title" }}</body>
        <a href="https://xkcd.com/{{ .JSON.Int "num" }}/" target="_blank" rel="noreferrer"><img src="{{ .JSON.String "img" }}" alt="{{ .JSON.String "alt" }}" title="{{ .JSON.String "alt" }}" style="max-width: 100%;"></a>
