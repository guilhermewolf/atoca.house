---
controllers:
  microbin:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # renovate: datasource=docker depName=docker.io/danielszabo99/microbin
          repository: docker.io/danielszabo99/microbin
          tag: 2.1.4@sha256:6660e5ccad0d764fa3c0032464ffb8f4b4f28c92a2eb9e39202b94cdc5b68909
        env:
          MICROBIN_PORT: &port 8080
          MICROBIN_BIND: 0.0.0.0
          MICROBIN_DATA_DIR: /app/microbin_data
          MICROBIN_PUBLIC_PATH: https://microbin.atoca.house
          MICROBIN_ADMIN_USERNAME: admin
          MICROBIN_PRIVATE: true
          MICROBIN_HIGHLIGHTSYNTAX: true
          MICROBIN_QR: true
          MICROBIN_EDITABLE: true
          MICROBIN_ENABLE_BURN_AFTER: true
          MICROBIN_DEFAULT_EXPIRY: 24hour
          MICROBIN_MAX_EXPIRY: 1week
          MICROBIN_GC_DAYS: 90
          MICROBIN_ENCRYPTION_SERVER_SIDE: true
          MICROBIN_ENCRYPTION_CLIENT_SIDE: true
          MICROBIN_MAX_FILE_SIZE_UNENCRYPTED_MB: 512
          MICROBIN_MAX_FILE_SIZE_ENCRYPTED_MB: 256
          MICROBIN_DISABLE_UPDATE_CHECKING: true
          MICROBIN_DISABLE_TELEMETRY: true
          MICROBIN_LIST_SERVER: false
        envFrom:
          - secretRef:
              name: microbin-secret
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

service:
  app:
    controller: microbin
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    annotations:
      gatus.io/enabled: "true"
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - microbin.atoca.house
    rules:
      - backendRefs:
          - name: microbin
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 5Gi
    # Restore gate - see restore.yaml.
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: microbin-restore
    globalMounts:
      - path: /app/microbin_data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
