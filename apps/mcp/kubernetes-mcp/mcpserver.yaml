---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes-mcp
spec:
  groupRef:
    name: mcp-tools
  # renovate: datasource=docker depName=quay.io/containers/kubernetes_mcp_server
  image: quay.io/containers/kubernetes_mcp_server:v0.0.69@sha256:1da9d62ad0c008a6cadcf2718c86c2e2d18753ca1d9f1f3313068980794b24f2
  # Since v0.0.69 runtime settings are TOML only (no CLI flags). The image's
  # default config just sets port 8080, so it always speaks HTTP; point it at
  # our config (configmap.yaml) which keeps the port and adds read_only.
  env:
    - name: MCP_CONFIG_PATH
      value: /etc/kubernetes-mcp/config.toml
  # In-cluster config comes from this ServiceAccount's projected token.
  serviceAccount: kubernetes-mcp-viewer
  transport: streamable-http
  mcpPort: 8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
