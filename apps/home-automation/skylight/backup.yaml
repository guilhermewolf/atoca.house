---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationsource_v1alpha1.json
# Backs up skylight-config: config.json (location, radius, display settings)
# plus the route/TLE/satcat caches, all under /app/server/data.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: skylight-backup
  namespace: skylight
spec:
  sourcePVC: skylight-config
  trigger:
    schedule: "0 0 * * *"
  restic:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheStorageClassName: openebs-hostpath
    pruneIntervalDays: 14
    repository: skylight-r2-secret
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    retain:
      hourly: 5
      daily: 4
      monthly: 1
      yearly: 1
    copyMethod: Snapshot
    storageClassName: ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
