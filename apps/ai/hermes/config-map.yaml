---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  # Copied over /opt/data/config.yaml on every start (copy-config init) — this
  # file is the source of truth; edits made in the dashboard are discarded.
  # SOUL.md, memories and skills live on the PVC only (not in this public repo).
  config.yaml: |
    # hermes — maintainer of guilhermewolf/atoca.house (Discord + API + dashboard)
    # Docs: https://hermes-agent.nousresearch.com/docs

    # --- Models ---------------------------------------------------------------
    # Every model goes through LiteLLM. LiteLLM holds the ONLY ChatGPT login and
    # the Nous API key: an OAuth login held in two places revokes the other
    # (single-use refresh tokens), so this pod holds no OAuth at all.
    model:
      provider: custom:litellm
      default: chatgpt/gpt-6.1-sol
    providers:
      litellm:
        base_url: http://litellm.litellm.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
    # Turn-scoped: each new message starts on the primary again. LiteLLM already
    # falls back inside a group (gpt-6.1-sol -> gpt-6-sol -> free tiers); this
    # list covers LiteLLM-side failures of the whole group.
    fallback_providers:
      - provider: custom:litellm
        model: nous-claude-sonnet
      - provider: custom:litellm
        model: openrouter-free
      - provider: custom:litellm
        model: qwen3.5-9b
    delegation:
      provider: custom:litellm
      model: chatgpt/gpt-6-luna
    # Pin EVERY auxiliary task: anything unlisted runs on the main model.
    # Flat-rate ChatGPT (gpt-6-luna) for tasks that need judgement, vision or a
    # large context; free tiers for small classifier-style calls.
    auxiliary:
      approval:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
        timeout: 30
      vision:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      compression:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      background_review:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      review:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
      curator:
        provider: custom:litellm
        model: chatgpt/gpt-6-luna
        timeout: 600
      title_generation:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      memory_query_rewrite:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      skills_hub:
        provider: custom:litellm
        model: groq-gpt-oss-120b
      mcp:
        provider: custom:litellm
        model: groq-gpt-oss-120b
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
      tool_use_enforcement: auto
      # No image/video generation or TTS here; HA is reached via its MCP.
      disabled_toolsets: [image_gen, video_gen, tts, homeassistant]
    timezone: Europe/Amsterdam

    # --- Workspace --------------------------------------------------------------
    # cwd is the atoca.house checkout on the PVC (the agent clones/fetches it
    # itself per the atoca-gitops skill); its root CLAUDE.md loads as project
    # context automatically.
    terminal:
      backend: local
      cwd: /opt/data/workspace/atoca.house
      timeout: 300
      persistent_shell: true
      # GITHUB_TOKEN feeds the git credential helper in /opt/data/.gitconfig;
      # the sandbox strips it otherwise and every push 403s.
      env_passthrough:
        - GIT_HTTPS_TOKEN
    # Skills live on the PVC only (/opt/data/skills — private, Volsync-backed).
    skills:
      project_discovery: false
    # No LLM turns on a timer unless a human asks for one.
    cron:
      allow_agent_scheduling: false

    # --- Guardrails -------------------------------------------------------------
    # Routine git is pre-approved; irreversible commands are denied outright
    # (deny wins even over yolo).
    approvals:
      mode: smart
      deny:
        # `--force-with-lease` stays allowed (re-pushing a rebased branch); the
        # globs below need a space right after `--force`.
        - "git push --force *"
        - "git push -f *"
        - "git push origin main*"
        - "git push*HEAD:main*"
        - "git branch -D main*"
        - "kubectl delete *"
        - "kubectl apply *"
        - "kubectl patch *"
        - "kubectl edit *"
        - "kubectl scale *"
      smart_policy: |
        Context: this shell owns a checkout of guilhermewolf/atoca.house at
        /opt/data/workspace/atoca.house. That repo is GitOps — anything merged
        to main deploys to the live Kubernetes cluster.
        APPROVE routine repo work: git status/diff/log/fetch/pull/checkout/
        switch/branch/add/commit/stash/rebase onto origin/main, git push of a
        feature branch, kubectl get/describe/logs/top/events (read-only),
        helm template, kustomize build, kubeconform, yq/jq/rg/sed over files
        inside the checkout, curl GETs to in-cluster services.
        ESCALATE anything that rewrites shared history, touches files outside
        /opt/data/workspace/atoca.house, or writes to the cluster.
        Never approve a direct push to main — changes reach main through a pull
        request that a human merges.
    command_allowlist:
      - git fetch *
      - git pull --rebase*
      - git rebase *
      - git push *
      - git push --force-with-lease*
      - git checkout *
      - git switch *
      - git restore *
      - git stash *
    security:
      redact_secrets: true
    privacy:
      redact_pii: true

    # --- Memory -----------------------------------------------------------------
    # Built-in MEMORY.md/USER.md (on the PVC) plus the atoca-memory
    # knowledge graph via the `atoca-memory` MCP — that graph is the canonical store
    # shared with Claude Code. No local holographic store (it only collected
    # cron noise).
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20

    # --- Platforms --------------------------------------------------------------
    group_sessions_per_user: false
    streaming:
      enabled: false
    web:
      search_backend: searxng
    discord:
      require_mention: false
      auto_thread: false
      reactions: false
    # Discord voice messages -> local faster-whisper on CPU.
    stt:
      enabled: true
      provider: local
      local:
        model: small
        language: ""

    # --- MCP servers --------------------------------------------------------------
    # In-cluster toolhive proxies: streamable HTTP at /mcp, no auth for
    # in-cluster callers (the proxies hold upstream credentials).
    mcp_servers:
      # PR flow only. Content changes go through the local git checkout (the
      # one write path); file-writing tools and merge are deliberately left out.
      github:
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${GIT_HTTPS_TOKEN}
        tools:
          include:
            - get_file_contents
            - search_code
            - search_repositories
            - list_commits
            - create_pull_request
            - list_pull_requests
            - get_pull_request
            - get_pull_request_status
            - get_pull_request_files
            - get_pull_request_comments
            - get_pull_request_reviews
            - update_pull_request_branch
            - list_issues
            - get_issue
            - create_issue
            - update_issue
            - add_issue_comment
        prompts: false
        resources: false
      # atoca-memory knowledge graph — canonical memory, shared with Claude Code.
      atoca-memory:
        url: http://mcp-memory-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      # 16k community HelmReleases: research before adding or bumping a chart.
      kubesearch:
        url: http://mcp-kubesearch-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      context7:
        url: http://mcp-context7-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      # Named `ha`, not `homeassistant`: that is a built-in toolset name (disabled
      # above), and a same-named MCP server is disabled with it.
      ha:
        url: http://mcp-ha-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      arr:
        url: http://mcp-arr-mcp-proxy.mcp.svc.cluster.local:8080/mcp
      n8n:
        url: http://n8n.n8n.svc.cluster.local/mcp-server/http
        headers:
          Authorization: Bearer ${N8N_API_KEY}
      outline:
        url: https://outline.atoca.house/mcp
        headers:
          Authorization: Bearer ${OUTLINE_API_KEY}
      # Unraid Management Agent on the NAS (outside the cluster).
      unraid:
        url: http://192.168.40.160:8043/mcp
      vikunja:
        url: http://mcp-vikunja-mcp-proxy.mcp.svc.cluster.local:8080/mcp
