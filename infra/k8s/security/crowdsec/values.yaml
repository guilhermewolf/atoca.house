---
container_runtime: containerd
# Used by lapi, agent and appsec. mirror.gcr.io avoids Docker Hub rate limits.
image:
  # renovate: datasource=docker depName=mirror.gcr.io/crowdsecurity/crowdsec
  repository: mirror.gcr.io/crowdsecurity/crowdsec
  tag: v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
config:
  parsers:
    s01-parse:
      envoy-logs.yaml: |-
        # Exact match on 'envoy' so the cilium acquisition (program: cilium)
        # does not accidentally get parsed here.
        filter: "evt.Parsed.program == 'envoy' && evt.Parsed.message contains ':authority'"
        onsuccess: next_stage
        name: hydaz/envoy-logs
        description: "Parse Envoy access logs to match nginx parser outputs"
        statics:
          - parsed: json
            expression: UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "envoy")
          - parsed: time_local
            expression: evt.Unmarshaled.envoy["start_time"]
          # Client IP as resolved by Envoy (ClientTrafficPolicy trustedCIDRs),
          # with the port stripped; handles "[v6]:port". Do NOT use the
          # leftmost x-forwarded-for entry: Cloudflare appends to whatever XFF
          # the client sends, so XFF[0] is attacker-controlled.
          - parsed: remote_addr
            expression: Trim(Join(Split(string(evt.Unmarshaled.envoy["downstream_remote_address"]), ":")[:-1], ":"), "[]")
          - parsed: verb
            expression: evt.Unmarshaled.envoy["method"]
          - parsed: request
            expression: evt.Unmarshaled.envoy["x-envoy-origin-path"]
          # Envoy logs "HTTP/2" / "HTTP/3"; nginx-style consumers (e.g.
          # http-dos-invalid-http-versions) expect "2.0" / "3.0".
          - parsed: http_version
            expression: |-
              TrimPrefix(evt.Unmarshaled.envoy["protocol"], "HTTP/") matches "^[0-9]$" ? TrimPrefix(evt.Unmarshaled.envoy["protocol"], "HTTP/") + ".0" : TrimPrefix(evt.Unmarshaled.envoy["protocol"], "HTTP/")
          - parsed: status
            expression: Sprintf('%.0f', evt.Unmarshaled.envoy["response_code"])
          - parsed: body_bytes_sent
            expression: Sprintf('%.0f', evt.Unmarshaled.envoy["bytes_sent"])
          - parsed: http_user_agent
            expression: evt.Unmarshaled.envoy["user-agent"]
          - parsed: target_fqdn
            expression: evt.Unmarshaled.envoy[":authority"]
          - meta: service
            value: http
          - meta: log_type
            value: http_access-log
          - meta: source_ip
            expression: evt.Parsed.remote_addr
          - meta: http_status
            expression: evt.Parsed.status
          - meta: http_path
            expression: evt.Parsed.request
          - meta: http_verb
            expression: evt.Parsed.verb
          - meta: http_user_agent
            expression: evt.Parsed.http_user_agent
          - meta: target_fqdn
            expression: evt.Parsed.target_fqdn
      seerr-logs.yaml: |-
        onsuccess: next_stage
        filter: "evt.Parsed.program == 'jellyseerr'"
        name: hydaz/seerr-logs
        description: "Parse seerr (jellyseerr) failed sign-in attempts"
        pattern_syntax:
          SEERR_USER: "(%{EMAILADDRESS}|%{USERNAME})"
        nodes:
          - grok:
              pattern: '%{RFC3339:timestamp}.*Failed (sign-in|login) attempt from user with incorrect.*credentials \{"account":\{"ip":"(::ffff:)?%{IP:source_ip}","email":"%{SEERR_USER:username}"'
              apply_on: message
              statics:
                - meta: log_type
                  value: jellyseerr_failed_auth
          - grok:
              pattern: '%{RFC3339:timestamp}.*Failed (sign-in|login) attempt using invalid .* password.*\{"ip":"(::ffff:)?%{IP:source_ip}","email":"%{SEERR_USER:username}"'
              apply_on: message
              statics:
                - meta: log_type
                  value: jellyseerr_failed_auth
        statics:
          - meta: service
            value: jellyseerr
          - meta: source_ip
            expression: "evt.Parsed.source_ip"
          - meta: user
            expression: "evt.Parsed.username"
          - target: evt.StrTime
            expression: evt.Parsed.timestamp
    s02-enrich:
      envoy-418-whitelist.yaml: |-
        name: hydaz/envoy-418-whitelist
        description: "Whitelist 418 responses from the envoy bouncer to prevent processing already banned IPs"
        filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
        whitelist:
          reason: "envoy bouncer response to already banned ips"
          expression:
            - "evt.Meta.http_status == '418'"
      # Home WAN IP (Gatus + home clients hairpin through the tunnel) is kept
      # out of this public repo in a LAPI allowlist: `cscli allowlists list`.
      jellyfin-success-whitelist.yaml: |-
        name: hydaz/jellyfin-success-whitelist
        description: "Jellyfin clients fire dozens of extensionless image/API requests per page and trip http-crawl-non_statics"
        filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
        whitelist:
          reason: "jellyfin successful requests"
          expression:
            # Only 2xx/3xx; 4xx/5xx still feed probing/bruteforce scenarios.
            - "evt.Meta.target_fqdn == 'jellyfin.atoca.house' && evt.Meta.http_status matches '^[23]'"
  config.yaml.local: |-
    api:
      server:
        auto_registration:
          enabled: true
          token: "${REGISTRATION_TOKEN}"
          allowed_ranges:
            - "127.0.0.1/32"
            - "10.244.0.0/16"
    db_config:
      type: postgresql
      host: "${DB_HOST}"
      port: 5432
      user: "${DB_USERNAME}"
      password: "${DB_PASSWORD}"
      db_name: "${DB_NAME}"
      sslmode: verify-full
      ssl_ca_cert: /etc/postgres-ca/ca.crt
      # Agent/appsec pods auto-register a machine per pod name; drop the ones
      # that stop logging in so they don't pile up as stale LPs in the Console.
      flush:
        max_items: 20000
        max_age: 30d
        agents_autodelete:
          login_password: 60m
  agent_config.yaml.local: |-
    api:
      client:
        unregister_on_exit: false
  appsec_config.yaml.local: |-
    api:
      client:
        unregister_on_exit: false
  notifications:
    http.yaml: |-
      type: http
      name: http_default
      log_level: info
      # CrowdSec v1.8.1 passes a list of models.Alert objects to this template.
      # Build Alertmanager's v2 array shape and JSON-encode the whole list so
      # quotes/newlines in attacker-controlled scenario and source values stay data.
      format: |
        {{- $alerts := list -}}
        {{- range . -}}
        {{- $start := .StartAt -}}
        {{- if not $start -}}{{- $start = now | date "2006-01-02T15:04:05Z07:00" -}}{{- end -}}
        {{- $end := now | dateModify "+1h" | date "2006-01-02T15:04:05Z07:00" -}}
        {{- $alert := dict
          "labels" (dict "alertname" "CrowdSecLocalBan" "severity" "warning" "namespace" "crowdsec" "scenario" .Scenario "source_ip" .Source.Value)
          "annotations" (dict "summary" (printf "CrowdSec local ban: %s" (.Scenario | toJson | trimAll "\"")) "description" (printf "Local ban for %s" (.Source.Value | toJson | trimAll "\"")))
          "startsAt" $start
          "endsAt" $end
        -}}
        {{- $alerts = append $alerts $alert -}}
        {{- end -}}
        {{- $alerts | toJson -}}
      url: http://kube-prometheus-stack-moni-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts
      method: POST
      headers:
        Content-Type: application/json
  profiles.yaml: |-
    # AppSec/WAF hits: short first ban (30m) since CRS and virtual-patching
    # can false-positive on SPAs and API clients, escalating by 30m for every
    # prior decision on the IP so repeat scanners don't return every few
    # minutes. GetDecisionsCount counts decisions still in the DB.
    name: appsec_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() contains "appsec"
    decisions:
      - type: ban
        duration: 30m
    duration_expr: Sprintf('%dm', min((GetDecisionsCount(Alert.GetValue()) + 1) * 30, 10080))
    on_success: break
    ---
    # Default IP ban for all other scenarios: 24h (CrowdSec recommended
    # default), +24h for every prior decision on the IP.
    name: default_ip_remediation
    debug: false
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 24h
    duration_expr: Sprintf('%dh', min((GetDecisionsCount(Alert.GetValue()) + 1) * 24, 168))
    notifications:
      - http_default
    on_success: break
secrets:
  externalSecret:
    name: crowdsec-lapi-secrets
lapi:
  extraVolumes:
    - name: postgres-ca
      configMap:
        name: postgres-ca
  extraVolumeMounts:
    - name: postgres-ca
      mountPath: /etc/postgres-ca
      readOnly: true
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop: [ALL]
      # LAPI runs as root and the plugin broker fork/execs notification
      # plugins as plugin_config.user/group (nobody); setuid/setgid needs
      # SETUID/SETGID, and dialing the nobody-owned plugin socket in /tmp
      # needs DAC_OVERRIDE.
      add: [SETUID, SETGID, DAC_OVERRIDE]
  replicas: 2
  # Requests sized from 7d Prometheus data (p99 mem 43Mi, p95 cpu 6m). Chart
  # defaults request 500m/500Mi. Limits left at chart defaults.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Console context is enabled by a one-time human-run `cscli console enable context`.
  # Console enrollment is NOT done on startup: the chart's start script runs
  # `cscli console enroll` under `set -e`, so any CAPI 403 (free-tier 1h ban
  # on login bursts) crashloops LAPI, which keeps the ban alive. The engine
  # was enrolled once; enrollment is tied to the CAPI machine whose creds
  # live in the crowdsec-capi-credentials Secret. To re-enroll, run
  # `cscli console enroll --name cluster <key>` in the LAPI pod.
  storeCAPICredentialsInSecret: true
  # Stable `lapi-cscli` machine instead of a new random one per pod restart.
  storeLAPICscliCredentialsInSecret: true
  envFrom:
    - secretRef:
        name: crowdsec-secrets
    - secretRef:
        name: crowdsec-db-secrets
  persistentVolume:
    data:
      enabled: false
    config:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
agent:
  # Single Deployment streaming pod logs from the Kubernetes API (rbac.yaml)
  # instead of a DaemonSet tailing hostPath /var/log on every node. No
  # hostPath mount, one agent machine, and no per-node "no logs read"
  # Console alerts on nodes that host none of the pods below.
  isDeployment: true
  hostVarLog: false
  serviceAccountName: crowdsec-agent
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  wait_for_lapi:
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop: [ALL]
  # As a DaemonSet: 7d p99 mem 107Mi, p95 cpu 15m per node. One pod now sees
  # every node's lines, so the memory limit is raised from the 250Mi chart
  # default. Re-size from Prometheus after a week.
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 512Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  # `kubernetes` source: one entry per namespace; `labels.type` becomes
  # evt.Parsed.program via the built-in non-syslog parser. Tails new lines
  # only (TailLines: 0), so restarts don't replay old logs.
  additionalAcquisition:
    # Envoy Gateway access logs, external Gateway only. This is the primary
    # signal source — the `hydaz/envoy-logs` custom parser turns the envoy
    # JSON access-log format into nginx-compatible fields. Internal Gateway
    # clients are all private IPs, 100% dropped by crowdsecurity/whitelists.
    - source: kubernetes
      namespace: kube-system
      selector: app.kubernetes.io/name=envoy,gateway.envoyproxy.io/owning-gateway-name=atoca-house-external
      labels:
        type: envoy
    # Authelia access/auth logs for brute-force detection.
    - source: kubernetes
      namespace: authelia
      selector: app.kubernetes.io/name=authelia
      labels:
        type: authelia
    # Jellyfin auth logs. jellyfin.atoca.house is on the external Gateway
    # and Jellyfin has no 2FA, so the login endpoint is the exposed surface.
    # Authentication is delegated to LLDAP, but that is transparent here:
    # the LDAP plugin rejects the bind and Jellyfin's own UserManager still
    # emits `Authentication request for <user> has been denied (IP: <ip>)`,
    # which is the line `LePresidente/jellyfin-logs` greps for. Verified
    # against 10.11.11. The IP in that line is the real client (Jellyfin
    # `KnownProxies: 10.244.0.0/16` + the Gateway's xForwardedFor
    # trustedCIDRs), so bans land on the attacker, not on Envoy.
    - source: kubernetes
      namespace: jellyfin
      selector: app.kubernetes.io/name=jellyfin
      labels:
        type: jellyfin
    # Seerr auth logs. seerr.atoca.house is on the external Gateway and its
    # /api/v1/auth/jellyfin endpoint proxies straight through to Jellyfin,
    # so it is a second front door onto the same LLDAP directory. `type`
    # is `jellyseerr`, not `seerr`, because that is what the hub parser and
    # scenarios filter on.
    - source: kubernetes
      namespace: seerr
      selector: app.kubernetes.io/name=seerr
      labels:
        type: jellyseerr
    # No filebrowser source: it runs gtsteffaniak/filebrowser with password
    # login disabled (OIDC via Authelia only), so brute force lands on
    # Authelia. MrShippeR/filebrowser parses the upstream filebrowser format
    # and never matched a line here.
  # cri-logs parser no longer needed: the API returns raw lines, no CRI prefix.
  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-dos
        crowdsecurity/http-cve
        LePresidente/authelia
        LePresidente/jellyfin
        LePresidente/jellyseerr
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
appsec:
  enabled: true
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop: [ALL]
  wait_for_lapi:
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop: [ALL]
  replicas: 2
  # 7d p99 mem 44Mi, p95 cpu 11m. Chart defaults request 500m/250Mi.
  # Limits left at chart defaults.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 512Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      # appsec-default = vpatch + generic rules (in-band, blocking).
      # crowdsecurity/crs deliberately NOT enabled: its out-of-band config
      # SendAlert()s on every rule match, and CRS setup rule 901340 ("Enabling
      # body inspection") matches nearly every request with a body. With the
      # bouncer on both gateways that was ~800 alerts/h from LAN/internal
      # traffic (forge runner, argocd, ...), pinning the 5000-alert DB cap.
      # Re-enable only with a custom appsec-config that alerts on 949110
      # (anomaly threshold exceeded) alone.
      appsec_configs:
        - crowdsecurity/appsec-default
      labels:
        type: appsec
  scenarios:
    # Hub crowdsecurity/appsec-vpatch has `distinct: rule_name`, so it only
    # bans an IP that trips two DIFFERENT rules within 60s. An IP replaying
    # the same exploit is blocked per request but never banned (seen: 304
    # CVE-2025-29927 hits from one IP, 0 decisions). This bans on 3 blocks
    # of any rule in 60s. Name must contain "appsec" for appsec_remediation.
    appsec-vpatch-repeat.yaml: |-
      type: leaky
      format: 3.0
      name: atoca/appsec-vpatch-repeat
      description: "Ban IPs repeatedly blocked by CrowdSec AppSec, same rule or not"
      filter: "evt.Meta.log_type == 'appsec-block' && evt.Meta.rule_name not startsWith 'native_rule'"
      groupby: evt.Meta.source_ip
      capacity: 2
      leakspeed: "60s"
      blackhole: 1m
      labels:
        service: http
        confidence: 3
        spoofable: 0
        classification:
          - attack.T1190
        label: "Repeatedly blocked by CrowdSec AppSec"
        behavior: "http:exploit"
        remediation: true
  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
