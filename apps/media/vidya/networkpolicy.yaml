---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
# Only the internal Envoy gateway (user traffic) and Gatus (/healthz check)
# may reach Vidya. Kubelet probes come from the host and Cilium allows them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vidya
  namespace: vidya
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vidya
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: atoca-house-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 31415
          protocol: TCP
    # LAN clients via the LoadBalancer IP (192.168.60.135). DSR keeps the
    # client source IP, so restrict to private ranges.
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 31415
          protocol: TCP
    # Return traffic for Vidya's OIDC calls to auth.atoca.house (external
    # gateway LB). Cilium drops the SYN-ACK when every ingress rule has both
    # from+ports, so this rule must stay port-less.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: atoca-house-external
    # DNS replies via the kube-dns VIP. With loadBalancer.mode=dsr, a reply
    # from a CoreDNS pod on another node misses conntrack here and gets
    # "Policy denied", so ~half of lookups (incl. auth.atoca.house) time out
    # with EAI_AGAIN and OIDC discovery fails. Port-less for the same reason.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
