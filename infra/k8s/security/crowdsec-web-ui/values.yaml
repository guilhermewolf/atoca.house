---
controllers:
  crowdsec-web-ui:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # renovate: datasource=docker depName=ghcr.io/theduffman85/crowdsec-web-ui
          repository: ghcr.io/theduffman85/crowdsec-web-ui
          tag: 2026.10.6@sha256:58d8c344c9375f268cbf88a55f5f7f1e4fdd3e0a0a9e2e56ec91ad8b4bcccf31
        env:
          TZ: Europe/Amsterdam
          CONFIG_UPDATES_ENABLED: "false"
          # LAPI watcher login. The machine is registered once by hand:
          #   cscli machines add crowdsec-web-ui --password <pw> -f /dev/null
          # (the UI does not use the LAPI auto_registration token).
          CONFIG_INSTANCE_NAME: atoca-house
          CONFIG_INSTANCE_LAPI_URL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
          CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
          CONFIG_INSTANCE_METRICS_URL: http://crowdsec-service.crowdsec.svc.cluster.local:6060/metrics
          # OIDC (Authelia); only the `admins` group gets in.
          CONFIG_AUTH_OIDC_ISSUER_URL: https://auth.atoca.house
          CONFIG_AUTH_OIDC_CLIENT_ID: crowdsec-web-ui
          CONFIG_AUTH_OIDC_SCOPE: openid profile email groups
          CONFIG_AUTH_OIDC_ADMIN_GROUPS: "[admins]"
          CONFIG_AUTH_OIDC_UNMATCHED_ROLE: deny
        envFrom:
          - secretRef:
              name: crowdsec-web-ui
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: &port 3000
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: *port
              periodSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 20m
            memory: 192Mi
          limits:
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    runAsUser: 99
    runAsGroup: 100
    runAsNonRoot: true
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: crowdsec-web-ui
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    annotations:
      gatus.io/enabled: "true"
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - crowdsec.atoca.house
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  # SQLite cache + UI settings; alerts/decisions resync from LAPI.
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /app/data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
