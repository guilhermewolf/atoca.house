---
controllers:
  pgadmin:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      annotations:
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-primary",
            "namespace": "crunchy-postgres-cluster"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      # libpq ignores a pgpass with group access, and kubelet forces 0640 on
      # secret volumes when fsGroup is set — copy it to the PVC as 0600.
      pgpass:
        image: &image
          repository: dpage/pgadmin4
          tag: 9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
        command: ["install", "-m", "600", "/pgadmin4/pgpass", "/var/lib/pgadmin/pgpass"]
    containers:
      pgadmin:
        image: *image
        env:
          # Re-import servers.json each start so changes reach the existing DB
          PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
          PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
          PGADMIN_DISABLE_POSTFIX: "true"
          PGADMIN_LISTEN_PORT: &port 80
          PGADMIN_DEFAULT_EMAIL: "admin@atoca.house"
          # Authelia OIDC (authorization_policy: admins); internal login kept as
          # break-glass. Provider config (with secret) comes from pgadmin-secret-auth.
          PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2', 'internal']"
          PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "True"
          PGADMIN_CONFIG_OAUTH2_CONFIG:
            valueFrom:
              secretKeyRef:
                name: pgadmin-secret-auth
                key: OAUTH2_CONFIG
          PGADMIN_DEFAULT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: pgadmin-secret-auth
                key: PGADMIN_PASSWORD
        probes:
          liveness: &probes
            enabled: false
          readiness: *probes
        resources:
          requests:
            cpu: 10m
            memory: 320Mi
          limits:
            memory: 500Mi


configMaps:
  servers:
    data:
      servers.json: |
        {
          "Servers": {
            "1": {
              "Name": "crunchy",
              "Group": "Servers",
              "Host": "postgres-primary.crunchy-postgres-cluster.svc",
              "Port": 5432,
              "MaintenanceDB": "postgres",
              "Username": "postgres",
              "DBRestrictionType": "databases",
              "UseSSHTunnel": 0,
              "TunnelPort": "22",
              "TunnelAuthentication": 0,
              "TunnelPromptPassword": 0,
              "TunnelKeepAlive": 0,
              "KerberosAuthentication": false,
              "ConnectionParameters": {
                "sslmode": "verify-full",
                "sslrootcert": "/etc/ssl/postgres/ca.crt",
                "passfile": "/var/lib/pgadmin/pgpass",
                "connect_timeout": 10
              }
            }
          }
        }

service:
  pgadmin:
    controller: pgadmin
    ports:
      http:
        port: *port

route:
  pgadmin:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - pgadmin.atoca.house
    rules:
      - backendRefs:
          - name: pgadmin
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /var/lib/pgadmin

  pgpass:
    enabled: true
    type: secret
    name: pgadmin-secret
    defaultMode: 0600
    advancedMounts:
      pgadmin:
        pgpass:
          - path: /pgadmin4/pgpass
            subPath: pgpass
  servers:
    type: configMap
    name: pgadmin
    globalMounts:
      - path: /pgadmin4/servers.json
        subPath: servers.json
  postgres-ca:
    type: configMap
    name: postgres-ca
    globalMounts:
      - path: /etc/ssl/postgres/ca.crt
        subPath: ca.crt
        readOnly: true
