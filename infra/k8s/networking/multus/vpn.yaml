---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# Next hop 192.168.90.2 is the in-cluster gluetun-router pod, NOT the UCG Max
# (.1). Every public-space route below is split around RFC1918 so cluster and
# LAN traffic keeps using the pod's eth0. The UCG Max must have no AirVPN
# policy route on this VLAN - gluetun terminates WireGuard now.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpn
spec:
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "vpn",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.6",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "0.0.0.0/5", "gw": "192.168.90.2"},
              {"dst": "8.0.0.0/7", "gw": "192.168.90.2"},
              {"dst": "11.0.0.0/8", "gw": "192.168.90.2"},
              {"dst": "12.0.0.0/6", "gw": "192.168.90.2"},
              {"dst": "16.0.0.0/4", "gw": "192.168.90.2"},
              {"dst": "32.0.0.0/3", "gw": "192.168.90.2"},
              {"dst": "64.0.0.0/2", "gw": "192.168.90.2"},
              {"dst": "128.0.0.0/3", "gw": "192.168.90.2"},
              {"dst": "160.0.0.0/5", "gw": "192.168.90.2"},
              {"dst": "168.0.0.0/6", "gw": "192.168.90.2"},
              {"dst": "172.0.0.0/12", "gw": "192.168.90.2"},
              {"dst": "172.32.0.0/11", "gw": "192.168.90.2"},
              {"dst": "172.64.0.0/10", "gw": "192.168.90.2"},
              {"dst": "172.128.0.0/9", "gw": "192.168.90.2"},
              {"dst": "173.0.0.0/8", "gw": "192.168.90.2"},
              {"dst": "174.0.0.0/7", "gw": "192.168.90.2"},
              {"dst": "176.0.0.0/4", "gw": "192.168.90.2"},
              {"dst": "192.0.0.0/9", "gw": "192.168.90.2"},
              {"dst": "192.128.0.0/11", "gw": "192.168.90.2"},
              {"dst": "192.160.0.0/13", "gw": "192.168.90.2"},
              {"dst": "192.169.0.0/16", "gw": "192.168.90.2"},
              {"dst": "192.170.0.0/15", "gw": "192.168.90.2"},
              {"dst": "192.172.0.0/14", "gw": "192.168.90.2"},
              {"dst": "192.176.0.0/12", "gw": "192.168.90.2"},
              {"dst": "192.192.0.0/10", "gw": "192.168.90.2"},
              {"dst": "193.0.0.0/8", "gw": "192.168.90.2"},
              {"dst": "194.0.0.0/7", "gw": "192.168.90.2"},
              {"dst": "196.0.0.0/6", "gw": "192.168.90.2"},
              {"dst": "200.0.0.0/5", "gw": "192.168.90.2"},
              {"dst": "208.0.0.0/4", "gw": "192.168.90.2"},
              {"dst": "224.0.0.0/3", "gw": "192.168.90.2"}
            ]
          }
        }
      ]
    }
