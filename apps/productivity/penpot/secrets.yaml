---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name penpot-secret
  namespace: penpot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # Master key all other subsystem keys (sessions, invitations) derive
        # from. Rotating it invalidates every session and pending invitation.
        PENPOT_SECRET_KEY: "{{ .PENPOT_SECRET_KEY }}"
        # Must match PENPOT_OAUTH_CLIENT_SECRET in the authelia item
        PENPOT_OIDC_CLIENT_SECRET: "{{ .PENPOT_OIDC_CLIENT_SECRET }}"
        # Garage key for the `penpot` bucket — the AWS SDK default credentials
        # provider picks these up from the environment.
        AWS_ACCESS_KEY_ID: "{{ .PENPOT_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .PENPOT_AWS_SECRET_ACCESS_KEY }}"
        PENPOT_SMTP_HOST: "{{ .SMTP_ADDRESS }}"
        PENPOT_SMTP_PORT: "{{ .SMTP_PORT }}"
        PENPOT_SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        PENPOT_SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
        PENPOT_SMTP_DEFAULT_FROM: "{{ .SMTP_FROM }}"
        PENPOT_SMTP_DEFAULT_REPLY_TO: "{{ .SMTP_FROM }}"
  dataFrom:
    - extract:
        key: penpot-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: smtp-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-pguser-penpot
  namespace: penpot
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres-cluster-store
  target:
    name: penpot-db-secret
    template:
      data:
        # The backend is a JVM app using pgjdbc; sslmode=require encrypts
        # without pinning a truststore (pgbouncer runs client_tls_sslmode:
        # prefer), so no postgres-ca mount is needed here.
        PENPOT_DATABASE_URI: 'postgresql://{{ index . "host" }}:{{ index . "port" }}/{{ index . "dbname" }}?sslmode=require'
        PENPOT_DATABASE_USERNAME: '{{ index . "user" }}'
        PENPOT_DATABASE_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: postgres-pguser-penpot
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
