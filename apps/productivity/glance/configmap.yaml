---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
#
# GENERATED LAYOUT — community widget templates are vendored verbatim from
# https://github.com/glanceapp/community-widgets with only options/env patched.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance
  annotations:
    reloader.stakater.com/match: "true"
data:
  glance.yml: |
    server:
      port: 80
      proxied: true

    branding:
      logo-text: A
      app-name: atoca

    theme:
      background-color: 240 21 15
      primary-color: 224 76 65
      positive-color: 142 71 45
      negative-color: 0 72 51

    pages:
      # =========================================================================
      # HOME — the landing page. Nothing here requires knowing what a container is.
      # =========================================================================
      - name: Home
        show-mobile-header: true
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Europe/Amsterdam
                    label: Amsterdam
                  - timezone: America/Sao_Paulo
                    label: Sao Paulo

              - type: weather
                # Must be a bare place name — the open-meteo geocoder takes the
                # whole string as one query, so "Amsterdam, Netherlands" returns
                # zero results. First match for "Amsterdam" is the NL one.
                location: Amsterdam
                units: metric
                hour-format: 24h

              - $include: w-hass.yml

              - type: calendar
                first-day-of-week: monday

          - size: full
            widgets:
              - type: search
                search-engine: https://search.atoca.house/search?q={QUERY}
                new-tab: true
                autofocus: true
                bangs:
                  - title: YouTube
                    shortcut: "!yt"
                    url: https://www.youtube.com/results?search_query={QUERY}
                  - title: Google
                    shortcut: "!g"
                    url: https://www.google.com/search?q={QUERY}
                  - title: Jellyfin
                    shortcut: "!jf"
                    url: https://jellyfin.atoca.house/web/#/search.html?query={QUERY}
                  - title: Request a movie/show
                    shortcut: "!r"
                    url: https://seerr.atoca.house/search?query={QUERY}

              - type: group
                widgets:
                  - type: rss
                    title: World
                    cache: 3h
                    limit: 15
                    collapse-after: 6
                    feeds:
                      - url: https://www.theguardian.com/world/rss
                        title: The Guardian
                      - url: https://feeds.nos.nl/nosnieuwsalgemeen
                        title: NOS

                  - type: rss
                    title: Brasil
                    cache: 3h
                    limit: 15
                    collapse-after: 6
                    feeds:
                      - url: https://feeds.folha.uol.com.br/emcimadahora/rss091.xml
                        title: Folha de S.Paulo

                  - type: rss
                    title: Culture
                    cache: 6h
                    limit: 15
                    collapse-after: 6
                    feeds:
                      - url: https://www.theguardian.com/uk/culture/rss
                        title: The Guardian
                      - url: https://theverge.com/rss/index.xml
                        title: The Verge

          - size: small
            widgets:
              - type: bookmarks
                groups:
                  - title: Watch
                    color: 224 90 65
                    links:
                      - title: Movies & TV
                        url: https://jellyfin.atoca.house
                        icon: sh:jellyfin-light
                      - title: Ask for a movie or show
                        url: https://seerr.atoca.house
                        icon: sh:seerr-light

                  - title: Read & Listen
                    color: 262 72 65
                    links:
                      - title: Audiobooks & Podcasts
                        url: https://audiobookshelf.atoca.house
                        icon: sh:audiobookshelf-light
                      - title: Ebooks
                        url: https://kavita.atoca.house
                        icon: sh:kavita-light
                      - title: Comics & Manga
                        url: https://suwayomi.atoca.house
                        icon: sh:suwayomi-light
                      - title: Ask for a book
                        url: https://shelfmark.atoca.house
                        icon: sh:shelfmark-light

                  - title: Get Things Done
                    color: 160 60 45
                    links:
                      - title: Notes & Docs
                        url: https://outline.atoca.house
                        icon: sh:outline-light
                      - title: Handy tools
                        url: https://omni-tools.atoca.house
                        icon: mdi:tools

                  - title: House
                    color: 38 85 55
                    links:
                      - title: Home Assistant
                        url: https://hass.atoca.house
                        icon: sh:home-assistant-light
                      - title: AI Chat
                        url: https://chat.atoca.house
                        icon: sh:open-webui-light
                      - title: Private Search
                        url: https://search.atoca.house
                        icon: sh:searxng-light

      # =========================================================================
      # WATCH — everything Jellyfin / requests.
      # =========================================================================
      - name: Watch
        show-mobile-header: true
        columns:
          - size: small
            widgets:
              - $include: w-jellyfin-stats.yml

              - type: bookmarks
                groups:
                  - title: Jump to
                    color: 224 90 65
                    links:
                      - title: Jellyfin
                        url: https://jellyfin.atoca.house
                        icon: sh:jellyfin-light
                      - title: Request something
                        url: https://seerr.atoca.house
                        icon: sh:seerr-light
                      - title: Live TV
                        url: https://dispatcharr.atoca.house
                        icon: sh:dispatcharr-light

          - size: full
            widgets:
              - $include: w-jellyfin-movies.yml

              - $include: w-jellyfin-shows.yml

              - $include: w-seerr-trending.yml

          - size: small
            widgets:
              - type: monitor
                title: Is it working?
                cache: 2m
                sites:
                  - title: Movies & TV
                    url: https://jellyfin.atoca.house
                    icon: sh:jellyfin-light
                  - title: Requests
                    url: https://seerr.atoca.house
                    icon: sh:seerr-light
                  - title: Live TV
                    url: https://dispatcharr.atoca.house
                    icon: sh:dispatcharr-light
                  - title: Audiobooks
                    url: https://audiobookshelf.atoca.house
                    icon: sh:audiobookshelf-light
                  - title: Ebooks
                    url: https://kavita.atoca.house
                    icon: sh:kavita-light

      # =========================================================================
      # LIFE — saved links, video, personal tools.
      # =========================================================================
      - name: Life
        show-mobile-header: true
        columns:
          - size: small
            widgets:
              - type: calendar
                first-day-of-week: monday

              - type: bookmarks
                groups:
                  - title: Read & Listen
                    color: 262 72 65
                    links:
                      - title: Audiobooks & Podcasts
                        url: https://audiobookshelf.atoca.house
                        icon: sh:audiobookshelf-light
                      - title: Ebooks
                        url: https://kavita.atoca.house
                        icon: sh:kavita-light
                      - title: Comics & Manga
                        url: https://suwayomi.atoca.house
                        icon: sh:suwayomi-light
                      - title: Ask for a book
                        url: https://shelfmark.atoca.house
                        icon: sh:shelfmark-light

                  - title: Everyday
                    color: 160 60 45
                    links:
                      - title: Notes & Docs
                        url: https://outline.atoca.house
                        icon: sh:outline-light
                      - title: Handy tools
                        url: https://it-tools.atoca.house
                        icon: sh:it-tools-light
                      - title: Private Search
                        url: https://search.atoca.house
                        icon: sh:searxng-light

          - size: full
            widgets:
              - $include: w-youtube.yml

              - type: videos
                title: Subscriptions
                limit: 12
                collapse-after-rows: 2
                channels:
                  - UCHnyfMqiRRG1u-2MsSQLbXA  # Veritasium
                  - UCsXVk37bltHxD1rDPwtNM8Q  # Kurzgesagt
                  - UCBJycsmduvYEL83R_U4JriQ  # Marques Brownlee
                  - UC2eYFnH61tmytImy1mTYvhA  # Luke Smith

          - size: small
            widgets:
              - type: markets
                title: Markets
                markets:
                  - symbol: EURBRL=X
                    name: EUR / BRL
                  - symbol: EURUSD=X
                    name: EUR / USD
                  - symbol: BTC-USD
                    name: Bitcoin

      # =========================================================================
      # STATUS — only the services a non-admin would recognise.
      # =========================================================================
      - name: Status
        show-mobile-header: true
        columns:
          - size: full
            widgets:
              - $include: gatus.yml
  gatus.yml: |
    - type: custom-api
      title: Service Status
      cache: 5m
      options:
        base-url: https://status.atoca.house

        style: full
        duration: 24h
        # NOTE: option keys below MUST be kebab-case — the template reads them
        # via .Options.StringOr "show-only-configured" etc. camelCase keys are
        # silently ignored and fall back to their defaults.
        group: ""
        compact-metric: uptime
        show-failing-only: false
        # Only render endpoints that have BOTH an icon and a -url mapping below.
        show-only-configured: true

        # <endpoint-name>: <icon>  /  <endpoint-name>-url: <link>
        # Names must match the Gatus endpoint `name` exactly (auto-discovered
        # by gatus-sidecar from the Service/HTTPRoute name, so lowercase).
        Cloudflare: sh:cloudflare-light
        Cloudflare-url: https://dash.cloudflare.com
        Google: sh:google-light
        Google-url: https://www.google.com
        audiobookshelf: sh:audiobookshelf-light
        audiobookshelf-url: https://audiobookshelf.atoca.house
        glance: sh:glance-light
        glance-url: https://home.atoca.house
        jellyfin: sh:jellyfin-light
        jellyfin-url: https://jellyfin.atoca.house
        kavita: sh:kavita-light
        kavita-url: https://kavita.atoca.house
        open-webui: sh:open-webui-light
        open-webui-url: https://chat.atoca.house
        outline: sh:outline-light
        outline-url: https://outline.atoca.house
        searxng: sh:searxng-light
        searxng-url: https://search.atoca.house
        seerr: sh:seerr-light
        seerr-url: https://seerr.atoca.house
        shelfmark: sh:shelfmark-light
        shelfmark-url: https://shelfmark.atoca.house
        suwayomi: sh:suwayomi-light
        suwayomi-url: https://suwayomi.atoca.house
      template: |
        {{/* Required config options */}}
        {{ $baseURL := .Options.StringOr "base-url" "" }}

        {{/* Optional config options */}}
        {{ $duration := .Options.StringOr "duration" "24h" }}
        {{ $style := .Options.StringOr "style" "full" }}
        {{ $groupFilter := .Options.StringOr "group" "" }}
        {{ $compactMetric := .Options.StringOr "compact-metric" "uptime" }}
        {{ $showFailingOnly := .Options.BoolOr "show-failing-only" false }}
        {{ $showOnlyConfigured := .Options.BoolOr "show-only-configured" false }}


        {{/* Error message template */}}
        {{ define "errorMsg" }}
          <div class="widget-error-header">
            <div class="color-negative size-h3">ERROR</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="break-all">{{ . }}</p>
        {{ end }}

        {{/* Popover template */}}
        {{ define "popover" }}
          <div data-popover-html>
            <div style="margin: 5px;">
              <p class="margin-top-12" style="overflow-y: auto; text-align: justify; max-height: 20rem;">
                {{ range .Array "conditionResults" }}
                  {{ if (.Bool "success") }}
                    <p class="color-positive">{{ .String "condition" }}</p>
                  {{ else }}
                    <p class="color-negative">{{ .String "condition" }}</p>
                  {{ end }}
                {{ end }}
              </p>
            </div>
          </div>
        {{ end }}

        {{ $endpoints := newRequest (print $baseURL "/api/v1/endpoints/statuses")
            | getResponse }}

        {{ $options := .Options }}
        {{ $displayedItems := 0 }}
        {{ if eq $style "compact" }}
          <ul class="dynamic-columns list-gap-8 ">
          {{ range $i, $endpoint := $endpoints.JSON.Array "" }}
              {{ $name := $endpoint.String "name" }}
              {{ $key := $endpoint.String "key" }}
              {{ $group := $endpoint.String "group" }}
              {{ $linkUrlOption := $options.StringOr (concat $name "-url") "" }}
              {{ $linkUrl := $options.StringOr (concat $name "-url") (concat $baseURL "/endpoints/" $key) }}
              {{ $lastResult := index ( $endpoint.Array "results" ) (sub (len ($endpoint.Array "results")) 1) }}
              {{ $latestSuccess := $lastResult.Bool "success" }}

              {{ if and $groupFilter (not (eq $groupFilter $group)) }} {{ continue }} {{ end }}
              {{ if and $showFailingOnly $latestSuccess }} {{ continue }} {{ end }}
              {{ if and $showOnlyConfigured (eq $linkUrlOption "") }} {{ continue }} {{ end }}
              {{ $displayedItems = add $displayedItems 1 }}

              {{ $responseTime := "" }}
              {{ $uptime := "" }}
              {{ $uptimeValue := "" }}

              {{ if eq $compactMetric "uptime" }}
                {{ $uptime = newRequest (print $baseURL "/api/v1/endpoints/" $key "/uptimes/" $duration )
                    | getResponse }}
                {{ $uptimeValue = mul 100 ($uptime.JSON.Float "") }}
              {{ else }}
                {{ $responseTime = newRequest (print $baseURL "/api/v1/endpoints/" $key "/response-times/" $duration )
                    | getResponse }}
              {{ end }}

              <div class="flex items-center gap-12">
                <a class="size-title-dynamic color-highlight text-truncate block grow" href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">{{ $name }}</a>
                <a href="{{ $linkUrl | safeURL }}"  target="_blank" rel="noreferrer">
                  {{ if eq $compactMetric "uptime" }}
                    <div>{{ printf "%.1f" $uptimeValue }}%</div>
                  {{ else }}
                    <div>{{ $responseTime.JSON.Int "" }}ms</div>
                  {{ end }}
                </a>

                {{ if $latestSuccess }}
                  <div class="monitor-site-status-icon-compact">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ else }}
                  <div class="monitor-site-status-icon-compact">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ end }}

              </div>
            {{ end }}
          </ul>
        {{ else }}

          <ul class="dynamic-columns list-gap-20 list-with-separator">
          {{ range $i, $endpoint := $endpoints.JSON.Array "" }}
              {{ $name := $endpoint.String "name" }}
              {{ $key := $endpoint.String "key" }}
              {{ $group := $endpoint.String "group" }}
              {{ $icon := $options.StringOr $name "" }}
              {{ $linkUrlOption := $options.StringOr (concat $name "-url") "" }}
              {{ $linkUrl := $options.StringOr (concat $name "-url") (concat $baseURL "/endpoints/" $key) }}
              {{ $lastResult := index ( $endpoint.Array "results" ) (sub (len ($endpoint.Array "results")) 1) }}
              {{ $latestSuccess := $lastResult.Bool "success" }}

              {{ if and $groupFilter (not (eq $groupFilter $group)) }} {{ continue }} {{ end }}
              {{ if and $showFailingOnly $latestSuccess }} {{ continue }} {{ end }}
              {{ if and $showOnlyConfigured (or (eq $linkUrlOption "") (eq $icon "")) }} {{ continue }} {{ end }}
              {{ $displayedItems = add $displayedItems 1 }}

              {{ $uptime := newRequest (print $baseURL "/api/v1/endpoints/" $key "/uptimes/" $duration )
                  | getResponse }}
              {{ $responseTime := newRequest (print $baseURL "/api/v1/endpoints/" $key "/response-times/" $duration )
                  | getResponse }}

              {{ $uptimeValue := mul 100 ($uptime.JSON.Float "") }}

              {{ $iconUrl := "" }}
              {{ if $icon }}
                {{ $iconPrefix := findMatch "^(si|di|mdi|sh):" $icon }}
                {{ $iconBase := replaceMatches "^(si|di|mdi|sh):" "" $icon }}

                {{ $iconExt := findMatch "\\.[a-z]+$" $iconBase }}
                {{ $iconExt := replaceMatches "\\." "" $iconExt }}
                {{ $iconBase = replaceMatches "\\.[a-z]+$" "" $iconBase }}
                {{ if eq $iconExt "" }} {{ $iconExt = "svg" }} {{ end }}

                {{ if eq $iconPrefix "si:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" $iconBase ".svg" }}
                {{ else if eq $iconPrefix "di:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/" $iconExt "/" $iconBase "." $iconExt }}
                {{ else if eq $iconPrefix "mdi:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/" $iconBase ".svg" }}
                {{ else if eq $iconPrefix "sh:" }}
                  {{ $iconUrl = concat "https://cdn.jsdelivr.net/gh/selfhst/icons/" $iconExt "/" $iconBase "." $iconExt }}
                {{ else }}
                  {{ $iconUrl = $icon }}
                {{ end }}
              {{ end }}

              <div class="monitor-site flex items-center gap-15">
                {{ if $iconUrl }}
                  <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                    <img class="monitor-site-icon" src="{{ $iconUrl | safeURL }}" alt="" loading="lazy">
                  </a>
                {{ end }}
                <div class="grow min-width-0">
                  <a class="size-h3 color-highlight text-truncate block" href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">{{ $name }}</a>

                  <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                    <ul class="list-horizontal-text">
                      <li class="{{ if not $latestSuccess }}color-negative{{ end }}">{{ printf "%.1f" $uptimeValue }}%</li>
                      <li>{{ $responseTime.JSON.Int "" }}ms</li>
                    </ul>
                  </a>
                </div>

                {{ if $latestSuccess }}
                  <div class="monitor-site-status-icon">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ else }}
                  <div class="monitor-site-status-icon">
                    <a href="{{ $linkUrl | safeURL }}" target="_blank" rel="noreferrer">
                      <div data-popover-type="html" data-popover-position="above" data-popover-show-delay="500" style="align-content: center;">
                        {{ template "popover" $lastResult }}
                        <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                          <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
                        </svg>
                      </div>
                    </a>
                  </div>
                {{ end }}

              </div>
            {{ end }}
          </ul>
        {{ end }}

        {{ if eq $displayedItems 0 }}
          <div class="flex items-center justify-center gap-10 padding-block-5">
            <p>All sites are online</p>
            <svg class="shrink-0" style="width: 1.7rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--color-positive)">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd" />
            </svg>
          </div>
        {{ end }}
  w-hass.yml: |
    - type: custom-api
      title: Our Home
      cache: 2m
      url: ${HASS_URL}/api/states
      headers:
        Authorization: "Bearer ${HASS_API_KEY}"
        Content-Type: "application/json"
      template: |
        {{ if eq .Response.StatusCode 200 }}
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
            {{ range .JSON.Array "" }}
              {{ $id := .String "entity_id" }}
              {{ $state := .String "state" }}
              {{ if and (or
                            (eq $id "sensor.lywsd03mmc_temperature")
                            (eq $id "sensor.lywsd03mmc_humidity")
                            (eq $id "sensor.office_temperature")
                            (eq $id "sensor.office_humidity")
                            (eq $id "sensor.balcony_temperature")
                            (eq $id "sensor.balcony_humidity")
                        )
                        (ne $state "unavailable")
                        (ne $state "unknown")
              }}
                <div class="background-faint radius-8" style="padding: 6px 10px; text-align: center;">
                  <div class="color-highlight size-h3" style="line-height: 1.2;">
                    {{ $state }}{{ .String "attributes.unit_of_measurement" }}
                  </div>
                  <div class="size-h6 color-subdue" style="line-height: 1.2;">
                    {{ .String "attributes.friendly_name" }}
                  </div>
                </div>
              {{ end }}
            {{ end }}
          </div>
        {{ else }}
          <div style="text-align: center;" class="color-negative size-h4">
            Error: {{ .Response.StatusCode }} – {{ .Response.Status }}
          </div>
        {{ end }}
  w-jellyfin-movies.yml: |
    - type: custom-api
      title: New Movies
      frameless: true
      cache: 5m
      options:
        base-url: ${JELLYFIN_URL}
        api-key: ${JELLYFIN_KEY}
        user-name: "${JELLYFIN_USER}"
        library-name: "Movies"
        mode: "latest"
        item-count: "10"
        small-column: false
        show-thumbnail: false
        thumbnail-aspect-ratio: "default"
      template: |
        {{/* Required config options */}}
        {{ $baseURL := .Options.StringOr "base-url" "" }}
        {{ $apiKey := .Options.StringOr "api-key" "" }}
        {{ $userName := .Options.StringOr "user-name" "" }}

        {{/* Required config options for "latest" mode */}}
        {{ $libraryName := .Options.StringOr "library-name" "" }}

        {{/* Optional config options */}}
        {{ $mode := .Options.StringOr "mode" "latest" }}
        {{ $itemCount := .Options.StringOr "item-count" "10" }}
        {{ $mediaTypes := .Options.StringOr "media-types" "Movie,Episode,MusicAlbum" }}
        {{ $thumbAspectRatio := .Options.StringOr "thumbnail-aspect-ratio" "" }}
        {{ $isSmallColumn:= .Options.BoolOr "small-column" false }}
        {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
        {{ $showProgressBar := .Options.BoolOr "progress-bar" true }}

        {{/* Error message template */}}
        {{ define "errorMsg" }}
          <div class="widget-error-header">
            <div class="color-negative size-h3">ERROR</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="break-all">{{ . }}</p>
        {{ end }}

        {{/* Check required fields */}}
        {{ if or (eq $baseURL "") (eq $apiKey "") (eq $userName "") (eq $mode "") (and (eq $mode "latest") (eq $libraryName "")) }}
          {{ template "errorMsg" "Some required options are not set." }}
        {{ else }}

          {{/* Fetch user ID */}}
          {{ $userID := "" }}
          {{ $usersCall := newRequest (print $baseURL "/Users")
              | withParameter "api_key" $apiKey
              | withHeader "Accept" "application/json"
              | getResponse }}

          {{ range $i, $user := $usersCall.JSON.Array "" }}
            {{ if eq ($user.String "Name") $userName }}
              {{ $userID = $user.String "Id" }}
              {{ break }}
            {{ end }}
          {{ end }}
          {{ if eq $userID "" }}
            {{ template "errorMsg" (printf "User '%s' not found." $userName) }}
          {{ else }}

            {{ $items := "" }}

            {{ if eq $mode "latest" }}

              {{/* Fetch library ID */}}
              {{ $libraryID := "" }}
              {{ $userViewsCall := newRequest (print $baseURL "/UserViews")
                  | withParameter "api_key" $apiKey
                  | withParameter "userId" $userID
                  | withHeader "Accept" "application/json"
                  | getResponse }}

              {{ range $i, $item := $userViewsCall.JSON.Array "Items" }}
                {{ if eq ($item.String "Name") $libraryName }}
                  {{ $libraryID = $item.String "Id" }}
                  {{ break }}
                {{ end }}
              {{ end }}

              {{ if eq $libraryID "" }}
                {{ template "errorMsg" (printf "Library '%s' not found." $libraryName) }}
              {{ else }}
                {{/* Fetch latest items */}}
                {{ $latestCall := newRequest (print $baseURL "/Users/" $userID "/Items/Latest")
                    | withParameter "api_key" $apiKey
                    | withParameter "Limit" $itemCount
                    | withParameter "ParentId" $libraryID
                    | withParameter "IncludeItemTypes" $mediaTypes
                    | withParameter "GroupItems" "true"
                    | withHeader "Accept" "application/json"
                    | getResponse }}
                {{ $items = $latestCall.JSON.Array "" }}
              {{ end }}

            {{ else if eq $mode "nextup" }}

              {{/* Fetch next up items */}}
              {{ $nextUpCall := newRequest (print $baseURL "/Shows/NextUp")
                | withParameter "api_key" $apiKey
                | withParameter "UserId" $userID
                | withParameter "Limit" $itemCount
                | withParameter "EnableResumable" "true"
                | withHeader "Accept" "application/json"
                | getResponse }}
              {{ $items = $nextUpCall.JSON.Array "Items" }}

            {{ else }}
              {{ template "errorMsg" "Unknown mode, expected 'latest' or 'nextup'" }}
            {{ end }}

            {{ if eq (len $items) 0 }}
              <p>No items found, start streaming something!</p>
            {{ else }}

              {{/* Display the item carousel */}}
              <div class="carousel-container show-right-cutoff">
                <div class="cards-horizontal carousel-items-container">
                  {{ range $n, $item := $items }}
                    {{/* Common item variables */}}
                    {{ $mediaType := $item.String "Type" }}
                    {{ $title := $item.String "Name" }}
                    {{ $itemID := $item.String "Id" }}

                    {{/* Media type specific variables */}}
                    {{ $seriesTitle := "" }}
                    {{ $artist := "" }}
                    {{ $seriesID := "" }}
                    {{ $season := "" }}
                    {{ $episode := "" }}
                    {{ $playPercentage := "" }}
                    {{ $unwatchedEpisodeCount := "" }}

                    {{ if eq $mediaType "Movie" }}
                    {{ else if eq $mediaType "Series" }}
                      {{ $unwatchedEpisodeCount = $item.Int "UserData.UnplayedItemCount" }}
                    {{ else if eq $mediaType "Episode" }}
                      {{ $unwatchedEpisodeCount = 1 }}
                      {{ $seriesTitle = $item.String "SeriesName" }}
                      {{ $seriesID = $item.String "SeriesId" }}
                      {{ $season = $item.Int "ParentIndexNumber" }}
                      {{ $episode = $item.Int "IndexNumber" }}

                      {{ if $item.Exists "UserData.PlayedPercentage" }}
                        {{ $playPercentage = $item.String "UserData.PlayedPercentage" }}
                      {{ end }}

                      {{/* For latest always refer to the series not individual episodes */}}
                      {{ if eq $mode "latest" }}
                        {{ $itemID = $seriesID }}
                        {{ $title = $seriesTitle }}
                      {{ end }}
                    {{ else if eq $mediaType "MusicAlbum" }}
                      {{ $artist = $item.String "AlbumArtist" }}
                    {{ end }}

                    {{ $linkURL := print $baseURL "/web/#/details?id=" $itemID }}
                    {{ $thumbURL := "" }}
                    {{ if not (eq $playPercentage "") }}
                      {{/* $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey "&percentPlayed=" $playPercentage */}}
                      {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                    {{ else }}
                      {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                    {{ end }}

                    <a class="card widget-content-frame" href="{{ $linkURL | safeURL }}">
                      {{ if $showThumbnail }}
                        <div style="position: relative;">
                          <img src="{{ $thumbURL | safeURL }}"
                            alt="{{ $title }} thumbnail"
                            loading="lazy"
                            class="media-server-thumbnail shrink-0"
                            style="
                              object-fit: fill;
                              border-radius: var(--border-radius) var(--border-radius) 0 0;
                              width: 100%;
                              display: block;
                              {{ if eq $thumbAspectRatio "square" }}aspect-ratio: 1;
                              {{ else if eq $thumbAspectRatio "portrait" }}aspect-ratio: 2/3;
                              {{ else if eq $thumbAspectRatio "landscape" }}aspect-ratio: 16/9;
                              {{ else }}aspect-ratio: initial;
                              {{ end }}
                            "
                          />

                          {{ if and ($showProgressBar) (not (eq $playPercentage "")) }}
                            <div style="
                              position: absolute;
                              bottom: 8px;
                              left: 8px;
                              right: 8px;
                              height: 6px;
                              border-radius: var(--border-radius);
                              overflow: hidden;
                              background-color: rgba(255, 255, 255, 0.2);
                            ">
                              <div style="
                                width: {{ print $playPercentage "%" }};
                                height: 100%;
                                border-radius: var(--border-radius) 0 0 var(--border-radius);
                                background-color: var(--color-primary)
                              "></div>
                            </div>
                          {{ end }}
                        </div>
                      {{ end }}

                      <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                        <ul class="flex flex-column justify-evenly margin-bottom-3 {{ if $isSmallColumn }}size-h6{{ end }}" style="height: 100%;">
                          {{ if eq $mode "latest" }}
                            {{ if or (eq $mediaType "Series") (eq $mediaType "Episode") }}
                              <ul class="list-horizontal-text flex-nowrap">
                                <li class="color-primary shrink-0">{{ $unwatchedEpisodeCount }}</li>
                                <li class="text-truncate">{{ $title }}</li>
                              </ul>
                            {{ else if eq $mediaType "MusicAlbum" }}
                              <ul class="list-horizontal-text flex-nowrap">
                                <li class="color-primary text-truncate">{{ $artist }}</li>
                                <li class="text-truncate">{{ $title }}</li>
                              </ul>
                            {{ else }}
                              <li class="text-truncate">{{ $title }}</li>
                            {{ end }}
                          {{ else if eq $mode "nextup" }}
                            <ul class="list-horizontal-text flex-nowrap">
                              <li class="color-primary shrink-0">S{{ $season }}E{{ $episode }}</li>
                              <li class="text-truncate">{{ $seriesTitle }}</li>
                            </ul>
                            <li class="text-truncate">{{ $title }}</li>
                          {{ end }}
                        </ul>
                      </div>
                    </a>
                  {{ end }}
                </div>
              </div>
            {{ end }}

          {{ end }}

        {{ end }}
