---
controllers:
  error-pages:
    replicas: 2
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/tarampampam/error-pages
          tag: 4.2.5
        env:
          TEMPLATE_NAME: lost-in-space
          SHOW_DETAILS: "false"
          LISTEN_PORT: &port 80
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        port: *port

route:
  internal: &route
    annotations:
      gatus.home-operations.com/enabled: "false"
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - "error-pages.atoca.house"
    rules:
      - backendRefs:
          - name: error-pages
            port: *port
        filters:
          # script hash = generated localization script; if stale after an upgrade, pages just render untranslated
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: Content-Security-Policy
                  value: "default-src 'none'; script-src 'sha256-fUN4SzN/I8PVVdjlINOlstTz/75Gvf3F/xcNuPUb3GA='; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
        matches:
          - path:
              type: PathPrefix
              value: /
  external:
    <<: *route
    annotations:
      externaldns.enable.custom/internal: "false"
    parentRefs:
      - name: atoca-house-external
        namespace: kube-system
