---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name filebrowser-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          http:
            port: 8080
            baseURL: /
            externalUrl: https://filebrowser.atoca.house
            trustProxyHeaders: true
          server:
            cacheDir: /home/filebrowser/tmp
            database:
              path: /home/filebrowser/database/filebrowser.sqlite
            sources:
              - name: Media
                path: /mnt/media
                config:
                  denyByDefault: false
                  private: false
                  disabled: false
                  defaultEnabled: true
                  defaultUserScope: /
                  createUserDir: false
                  defaultPermissions:
                    view: true
                    download: false
                    modify: false
                    create: false
                    delete: false

          auth:
            methods:
              noauth: false
              password:
                enabled: false
              oidc:
                enabled: true
                clientId: 'filebrowser'
                clientSecret: '{{ .FILEBROWSER_OAUTH_CLIENT_SECRET }}'
                issuerUrl: 'https://auth.atoca.house'
                scopes: 'email openid profile groups'
                userIdentifier: 'preferred_username'
                disableVerifyTLS: false
                logoutRedirectUrl: ''
                createUser: true  # Auto-create users who pass Authelia authentication + access control
                adminGroup: 'filebrowser_admins'
                groupsClaim: 'groups'
          userDefaults:
            account:
              permissions:
                share: false    # Disable public sharing by default (admins can override)

  dataFrom:
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-r2-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .RESTIC_REPOSITORY }}/filebrowser"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-r2
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
