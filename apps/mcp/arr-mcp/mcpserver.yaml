---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/aplaceforallmystuff/mcp-arr:1.7.3@sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
  env:
    # mcp-arr only speaks HTTP when MCP_TRANSPORT is literally "http", but
    # ToolHive overwrites that var with its own transport name. Run the image
    # in its default stdio mode and let the ToolHive proxy expose HTTP.
    - name: SONARR_URL
      value: http://sonarr.sonarr.svc.cluster.local
    - name: RADARR_URL
      value: http://radarr.radarr.svc.cluster.local
    - name: PROWLARR_URL
      value: http://prowlarr.prowlarr.svc.cluster.local:9696
  secrets:
    - name: arr-mcp-sonarr-secret
      key: SONARR_API_KEY
      targetEnvName: SONARR_API_KEY
    - name: arr-mcp-radarr-secret
      key: RADARR_API_KEY
      targetEnvName: RADARR_API_KEY
    - name: arr-mcp-prowlarr-secret
      key: PROWLARR_API_KEY
      targetEnvName: PROWLARR_API_KEY
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs
      volumes:
        - name: tmpfs
  proxyPort: 8080
  transport: stdio
