---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Every field in the 1Password item becomes an env var. Expected field names:
# SHODAN_API_KEY, GOOGLE_CLOUD_API_KEY, CERTSPOTTER_TOKEN, CLOUDMERSIVE_API_KEY (all optional)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-check-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: web-check-secret
  dataFrom:
    - extract:
        key: web-check-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
