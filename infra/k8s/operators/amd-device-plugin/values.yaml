---
controllers:
  amd-device-plugin:
    type: daemonset

    containers:
      app:
        image:
          repository: docker.io/rocm/k8s-device-plugin
          tag: 1.31.0.12@sha256:6437c74f6566e5d11c20c42369fca7194315943aea91f7bd6c98de1b19caf117

        workingDir: /root

        command: ["./k8s-device-plugin"]

        args: ["-logtostderr=true", "-stderrthreshold=INFO", "-v=5"]

        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            memory: 100Mi

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

service:
  app:
    enabled: false
    controller: amd-device-plugin

persistence:
  sys:
    enabled: true
    type: hostPath
    hostPath: /sys

  device-plugins:
    enabled: true
    type: hostPath
    hostPath: /var/lib/kubelet/device-plugins
