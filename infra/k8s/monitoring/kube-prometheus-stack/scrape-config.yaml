---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name compartilhado-node-exporter
spec:
  staticConfigs:
    - targets:
        - nas.internal:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
  metricRelabelings:
    # Virtual bridges (docker0, veth, hassio) keep MTU 1500 and never follow the
    # host NIC jumbo-frame setting. Drop their MTU so CephNodeInconsistentMTU
    # does not flag them as outliers against the 9000 median.
    - action: drop
      sourceLabels: [__name__, device]
      regex: node_network_mtu_bytes;(docker0|docker_gwbridge|hassio|br-.*|veth.*|virbr.*)
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: smartctl-exporter
spec:
  staticConfigs:
    - targets:
        - nas.internal:9633
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: smartctl-exporter
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name hass-node-exporter
spec:
  staticConfigs:
    - targets:
        - hass.internal:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
  metricRelabelings:
    # Virtual bridges (docker0, veth, hassio) keep MTU 1500 and never follow the
    # host NIC jumbo-frame setting. Drop their MTU so CephNodeInconsistentMTU
    # does not flag them as outliers against the 9000 median.
    - action: drop
      sourceLabels: [__name__, device]
      regex: node_network_mtu_bytes;(docker0|docker_gwbridge|hassio|br-.*|veth.*|virbr.*)
