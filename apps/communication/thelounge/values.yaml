controllers:
  thelounge:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    containers:
      thelounge:
        image:
          repository: ghcr.io/home-operations/thelounge
          tag: 4.5.2@sha256:7e18ada1421f341b6b129dbb8e4a307320c34ffe38ceef0799ead7f5a3643dbc
          pullPolicy: IfNotPresent
        env:
          # Keep existing PVC layout (was official image's home dir)
          THELOUNGE_HOME: /var/opt/thelounge
          # Image enables 30-day message deletion by default; keep history as before
          THELOUNGE_STORAGE_POLICY_ENABLED: "false"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            memory: 128Mi
            cpu: 10m
          limits:
            memory: "256Mi"
            cpu: "500m"

defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.14/24"],
        "mac": "3a:91:7c:2e:58:04"
      }]

service:
  thelounge:
    controller: thelounge
    ports:
      http:
        port: 9000

route:
  thelounge:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - thelounge.atoca.house
    rules:
      - backendRefs:
          - name: thelounge
            port: 9000
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  thelounge:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /var/opt/thelounge
