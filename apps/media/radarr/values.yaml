controllers:
  radarr:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      radarr:
        image:
          repository: ghcr.io/home-operations/radarr
          tag: 7.0.1.10859@sha256:ffe1f4d7c30b33a1e1256e14ace0eefddf120b37d8defceba208e9c190772f8d
        env:
          RADARR__APP__INSTANCENAME: Radarr
          RADARR__APP__THEME: dark
          # OIDC (Authelia, authorization_policy: admins). Secret + allowed user in radarr-secret.
          RADARR__AUTH__METHOD: Oidc
          RADARR__AUTH__OIDCAUTHORITY: https://auth.atoca.house
          RADARR__AUTH__OIDCCLIENTID: radarr
          RADARR__LOG__DBENABLED: "False"
          RADARR__LOG__LEVEL: info
          RADARR__SERVER__PORT: &port 80
          # Trust X-Forwarded-Proto from the gateway (pod CIDR) so the OIDC redirect_uri is https.
          RADARR__SERVER__TRUSTEDNETWORKS: 10.244.0.0/16
        envFrom:
          - secretRef:
              name: "radarr-secret"
        probes:
          liveness:
            enabled: true
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: *port
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 25m
            memory: 384Mi
          limits:
            memory: 3Gi
      exportarr:
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
        args: ["radarr"]
        env:
          PORT: &metricsPort 9707
          URL: http://localhost:80
          APIKEY:
            valueFrom:
              secretKeyRef:
                name: radarr-secret
                key: RADARR__AUTH__APIKEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
service:
  radarr:
    controller: radarr
    ports:
      http:
        port: *port
      metrics:
        port: *metricsPort
serviceMonitor:
  radarr:
    endpoints:
      - port: metrics
route:
  radarr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - radarr.atoca.house
    rules:
      - backendRefs:
          - name: radarr
            port: 80
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /config/

  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/
    globalMounts:
      - path: /data
  tmp:
    type: emptyDir
