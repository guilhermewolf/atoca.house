---
controllers:
  vidya:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # Fork with in-app OIDC, built by vidya-self's Forgejo Actions workflow.
          # Not Renovate-managed: the private registry has no host rule here.
          repository: forge.atoca.house/guilherme/vidya-self
          tag: f88f49d@sha256:e0106c6e639e84484364ed514f3473403e978031d901918606915b123061b9b7
        env:
          VIDYA_DATA_PATH: /data
          PORT: &port 31415
          TMPDIR: /tmp
          # In-app SSO via Authelia client vidya-app; the gateway OIDC in
          # securitypolicy.yaml (client vidya) still gates the whole route.
          OIDC_ISSUER_URL: https://auth.atoca.house
          OIDC_CLIENT_ID: vidya-app
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: vidya-oidc
                key: OIDC_CLIENT_SECRET
          OIDC_REDIRECT_URI: https://vidya.atoca.house/api/auth/oidc/callback
          OIDC_SCOPES: openid profile email groups
          OIDC_ADMIN_GROUP: admins
          OIDC_BUTTON_LABEL: Log in with Authelia
          OIDC_AUTO_CREATE: "true"
          OIDC_DISABLE_LOCAL_LOGIN: "true"
          # Requests arrive from the Envoy gateway pods; trust X-Forwarded-For
          # only from the pod CIDR so clients can't spoof their IP.
          TRUST_PROXY: 10.244.0.0/16
          VIDYA_SCAN_INTERVAL_MINUTES: "360"
          # Browser-incompatible videos are transcoded on the fly to HLS
          # segments in this scratch dir (the hls emptyDir below).
          VIDYA_HLS_PATH: /tmp/vidya-hls
          VIDYA_TRANSCODE_THREADS: "4"
          # H.264 encode on the node's AMD iGPU (decode stays on CPU); falls
          # back to libx264 if the GPU path fails.
          VIDYA_TRANSCODE_HWACCEL: vaapi
          LIBVA_DRIVER_NAME: radeonsi
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
            amd.com/gpu: 1
          limits:
            memory: 2Gi
            amd.com/gpu: 1
        # /healthz checks the DB and that every media root opendir()s within
        # 5s, so a stale NFS handle or a blocked event loop fails the probe.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  imagePullSecrets:
    - name: forgejo-registry
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch
    # video/render groups for /dev/dri (same as jellyfin)
    supplementalGroups: [44, 109]

service:
  app:
    # Gatus probes /healthz in-cluster: the route is behind gateway OIDC and
    # the internal gateway only gets a DNS check.
    annotations:
      gatus.home-operations.com/enabled: "true"
      gatus.home-operations.com/endpoint: |-
        name: vidya-healthz
        group: internal
        url: http://vidya.vidya.svc.cluster.local:31415/healthz
        conditions: ["[STATUS] == 200"]
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - vidya.atoca.house
    rules:
      - backendRefs:
          - name: vidya
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

  # On-the-fly HLS segments (VIDYA_HLS_PATH); node disk, not RAM.
  hls:
    type: emptyDir
    sizeLimit: 10Gi
    globalMounts:
      - path: /tmp/vidya-hls

  # key "config" keeps PVC name = "vidya", matching backup.yaml/restore.yaml (same as kavita)
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /data

  # whole media share read-only; add course folders (e.g. /media/masterclass) in Vidya's admin UI
  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/media/
    globalMounts:
      - path: /media
        readOnly: true
