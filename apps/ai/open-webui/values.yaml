---
controllers:
  open-webui:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }

        k8s.ksgate.org/dragonfly-ready: |
          {
            "apiVersion": "dragonflydb.io/v1alpha1",
            "kind": "Dragonfly",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster",
            "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
          }
        k8s.ksgate.org/dragonfly-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster"
          }

        k8s.ksgate.org/litellm-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "litellm",
            "namespace": "litellm",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/litellm-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "litellm",
            "namespace": "litellm"
          }

        k8s.ksgate.org/searxng-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "searxng",
            "namespace": "searxng",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/searxng-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "searxng",
            "namespace": "searxng"
          }

        k8s.ksgate.org/qdrant-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "qdrant",
            "namespace": "qdrant",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/qdrant-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "qdrant",
            "namespace": "qdrant"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
        - name: k8s.ksgate.org/dragonfly-ready
        - name: k8s.ksgate.org/dragonfly-service
        - name: k8s.ksgate.org/litellm-deployment
        - name: k8s.ksgate.org/litellm-service
        - name: k8s.ksgate.org/searxng-deployment
        - name: k8s.ksgate.org/searxng-service
        - name: k8s.ksgate.org/qdrant-deployment
        - name: k8s.ksgate.org/qdrant-service
    containers:
      app:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: v0.11.4
        env:
          # Open-webui settings
          # Env is the source of truth: without this, ConfigVars (provider,
          # tool servers, ...) are read only on first boot and the DB wins.
          # Anything changed in the admin UI resets on restart.
          ENABLE_PERSISTENT_CONFIG: "False"
          # Models: LiteLLM only (its ollama-backed groups cover local models).
          # Per-app virtual key minted by litellm-operator (litellm-key.yaml).
          ENABLE_OLLAMA_API: "False"
          ENABLE_OPENAI_API: "True"
          OPENAI_API_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
          OPENAI_API_KEY:
            valueFrom:
              secretKeyRef:
                name: litellm-key
                key: LITELLM_API_KEY
          # LiteLLM's /v1/models expands the chatgpt/* and nous/* wildcards into
          # ~200 entries (image/audio models, ones the account rejects). List
          # only the chat model groups; add new LiteLLMModels here.
          OPENAI_API_CONFIGS: >-
            {"0":{"enable":true,"model_ids":[
            "chatgpt/gpt-6.1-sol","chatgpt/gpt-6-sol","chatgpt/gpt-6-luna",
            "nous-claude-opus","nous-claude-sonnet",
            "groq-gpt-oss-120b","cerebras-gpt-oss-120b","openrouter-free","mistral-small",
            "qwen3.8-27b","qwen3.5-9b","gemma4-12b","gemma4-e4b"]}}
          # ChatGPT-like out of the box. Which models a non-admin sees at all is
          # set per model (name, description, access) in Admin > Models — DB,
          # not env. Pinned = the short list in the sidebar.
          DEFAULT_MODELS: chatgpt/gpt-6-sol
          DEFAULT_PINNED_MODELS: chatgpt/gpt-6.1-sol,chatgpt/gpt-6-sol,chatgpt/gpt-6-luna,groq-gpt-oss-120b,qwen3.5-9b
          # Non-admins get Custom-GPT-style assistants, projects/knowledge,
          # saved prompts and scheduled tasks.
          USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "True"
          USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "True"
          USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "True"
          USER_PERMISSIONS_FEATURES_AUTOMATIONS: "True"
          # Titles, tags, follow-ups, search queries: never on the chat model
          # (would burn Nous credit / ChatGPT quota on housekeeping).
          TASK_MODEL_EXTERNAL: groq-gpt-oss-120b
          ENABLE_EVALUATION_ARENA_MODELS: "False"
          ENABLE_COMMUNITY_SHARING: "False"
          # Embeddings (RAG + memories) via LiteLLM -> ollama nomic-embed-text
          # instead of in-pod SentenceTransformers. Changing the model means
          # reindexing (Admin > Documents).
          RAG_EMBEDDING_ENGINE: openai
          RAG_EMBEDDING_MODEL: nomic-embed-text
          RAG_OPENAI_API_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
          RAG_OPENAI_API_KEY:
            valueFrom:
              secretKeyRef:
                name: litellm-key
                key: LITELLM_API_KEY
          # Tools: in-cluster ToolHive MCP proxies (streamable HTTP at /mcp, no
          # auth for in-cluster callers). With access_grants: every user; without:
          # admin-only (memory, kubesearch, ha, arr are homelab/admin tools).
          TOOL_SERVER_CONNECTIONS: >-
            [
            {"type":"mcp","url":"http://mcp-memory-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"memory","name":"Memory","description":"atoca-memory knowledge graph"}},
            {"type":"mcp","url":"http://mcp-kubesearch-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"kubesearch","name":"Kubesearch","description":"Community homelab HelmReleases"}},
            {"type":"mcp","url":"http://mcp-context7-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"context7","name":"Context7","description":"Library documentation"}},
            {"type":"mcp","url":"http://mcp-ha-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"ha","name":"Home Assistant","description":"Home Assistant control"}},
            {"type":"mcp","url":"http://mcp-arr-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"arr","name":"Arr","description":"Sonarr, Radarr, Prowlarr"}},
            {"type":"mcp","url":"http://mcp-vikunja-mcp-proxy.mcp.svc.cluster.local:8080/mcp","auth_type":"none","key":"","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"vikunja","name":"Vikunja","description":"Tasks"}}
            ]
          ENABLE_SEARCH_QUERY_GENERATION: True
          ENABLE_WEB_SEARCH: True
          ENABLE_LOGIN_FORM: False
          DATABASE_PORT: "5432"
          DATABASE_TYPE: postgres
          WEBUI_URL: https://chat.atoca.house
          # Redis
          ENABLE_WEBSOCKET_SUPPORT: "true"
          WEBSOCKET_MANAGER: "redis"
          WEBSOCKET_REDIS_URL: "redis://dragonfly.dragonfly-cluster.svc.cluster.local:6379/5"

          # Searx
          WEB_SEARCH_ENGINE: searxng
          SEARXNG_QUERY_URL: http://searxng.searxng.svc.cluster.local:8080/search?q=<query>

          # Vector
          VECTOR_DB: qdrant
          QDRANT_URI: http://qdrant.qdrant.svc.cluster.local:6333
          # Auth
          ENABLE_OAUTH_SIGNUP: "true"
          OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
          OAUTH_PROVIDER_NAME: "Authelia"
          OPENID_PROVIDER_URL: "https://auth.atoca.house/.well-known/openid-configuration"
          OAUTH_CLIENT_ID: "open-webui"
          OAUTH_SCOPES: "openid email profile groups"
          ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
          OAUTH_ALLOWED_ROLES: "openwebui,openwebui-admin"
          OAUTH_ADMIN_ROLES: "openwebui-admin"
          OAUTH_ROLES_CLAIM: "groups"
          OAUTH_CODE_CHALLENGE_METHOD: "S256"

          # Text-to-Speech: browser-native Web Speech API (no in-cluster TTS
          # backend anymore).
          TTS_ENGINE: ""

          # Document extraction
          CONTENT_EXTRACTION_ENGINE: tika
          TIKA_SERVER_URL: http://localhost:9998
        envFrom:
          - secretRef:
              name: open-webui-secret
          - secretRef:
              name: open-webui-db-secret
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            memory: 1Gi

      tika:
        image:
          repository: docker.io/apache/tika
          tag: 3.3.1.0-full
          pullPolicy: IfNotPresent
        ports:
          - containerPort: 9998
        resources:
          requests:
            cpu: 10m
            memory: 384Mi
service:
  app:
    ports:
      http:
        port: &port 8080

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - chat.atoca.house
    rules:
      - backendRefs:
          - name: open-webui
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /app/backend/data
