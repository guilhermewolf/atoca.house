---
controllers:
  vidya:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # Fork with in-app OIDC, built by vidya-self's Forgejo Actions workflow.
          # Not Renovate-managed: the private registry has no host rule here.
          repository: forge.atoca.house/guilherme/vidya-self
          tag: aa52a10@sha256:8ca68cea23c25257a0990c7bf50ba618762e6136d4799852f30251ddeaf58985
        env:
          VIDYA_DATA_PATH: /data
          PORT: &port 31415
          TMPDIR: /tmp
          # In-app SSO via Authelia client vidya-app; the gateway OIDC in
          # securitypolicy.yaml (client vidya) still gates the whole route.
          OIDC_ISSUER_URL: https://auth.atoca.house
          OIDC_CLIENT_ID: vidya-app
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: vidya-oidc
                key: OIDC_CLIENT_SECRET
          OIDC_REDIRECT_URI: https://vidya.atoca.house/api/auth/oidc/callback
          OIDC_SCOPES: openid profile email groups
          OIDC_ADMIN_GROUP: admins
          OIDC_BUTTON_LABEL: Log in with Authelia
          OIDC_AUTO_CREATE: "true"
          OIDC_DISABLE_LOCAL_LOGIN: "false"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  imagePullSecrets:
    - name: forgejo-registry
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - vidya.atoca.house
    rules:
      - backendRefs:
          - name: vidya
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

  # key "config" keeps PVC name = "vidya", matching backup.yaml/restore.yaml (same as kavita)
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /data

  # whole media share read-only; add course folders (e.g. /media/masterclass) in Vidya's admin UI
  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/media/
    globalMounts:
      - path: /media
        readOnly: true
