---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-rules
spec:
  groups:
    - name: trivy-operator.rules
      rules:
        # ignoreUnfixed is on, so every reported CVE has a fix. Compare against a
        # day ago so the existing backlog stays quiet; images that weren't running
        # a day ago count as 0 so a bump that adds CRITICALs still fires.
        - alert: TrivyNewCriticalVulnerability
          expr: |-
            sum by (namespace, image_registry, image_repository) (trivy_image_vulnerabilities{severity="Critical"})
              >
            (
              sum by (namespace, image_registry, image_repository) (trivy_image_vulnerabilities{severity="Critical"} offset 1d)
              or
              sum by (namespace, image_registry, image_repository) (trivy_image_vulnerabilities{severity="Critical"}) * 0
            )
          for: 1h
          annotations:
            summary: >-
              {{ $labels.image_registry }}/{{ $labels.image_repository }} in {{ $labels.namespace }}
              has new fixable CRITICAL vulnerabilities ({{ $value }} total)
          labels:
            severity: warning
