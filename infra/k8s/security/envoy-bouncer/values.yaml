---
controllers:
  crowdsec-envoy-bouncer:
    annotations:
      reloader.stakater.com/auto: "true"
    strategy: RollingUpdate
    # Keep replicas on separate nodes; PDB in pdb.yaml protects voluntary drains.
    replicas: 2
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy-bouncer
    containers:
      app:
        image:
          repository: ghcr.io/kdwils/envoy-proxy-bouncer
          tag: v0.8.2@sha256:444dcf855e3e4aac290084733ecca127e55abb966938be919e0aa7caf209e5e6
        env:
          ENVOY_BOUNCER_BOUNCER_BANSTATUSCODE: 418
          ENVOY_BOUNCER_BOUNCER_ENABLED: true
          ENVOY_BOUNCER_BOUNCER_LAPIURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
          ENVOY_BOUNCER_BOUNCER_METRICS: true
          ENVOY_BOUNCER_BOUNCER_METRICSINTERVAL: 15m
          # v0.6+: native Prometheus /metrics endpoint.
          ENVOY_BOUNCER_PROMETHEUS_ENABLED: true
          ENVOY_BOUNCER_PROMETHEUS_PORT: 9090
          ENVOY_BOUNCER_TEMPLATES_DENIEDTEMPLATEPATH: /ban.html
          # Pod CIDR must be trusted so the bouncer walks X-Forwarded-For back to
          # the real client IP when requests arrive via cloudflare-tunnel pods.
          # Envoy Gateway's own ClientTrafficPolicy uses the same CIDR. LAN
          # (192.168.0.0/16) is deliberately NOT trusted: a LAN client could
          # otherwise set its own XFF.
          ENVOY_BOUNCER_TRUSTEDPROXIES: 10.244.0.0/16
          ENVOY_BOUNCER_WAF_APPSECURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
          ENVOY_BOUNCER_WAF_ENABLED: true
          ENVOY_BOUNCER_WAF_HTTPTIMEOUT: 1s
          # v0.8: allow (reason "waf-unavailable") when AppSec is unreachable
          # instead of erroring every request. Replaces WAF_FAILOVERHTTP,
          # which v0.8 no longer reads.
          ENVOY_BOUNCER_WAF_FAILOPEN: true
        envFrom:
          - secretRef:
              name: envoy-bouncer-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              grpc:
                port: 8080
                service: liveness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              # Serve traffic only after the initial LAPI decision sync.
              grpc:
                port: 8080
                service: readiness
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 15m
            memory: 96Mi
          limits:
            # CPU limit intentionally unset — the bouncer sits on the request
            # path (ext_authz for every external call) and CFS throttling here
            # directly raises tail latency for the whole gateway. Requests
            # still guarantee baseline; memory limit stays for OOM safety.
            memory: 128Mi
defaultPodOptions:
  annotations:
    k8s.ksgate.org/crowdsec-lapi-deployment: |
      {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "name": "crowdsec-lapi",
        "namespace": "crowdsec",
        "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
      }
    k8s.ksgate.org/crowdsec-lapi-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "crowdsec-service",
        "namespace": "crowdsec"
      }

    k8s.ksgate.org/crowdsec-appsec-deployment: |
      {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "name": "crowdsec-appsec",
        "namespace": "crowdsec",
        "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
      }
    k8s.ksgate.org/crowdsec-appsec-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "crowdsec-appsec-service",
        "namespace": "crowdsec"
      }
  schedulingGates:
    - name: k8s.ksgate.org/crowdsec-lapi-deployment
    - name: k8s.ksgate.org/crowdsec-lapi-service
    - name: k8s.ksgate.org/crowdsec-appsec-deployment
    - name: k8s.ksgate.org/crowdsec-appsec-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    ports:
      http:
        port: 8080
      metrics:
        port: 9090
serviceMonitor:
  app:
    serviceName: envoy-bouncer
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
persistence:
  ban:
    type: configMap
    name: "envoy-bouncer-configmap"
    globalMounts:
      - path: /ban.html
        subPath: ban.html
