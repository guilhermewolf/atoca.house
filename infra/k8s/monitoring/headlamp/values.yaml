---
fullnameOverride: headlamp
config:
  oidc:
    secret:
      create: false
    # Only OIDC_CLIENT_SECRET comes from the secret (secrets.yaml); the chart
    # adds the matching -oidc-* args for each OIDC_* var found in env below.
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true
env:
  - name: OIDC_CLIENT_ID
    value: headlamp
  - name: OIDC_ISSUER_URL
    value: https://auth.atoca.house
  - name: OIDC_SCOPES
    value: openid,profile,email,groups,offline_access
  - name: OIDC_CALLBACK_URL
    value: https://headlamp.atoca.house/oidc-callback
  - name: OIDC_USE_PKCE
    value: "true"
# Users act with their own Authelia id_token; the kube-apiserver trusts
# Authelia via Talos KubeAuthenticationConfig and RBAC is in rbac.yaml.
# The pod's ServiceAccount needs no permissions.
clusterRoleBinding:
  create: false
podAnnotations:
  reloader.stakater.com/auto: "true"
service:
  port: 4466
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
