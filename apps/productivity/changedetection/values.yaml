---
values:
controllers:
  changedetection:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          tag: 0.70.3
        env:
          PORT: &port 5000
          USE_X_SETTINGS: 1
          PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/chromium?stealth=true&blockAds=true&--disable-web-security=true
          ALLOW_IANA_RESTRICTED_ADDRESSES: true
          BASE_URL: "https://changedetection.atoca.house"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 15m
            memory: 320Mi
          limits:
            memory: 1Gi
      browser:
        securityContext:
          allowPrivilegeEscalation: false
        # browserless v1 (browserless/chrome) is unmaintained; its CVE report
        # outgrew etcd's request limit and broke trivy scans. v2 moved stealth
        # and ad-blocking to PLAYWRIGHT_DRIVER_URL query params.
        image:
          repository: ghcr.io/browserless/chromium
          tag: v2.63.0@sha256:5ddf1b7f43e970b3578764a5e0f7846b0a9227f6d70d888d4f0e51072dc4279c
        env:
          - { name: TIMEOUT, value: "120000" }
          # Each session launches its own Chromium (~200-400Mi on heavy pages);
          # 10 concurrent blew the old 2Gi limit. Extra checks queue instead.
          - { name: CONCURRENT, value: "4" }
          - { name: QUEUED, value: "50" }
          # Reject new sessions when container memory > 80% instead of OOMing.
          - { name: HEALTH, value: "true" }
          - { name: MAX_MEMORY_PERCENT, value: "80" }
          - { name: MACHINE_STATS_SOURCE, value: "cgroup" }
          - { name: ENABLE_DEBUGGER, value: "false" }
          # Default logs :trace, which echoes every failed page sub-resource
          # ("error: Failed to load resource") into the hourly error alert.
          - { name: DEBUG, value: "browserless*,-**:trace,-**:verbose" }
        resources:
          requests:
            cpu: 25m
            memory: 1536Mi
          limits:
            memory: 4Gi

defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.20/24"],
        "mac": "3e:d2:65:8a:17:c9"
      }]

service:
  app:
    controller: changedetection
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - changedetection.atoca.house
    rules:
      - backendRefs:
          - name: changedetection
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /datastore

  tmp:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      changedetection:
        browser:
          - path: /tmp

  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 256Mi
    advancedMounts:
      changedetection:
        browser:
          - path: /dev/shm
