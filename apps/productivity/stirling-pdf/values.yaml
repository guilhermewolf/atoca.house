---
controllers:
  stirling-pdf:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # renovate: datasource=docker depName=ghcr.io/stirling-tools/stirling-pdf
          repository: ghcr.io/stirling-tools/stirling-pdf
          tag: 3.1.0@sha256:b5b9e400c086e5334a4947a0d7cd589808f743f29267d7f41c18200cf4bc48b4
        env:
          TZ: Europe/Amsterdam
          SERVER_PORT: &port 8080
          PUID: 1000
          PGID: 1000
          DOCKER_ENABLE_SECURITY: "false"
          INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
          LANGS: en_GB
          SYSTEM_ENABLEANALYTICS: "false"
          SYSTEM_DEFAULTLOCALE: en-GB
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/info/status
                port: *port
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 6
          readiness: *probe
        securityContext:
          allowPrivilegeEscalation: false
          # 2.x init.sh needs a writable rootfs: it symlinks the diagnostics
          # helper into /usr/local/bin under `set -e` before dropping privileges.
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
            # init.sh runs as root: chowns the mounts, then setpriv's the app
            # down to PUID/PGID. Without these it dies on "setresuid failed".
            add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            memory: 4Gi
defaultPodOptions:
  securityContext:
    # Container entrypoint must be root; it setpriv's the app down to PUID/PGID.
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - pdf.atoca.house
    rules:
      - backendRefs:
          - name: stirling-pdf
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  tmpfs:
    type: emptyDir
    advancedMounts:
      stirling-pdf:
        app:
          - path: /tmp
            subPath: tmp
          - path: /configs
            subPath: configs
          - path: /logs
            subPath: logs
          - path: /customFiles
            subPath: customFiles
          - path: /pipeline
            subPath: pipeline
          - path: /storage
            subPath: storage
