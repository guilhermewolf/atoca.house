---
controllers:
  litellm:
    strategy: Recreate
    labels:
      postgres: "true"
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/berriai/litellm-non_root
          tag: v1.97.0@sha256:e2de74cae0d1f708bebe33bf3e03c3335029e27ff7f0dbddc7ff94d0edd63614
        args: ["--config=/app/config.yaml"]
        env:
          LITELLM_LOG: INFO
          LITELLM_MODE: PRODUCTION
          REDIS_HOST: dragonfly.dragonfly-cluster.svc.cluster.local
          REDIS_PORT: 6379
          # ChatGPT subscription provider: OAuth device-flow token persisted on PVC
          CHATGPT_TOKEN_DIR: /data/chatgpt
        envFrom:
          - secretRef:
              name: litellm-secret
          - secretRef:
              name: litellm-db-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 4000
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
          readiness: *probes
          # litellm runs chatgpt provider init inside FastAPI startup (before binding
          # :4000). Give startup a long grace window so liveness can't kill it mid-init.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 60
        resources:
          requests:
            cpu: 25m
            memory: 1536Mi
          limits:
            memory: 2Gi
defaultPodOptions:
  annotations:
    k8s.ksgate.org/postgres-ready: |
      {
        "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
        "kind": "PostgresCluster",
        "name": "postgres",
        "namespace": "crunchy-postgres-cluster",
        "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
      }
    k8s.ksgate.org/postgres-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "postgres-primary",
        "namespace": "crunchy-postgres-cluster"
      }

    k8s.ksgate.org/dragonfly-ready: |
      {
        "apiVersion": "dragonflydb.io/v1alpha1",
        "kind": "Dragonfly",
        "name": "dragonfly",
        "namespace": "dragonfly-cluster",
        "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
      }
    k8s.ksgate.org/dragonfly-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "dragonfly",
        "namespace": "dragonfly-cluster"
      }

    k8s.ksgate.org/ollama-deployment: |
      {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "name": "ollama",
        "namespace": "ollama",
        "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
      }
    k8s.ksgate.org/ollama-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "ollama",
        "namespace": "ollama"
      }
  schedulingGates:
    - name: k8s.ksgate.org/postgres-ready
    - name: k8s.ksgate.org/postgres-service
    - name: k8s.ksgate.org/dragonfly-ready
    - name: k8s.ksgate.org/dragonfly-service
    - name: k8s.ksgate.org/ollama-deployment
    - name: k8s.ksgate.org/ollama-service
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - litellm.atoca.house
    rules:
      - backendRefs:
          - name: litellm
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  postgres-ca:
    type: configMap
    name: postgres-ca
    globalMounts:
      - path: /etc/ssl/postgres/ca.crt
        subPath: ca.crt
        readOnly: true
  config:
    type: configMap
    name: litellm-configmap
    globalMounts:
      - path: /app/config.yaml
        subPath: config.yaml
        readOnly: true
  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /cache
        subPath: cache
      - path: /tmp
        subPath: tmp
  chatgpt-auth:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 64Mi
    storageClass: ceph-block
    globalMounts:
      - path: /data/chatgpt
