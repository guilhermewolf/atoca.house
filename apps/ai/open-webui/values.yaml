---
controllers:
  open-webui:
    pod:
      annotations:
        reloader.stakater.com/auto: "true"
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }

        k8s.ksgate.org/dragonfly-ready: |
          {
            "apiVersion": "dragonflydb.io/v1alpha1",
            "kind": "Dragonfly",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster",
            "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
          }
        k8s.ksgate.org/dragonfly-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "dragonfly",
            "namespace": "dragonfly-cluster"
          }

        k8s.ksgate.org/ollama-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "ollama",
            "namespace": "ollama",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/ollama-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "ollama",
            "namespace": "ollama"
          }

        k8s.ksgate.org/searxng-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "searxng",
            "namespace": "searxng",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/searxng-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "searxng",
            "namespace": "searxng"
          }

        k8s.ksgate.org/qdrant-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "qdrant",
            "namespace": "qdrant",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/qdrant-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "qdrant",
            "namespace": "qdrant"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
        - name: k8s.ksgate.org/dragonfly-ready
        - name: k8s.ksgate.org/dragonfly-service
        - name: k8s.ksgate.org/ollama-deployment
        - name: k8s.ksgate.org/ollama-service
        - name: k8s.ksgate.org/searxng-deployment
        - name: k8s.ksgate.org/searxng-service
        - name: k8s.ksgate.org/qdrant-deployment
        - name: k8s.ksgate.org/qdrant-service
    containers:
      app:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: v0.11.2
        env:
          # Open-webui settings
          ENABLE_OPENAI_API: "False"
          ENABLE_OLLAMA_API: "True"
          OLLAMA_BASE_URL: http://ollama.ollama.svc.cluster.local
          ENABLE_SEARCH_QUERY_GENERATION: True
          ENABLE_WEB_SEARCH: True
          ENABLE_LOGIN_FORM: False
          DATABASE_PORT: "5432"
          DATABASE_TYPE: postgres
          WEBUI_URL: https://chat.atoca.house
          # Redis
          ENABLE_WEBSOCKET_SUPPORT: "true"
          WEBSOCKET_MANAGER: "redis"
          WEBSOCKET_REDIS_URL: "redis://dragonfly.dragonfly-cluster.svc.cluster.local:6379/5"

          # Searx
          WEB_SEARCH_ENGINE: searxng
          SEARXNG_QUERY_URL: http://searxng.searxng.svc.cluster.local:8080/search?q=<query>

          # Vector
          VECTOR_DB: qdrant
          QDRANT_URI: http://qdrant.qdrant.svc.cluster.local:6333
          # Auth
          ENABLE_OAUTH_SIGNUP: "true"
          OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
          OAUTH_PROVIDER_NAME: "Authelia"
          OPENID_PROVIDER_URL: "https://auth.atoca.house/.well-known/openid-configuration"
          OAUTH_CLIENT_ID: "open-webui"
          OAUTH_SCOPES: "openid email profile groups"
          ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
          OAUTH_ALLOWED_ROLES: "openwebui,openwebui-admin"
          OAUTH_ADMIN_ROLES: "openwebui-admin"
          OAUTH_ROLES_CLAIM: "groups"
          OAUTH_CODE_CHALLENGE_METHOD: "S256"

          # Text-to-Speech: browser-native Web Speech API (no in-cluster TTS
          # backend anymore).
          TTS_ENGINE: ""

          # Document extraction
          CONTENT_EXTRACTION_ENGINE: tika
          TIKA_SERVER_URL: http://localhost:9998
        envFrom:
          - secretRef:
              name: open-webui-secret
          - secretRef:
              name: open-webui-db-secret
        resources:
          requests:
            cpu: 10m
            memory: 1Gi
          limits:
            memory: 1Gi

      tika:
        image:
          repository: docker.io/apache/tika
          tag: 3.3.1.0-full
          pullPolicy: IfNotPresent
        ports:
          - containerPort: 9998
        resources:
          requests:
            cpu: 10m
            memory: 384Mi
service:
  app:
    ports:
      http:
        port: &port 8080

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - chat.atoca.house
    rules:
      - backendRefs:
          - name: open-webui
            port: 8080
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /app/backend/data
