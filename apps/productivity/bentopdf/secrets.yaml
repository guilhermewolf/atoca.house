---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bentopdf-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bentopdf-oidc
    creationPolicy: Owner
    template:
      data:
        # Envoy Gateway OIDC (securitypolicy.yaml) reads key "client-secret".
        # Must match the value Authelia reads from /config/secret/BENTOPDF_OAUTH_CLIENT_SECRET
        client-secret: "{{ .BENTOPDF_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
