
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.4.1@sha256:d22ddc91ec77c5b044213046e7182dc6810fbd2c3176da8de9d99aaeb6429d48
    container_name: duplicati
    network_mode: bridge
    ports:
      - "8200:8200"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=Europe/Amsterdam
      - SETTINGS_ENCRYPTION_KEY=$SETTINGS_ENCRYPTION_KEY
      - DUPLICATI__WEBSERVICE_PASSWORD=$DUPLICATI_WEBSERVICE_PASSWORD
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - /mnt/user/backups:/backups
      # read-only: backups never need to write the source; restore into /backups instead
      - /mnt/user:/source:ro
      - /mnt/blaze/appdata/duplicati:/config
    restart: unless-stopped
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/duplicati-logo.png"
