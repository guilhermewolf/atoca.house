---
defaultPodOptions:
  automountServiceAccountToken: true
  securityContext:
    # hermes-agent uses s6-overlay: the entrypoint must start as root to fix
    # /run permissions, then drops to the image's internal hermes user (uid 10000).
    # Forcing runAsNonRoot/runAsUser breaks s6 preinit, so only set fsGroup to
    # match the image user. This intentionally deviates from the repo-wide
    # readOnlyRootFilesystem/runAsNonRoot 99:100 defaults — required by this image.
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  hermes:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      annotations:
        k8s.ksgate.org/litellm-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "litellm",
            "namespace": "litellm",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/litellm-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "litellm",
            "namespace": "litellm"
          }

        k8s.ksgate.org/searxng-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "searxng",
            "namespace": "searxng",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/searxng-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "searxng",
            "namespace": "searxng"
          }

        k8s.ksgate.org/n8n-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "n8n",
            "namespace": "n8n",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/n8n-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "n8n",
            "namespace": "n8n"
          }

        k8s.ksgate.org/context7-mcp-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "context7-mcp",
            "namespace": "mcp",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/context7-mcp-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "mcp-context7-mcp-proxy",
            "namespace": "mcp"
          }

        k8s.ksgate.org/memory-mcp-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "memory-mcp",
            "namespace": "mcp",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/memory-mcp-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "mcp-memory-mcp-proxy",
            "namespace": "mcp"
          }

        k8s.ksgate.org/ha-mcp-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "ha-mcp",
            "namespace": "mcp",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/ha-mcp-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "mcp-ha-mcp-proxy",
            "namespace": "mcp"
          }
      schedulingGates:
        - name: k8s.ksgate.org/litellm-deployment
        - name: k8s.ksgate.org/litellm-service
        - name: k8s.ksgate.org/searxng-deployment
        - name: k8s.ksgate.org/searxng-service
        - name: k8s.ksgate.org/n8n-deployment
        - name: k8s.ksgate.org/n8n-service
        - name: k8s.ksgate.org/context7-mcp-deployment
        - name: k8s.ksgate.org/context7-mcp-service
        - name: k8s.ksgate.org/memory-mcp-deployment
        - name: k8s.ksgate.org/memory-mcp-service
        - name: k8s.ksgate.org/ha-mcp-deployment
        - name: k8s.ksgate.org/ha-mcp-service

    initContainers:
      # Seed the writable data volume with the read-only ConfigMap and create the
      # agent workspace. chown to the image's hermes user (10000) so the gateway
      # can read/rewrite its own config on start.
      #
      # Hermes' own markdown (SOUL.md, MEMORY.md, skills/) is NOT managed here:
      # it lives on the PVC only, and is preserved by the volume's backup.
      copy-config:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            mkdir -p /opt/data/workspace
            cp /tmp/config.yaml /opt/data/config.yaml
            chown 10000:10000 /opt/data/config.yaml

      copy-kubectl:
        image:
          repository: docker.io/alpine/k8s
          tag: "1.37.0"
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            mkdir -p /opt/data/bin
            cp /usr/bin/kubectl /opt/data/bin/kubectl
            chown -R 10000:10000 /opt/data/bin

      # Keep a real git checkout of this repo on the PVC. hermes works in it
      # directly (branch/commit/rebase/push) — the GitHub MCP server only opens
      # and reads PRs. Every pod start re-syncs main from origin so the agent
      # never starts from a stale tree; in-flight feature branches are left
      # alone (fetch only) so nothing uncommitted is destroyed.
      #
      # Clone is anonymous (public repo). Pushes authenticate at runtime via the
      # credential helper written below, which reads $GITHUB_TOKEN from the
      # container env — the PAT is never written to the volume.
      clone-repo:
        image:
          repository: docker.io/alpine/git
          tag: "2.54.0"
        command:
          - sh
          - -c
          - |
            set -eu
            REPO=https://github.com/guilhermewolf/atoca.house.git
            DIR=/opt/data/workspace/atoca.house
            mkdir -p /opt/data/workspace
            # This init container runs as root while the checkout is owned by
            # uid 10000, so git refuses it as "dubious ownership" unless it
            # reads the same global config the app container uses.
            export HOME=/opt/data
            export GIT_CONFIG_GLOBAL=/opt/data/.gitconfig

            cat > /opt/data/.gitconfig <<'EOF'
            [user]
            	name = Hermes
            	email = hermes@atoca.house
            [init]
            	defaultBranch = main
            [safe]
            	directory = /opt/data/workspace/atoca.house
            [pull]
            	rebase = true
            [rebase]
            	autoStash = true
            [fetch]
            	prune = true
            [push]
            	default = current
            [credential "https://github.com"]
            	helper = "!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f"
            EOF
            chown 10000:10000 /opt/data/.gitconfig

            if [ ! -d "$DIR/.git" ]; then
              git clone "$REPO" "$DIR"
            fi

            cd "$DIR"
            git remote set-url origin "$REPO"
            git fetch origin --prune --tags || echo "WARN: fetch failed, using local state"
            # Only fast-forward the checkout when it is on a clean main. A dirty
            # tree or a feature branch is the agent's in-flight work — leave it.
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            if [ "$BRANCH" = "main" ] && [ -z "$(git status --porcelain)" ]; then
              git reset --hard origin/main
            else
              echo "INFO: on '$BRANCH' (dirty=$([ -n "$(git status --porcelain)" ] && echo yes || echo no)) — fetched only"
            fi
            # Prune local branches whose upstream is gone (merged PRs).
            git for-each-ref --format='%(refname:short) %(upstream:track)' refs/heads \
              | awk '$2 == "[gone]" {print $1}' \
              | while read -r b; do
                  [ "$b" = "$BRANCH" ] || git branch -D "$b" || true
                done
            chown -R 10000:10000 /opt/data/workspace

    containers:
      app:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
        args:
          - gateway
          - run
        env:
          TZ: Europe/Amsterdam
          HOME: /opt/data
          HERMES_HOME: /opt/data
          # Gateway HTTP API (programmatic access, e.g. from Open WebUI)
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: &apiPort "8642"
          # Web dashboard. Runs under s6 in this same container so it can manage
          # the gateway via the local service tree. Gated by the basic-auth
          # username/password provider (creds in secrets.yaml) since it's
          # bound to 0.0.0.0. --insecure must stay unset: combining it with
          # basic_auth breaks the health/startup probe (unauthenticated
          # /health gets redirected into the OAuth-only /auth/login route,
          # which 500s for a password-only provider).
          HERMES_DASHBOARD: "1"
          HERMES_DASHBOARD_HOST: 0.0.0.0
          HERMES_DASHBOARD_PORT: &dashPort "9119"
          # Web search backend (in-cluster SearXNG)
          SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
          # Discord gateway creds + allowlist + channel come from hermes-secret
          # (envFrom below): DISCORD_BOT_TOKEN, DISCORD_ALLOWED_USERS,
          # DISCORD_FREE_RESPONSE_CHANNELS. Kept out of git on purpose.
        envFrom:
          - secretRef:
              name: hermes-secret
        securityContext:
          # Do NOT drop capabilities or force runAsNonRoot: s6-overlay init needs
          # CAP_CHOWN/SETUID/SETGID to fix /run and drop to uid 10000. The image
          # also writes to its root fs, so readOnlyRootFilesystem must stay false.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                # /health redirects through the dashboard auth gate and 500s
                # once basic_auth creds are set (BasicAuthProvider has no
                # OAuth start_login). /api/status is documented as always
                # public regardless of the gate — use that instead.
                path: /api/status
                port: 9119
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/status
                port: 9119
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            # 500m: local faster-whisper transcription of Discord voice
            # messages runs on CPU in this pod.
            cpu: 75m
            memory: 1Gi
          limits:
            memory: 4Gi

service:
  app:
    controller: hermes
    ports:
      http:
        port: *dashPort
      api:
        port: *apiPort

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - hermes.atoca.house
    rules:
      # Workaround for upstream bug (hermes-agent v2026.7.1): with exactly one
      # auth provider registered, _auto_sso_response 302s unauthenticated page
      # loads to /auth/login?provider=basic — the OAuth-initiation route — but
      # BasicAuthProvider has no start_login, so it 500s. Redirect that route
      # back to the /login password form at the gateway. Safe here: basic is
      # the only provider, so no real OAuth flow can ever hit /auth/login.
      - matches:
          - path:
              type: Exact
              value: /auth/login
        filters:
          - type: RequestRedirect
            requestRedirect:
              path:
                type: ReplaceFullPath
                replaceFullPath: /login
              statusCode: 302
      - filters:
          # The dashboard pins its CORS/origin allow-list to localhost, so the
          # WebSocket handshake (Origin: https://hermes.atoca.house) is rejected
          # with 403. Rewrite Origin to an allowed value — browsers don't enforce
          # CORS on the WS upgrade, so this only satisfies the server-side check.
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: Origin
                  value: http://localhost:9119
        backendRefs:
          - name: hermes
            port: 9119
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /opt/data
  config:
    type: configMap
    name: hermes-config
    defaultMode: 0755
    globalMounts:
      - path: /tmp/config.yaml
        subPath: config.yaml

serviceAccount:
  hermes: {}

# Broad read-only cluster access so the agent can introspect the homelab.
# Secrets are intentionally excluded.
rbac:
  roles:
    hermes-read-all:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources:
            [
              "pods",
              "pods/log",
              "nodes",
              "services",
              "namespaces",
              "configmaps",
              "persistentvolumes",
              "persistentvolumeclaims",
              "endpoints",
              "resourcequotas",
              "limitranges",
              "serviceaccounts",
              "events",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            [
              "deployments",
              "daemonsets",
              "statefulsets",
              "replicasets",
              "controllerrevisions",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses", "ingressclasses", "networkpolicies"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["gateways", "httproutes", "grpcroutes", "referencegrants"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources:
            ["storageclasses", "csinodes", "csidrivers", "volumeattachments"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources:
            ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes", "pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["argoproj.io"]
          resources: ["applications", "applicationsets", "appprojects"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["external-secrets.io"]
          resources: ["externalsecrets", "secretstores", "clustersecretstores"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["volsync.backube"]
          resources: ["replicationsources", "replicationdestinations"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources:
            [
              "prometheuses",
              "alertmanagers",
              "servicemonitors",
              "podmonitors",
              "prometheusrules",
              "thanosrulers",
              "probes",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources:
            [
              "volumesnapshots",
              "volumesnapshotcontents",
              "volumesnapshotclasses",
            ]
          verbs: ["get", "list", "watch"]
  bindings:
    hermes-read-all:
      type: ClusterRoleBinding
      roleRef:
        identifier: hermes-read-all
      subjects:
        - identifier: hermes
          serviceAccount: hermes
