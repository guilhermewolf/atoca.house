---
controllers:
  vidya:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # Fork with in-app OIDC, built by vidya-self's Forgejo Actions workflow.
          # Not Renovate-managed: the private registry has no host rule here.
          repository: forge.atoca.house/guilherme/vidya-self
          tag: 3882831@sha256:acad0d3a67648b27079958f6de16c7b6b7a9029e9ea8167b4800745d2250cc80
        env:
          VIDYA_DATA_PATH: /data
          PORT: &port 31415
          TMPDIR: /tmp
          # In-app SSO via Authelia client vidya-app; the gateway OIDC in
          # securitypolicy.yaml (client vidya) still gates the whole route.
          OIDC_ISSUER_URL: https://auth.atoca.house
          OIDC_CLIENT_ID: vidya-app
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: vidya-oidc
                key: OIDC_CLIENT_SECRET
          OIDC_REDIRECT_URI: https://vidya.atoca.house/api/auth/oidc/callback
          OIDC_SCOPES: openid profile email groups
          OIDC_ADMIN_GROUP: admins
          OIDC_BUTTON_LABEL: Log in with Authelia
          OIDC_AUTO_CREATE: "true"
          OIDC_DISABLE_LOCAL_LOGIN: "false"
          # Browser-incompatible videos (e.g. Xvid/MPEG-4 Part 2) are converted
          # once to H.264 here; lives on the NAS, the config PVC is only 2Gi.
          VIDYA_TRANSCODE_PATH: /nas/transcodes/vidya
          VIDYA_TRANSCODE_THREADS: "4"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 2Gi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  imagePullSecrets:
    - name: forgejo-registry
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - vidya.atoca.house
    rules:
      - backendRefs:
          - name: vidya
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

  # key "config" keeps PVC name = "vidya", matching backup.yaml/restore.yaml (same as kavita)
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /data

  # whole media share read-only; add course folders (e.g. /media/masterclass) in Vidya's admin UI
  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/media/
    globalMounts:
      - path: /media
        readOnly: true

  # writable export root, only for the transcode cache (VIDYA_TRANSCODE_PATH)
  nas:
    type: nfs
    server: nas.internal
    path: /mnt/user/data
    globalMounts:
      - path: /nas
