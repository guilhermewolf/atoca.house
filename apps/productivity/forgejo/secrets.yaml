---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-secret
    template:
      engineVersion: v2
      data:
        # App secrets — generate with `forgejo generate secret SECRET_KEY` etc.
        FORGEJO__security__SECRET_KEY: "{{ .FORGEJO_SECRET_KEY }}"
        FORGEJO__security__INTERNAL_TOKEN: "{{ .FORGEJO_INTERNAL_TOKEN }}"
        FORGEJO__oauth2__JWT_SECRET: "{{ .FORGEJO_JWT_SECRET }}"
        # Garage S3 credentials for the `forgejo` bucket
        FORGEJO__storage__MINIO_ACCESS_KEY_ID: "{{ .FORGEJO_S3_ACCESS_KEY_ID }}"
        FORGEJO__storage__MINIO_SECRET_ACCESS_KEY: "{{ .FORGEJO_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: forgejo-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres-cluster-store
  target:
    name: forgejo-db-secret
    template:
      engineVersion: v2
      data:
        FORGEJO__database__HOST: '{{ index . "host" }}:{{ index . "port" }}'
        FORGEJO__database__NAME: '{{ index . "dbname" }}'
        FORGEJO__database__USER: '{{ index . "user" }}'
        FORGEJO__database__PASSWD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: postgres-pguser-forgejo
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-r2-secret
  namespace: forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .RESTIC_REPOSITORY }}/forgejo"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-r2
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
