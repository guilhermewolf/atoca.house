controllers:
  lldap:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      lldap:
        image:
          repository: ghcr.io/lldap/lldap
          tag: v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
        env:
          LLDAP_HTTP_PORT: &port 80
          LLDAP_HTTP_URL: https://lldap.atoca.house
          LLDAP_LDAP_PORT: &ldapPort 389
        envFrom:
          - secretRef:
              name: lldap-db-secret
          - secretRef:
              name: lldap-secret
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128M
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lldap
      annotations:
        k8s.ksgate.org/postgres-ready: |
          {
            "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
            "kind": "PostgresCluster",
            "name": "postgres",
            "namespace": "crunchy-postgres-cluster",
            "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
          }
        k8s.ksgate.org/postgres-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "postgres-pgbouncer",
            "namespace": "crunchy-postgres-cluster"
          }
      schedulingGates:
        - name: k8s.ksgate.org/postgres-ready
        - name: k8s.ksgate.org/postgres-service
service:
  lldap:
    controller: lldap
    ports:
      http:
        port: *port
        primary: true
      ldap:
        port: *ldapPort
route:
  lldap:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - lldap.atoca.house
    rules:
      - backendRefs:
          - name: lldap
            port: 80
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  data:
    type: emptyDir
  tmp:
    type: emptyDir
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }
