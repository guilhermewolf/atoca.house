---
# ApplicationSet for productivity applications
# Discovers apps from app-config.yaml files in subdirectories
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-productivity
  annotations:
    argocd-diff-preview/watch-pattern: 'apps/productivity/.*'
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/guilhermewolf/atoca.house
        revision: HEAD
        files:
          - path: "apps/productivity/*/app-config.yaml"

  template:
    metadata:
      name: '{{.app.name}}'
      annotations:
        argocd-diff-preview/watch-pattern: 'apps/productivity/{{.app.name}}/.*'
      namespace: argocd
    spec:
      project: applications
      destination:
        namespace: '{{.app.namespace}}'
        server: https://kubernetes.default.svc

      sources:
        # Helm chart source
        - chart: '{{.app.chart}}'
          repoURL: '{{.app.chartRepo}}'
          targetRevision: '{{.app.chartVersion}}'
          helm:
            releaseName: '{{.app.name}}'
            valueFiles:
              - $values/apps/productivity/{{.app.name}}/values.yaml

        # Values repository reference
        - repoURL: https://github.com/guilhermewolf/atoca.house
          targetRevision: HEAD
          ref: values

        # Additional resources (secrets, configs, etc.)
        - repoURL: https://github.com/guilhermewolf/atoca.house
          targetRevision: HEAD
          path: 'apps/productivity/{{.app.name}}'
          directory:
            exclude: '{application.yaml,values.yaml,app-config.yaml}'

      syncPolicy:
        # Surface Pod Security "restricted" violations (kubectl warnings + audit
        # log) without blocking anything; enforce stays at the cluster default.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
