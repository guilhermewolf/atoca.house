---
# 1Password items:
#   authelia    -> MCP_GATEWAY_OAUTH_CLIENT_SECRET (same item Authelia reads)
#   mcp-gateway -> everything else
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mcp-gateway-secret
    creationPolicy: Owner
    template:
      data:
        AUTHELIA_CLIENT_SECRET: "{{ .MCP_GATEWAY_OAUTH_CLIENT_SECRET }}"
        SIGNING_KEY: "{{ .MCP_GATEWAY_SIGNING_KEY }}"
        HMAC_SECRET: "{{ .MCP_GATEWAY_HMAC_SECRET }}"
        OUTLINE_OAUTH_CLIENT_SECRET: "{{ .OUTLINE_OAUTH_CLIENT_SECRET }}"
        N8N_AUTHORIZATION: "Bearer {{ .N8N_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: mcp-gateway
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - extract:
        key: authelia
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
