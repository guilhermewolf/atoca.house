---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapotter-secret
  namespace: snapotter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: snapotter-secret
    template:
      data:
        # Seeds the initial admin account on first boot only.
        DEFAULT_USERNAME: "{{ .DEFAULT_USERNAME }}"
        DEFAULT_PASSWORD: "{{ .DEFAULT_PASSWORD }}"
  dataFrom:
    - extract:
        key: snapotter-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapotter-db-secret
  namespace: snapotter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres-cluster-store
  target:
    name: snapotter-db-secret
    template:
      data:
        # TLS verified against the cert-manager CA mounted at
        # /etc/ssl/postgres/ca.crt and trusted via NODE_EXTRA_CA_CERTS
        # (values.yaml). `host` is postgres-primary.<ns>.svc, which the
        # postgres-tls cert covers, so verify-full holds.
        DATABASE_URL: 'postgres://{{ index . "user" }}:{{ index . "password" }}@{{ index . "host" }}:{{ index . "port" | toString }}/{{ index . "dbname" }}?sslmode=verify-full'
  dataFrom:
    - extract:
        key: postgres-pguser-snapotter
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
