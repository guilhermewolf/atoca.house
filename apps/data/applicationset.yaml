---
# ApplicationSet for data applications
# Discovers apps from app-config.yaml files in subdirectories
# Note: Data apps use raw Kubernetes manifests, not Helm charts
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-data
  annotations:
    argocd-diff-preview/watch-pattern: 'apps/data/.*'
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/guilhermewolf/atoca.house
        revision: HEAD
        files:
          - path: "apps/data/*/app-config.yaml"

  template:
    metadata:
      name: '{{.app.name}}'
      annotations:
        argocd-diff-preview/watch-pattern: 'apps/data/{{.app.name}}/.*'
      namespace: argocd
    spec:
      project: applications
      destination:
        namespace: '{{.app.namespace}}'
        server: https://kubernetes.default.svc

      source:
        repoURL: https://github.com/guilhermewolf/atoca.house
        targetRevision: HEAD
        path: 'apps/data/{{.app.name}}'
        kustomize: {}

      syncPolicy:
        # Surface Pod Security "restricted" violations (kubectl warnings + audit
        # log) without blocking anything; enforce stays at the cluster default.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  templatePatch: |
    {{- if dig "app" "useVaultPlugin" false . }}
    spec:
      source:
        repoURL: https://github.com/guilhermewolf/atoca.house
        targetRevision: HEAD
        path: 'apps/data/{{.app.name}}'
        plugin:
          name: argocd-vault-plugin
    {{- end }}
