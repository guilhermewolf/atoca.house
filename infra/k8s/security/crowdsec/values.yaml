---
container_runtime: containerd
config:
  parsers:
    s01-parse:
      envoy-logs.yaml: |-
        # Exact match on 'envoy' so the cilium acquisition (program: cilium)
        # does not accidentally get parsed here.
        filter: "evt.Parsed.program == 'envoy' && evt.Parsed.message contains ':authority'"
        onsuccess: next_stage
        name: hydaz/envoy-logs
        description: "Parse Envoy access logs to match nginx parser outputs"
        statics:
          - parsed: json
            expression: UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "envoy")
          - parsed: time_local
            expression: evt.Unmarshaled.envoy["start_time"]
          # Client IP as resolved by Envoy (ClientTrafficPolicy trustedCIDRs),
          # with the port stripped; handles "[v6]:port". Do NOT use the
          # leftmost x-forwarded-for entry: Cloudflare appends to whatever XFF
          # the client sends, so XFF[0] is attacker-controlled.
          - parsed: remote_addr
            expression: Trim(Join(Split(string(evt.Unmarshaled.envoy["downstream_remote_address"]), ":")[:-1], ":"), "[]")
          - parsed: verb
            expression: evt.Unmarshaled.envoy["method"]
          - parsed: request
            expression: evt.Unmarshaled.envoy["x-envoy-origin-path"]
          - parsed: http_version
            expression: TrimPrefix(evt.Unmarshaled.envoy["protocol"], "HTTP/")
          - parsed: status
            expression: Sprintf('%.0f', evt.Unmarshaled.envoy["response_code"])
          - parsed: body_bytes_sent
            expression: Sprintf('%.0f', evt.Unmarshaled.envoy["bytes_sent"])
          - parsed: http_user_agent
            expression: evt.Unmarshaled.envoy["user-agent"]
          - parsed: target_fqdn
            expression: evt.Unmarshaled.envoy[":authority"]
          - meta: service
            value: http
          - meta: log_type
            value: http_access-log
          - meta: source_ip
            expression: evt.Parsed.remote_addr
          - meta: http_status
            expression: evt.Parsed.status
          - meta: http_path
            expression: evt.Parsed.request
          - meta: http_verb
            expression: evt.Parsed.verb
          - meta: http_user_agent
            expression: evt.Parsed.http_user_agent
          - meta: target_fqdn
            expression: evt.Parsed.target_fqdn
      seerr-logs.yaml: |-
        onsuccess: next_stage
        filter: "evt.Parsed.program == 'jellyseerr'"
        name: hydaz/seerr-logs
        description: "Parse seerr (jellyseerr) failed sign-in attempts"
        pattern_syntax:
          SEERR_USER: "(%{EMAILADDRESS}|%{USERNAME})"
        nodes:
          - grok:
              pattern: '%{RFC3339:timestamp}.*Failed (sign-in|login) attempt from user with incorrect.*credentials \{"account":\{"ip":"(::ffff:)?%{IP:source_ip}","email":"%{SEERR_USER:username}"'
              apply_on: message
              statics:
                - meta: log_type
                  value: jellyseerr_failed_auth
          - grok:
              pattern: '%{RFC3339:timestamp}.*Failed (sign-in|login) attempt using invalid .* password.*\{"ip":"(::ffff:)?%{IP:source_ip}","email":"%{SEERR_USER:username}"'
              apply_on: message
              statics:
                - meta: log_type
                  value: jellyseerr_failed_auth
        statics:
          - meta: service
            value: jellyseerr
          - meta: source_ip
            expression: "evt.Parsed.source_ip"
          - meta: user
            expression: "evt.Parsed.username"
          - target: evt.StrTime
            expression: evt.Parsed.timestamp
    s02-enrich:
      envoy-418-whitelist.yaml: |-
        name: hydaz/envoy-418-whitelist
        description: "Whitelist 418 responses from the envoy bouncer to prevent processing already banned IPs"
        filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
        whitelist:
          reason: "envoy bouncer response to already banned ips"
          expression:
            - "evt.Meta.http_status == '418'"
      gatus-prober-whitelist.yaml: |-
        name: hydaz/gatus-prober-whitelist
        description: "Whitelist the in-cluster Gatus prober; it hairpins out through the tunnel so it shares the home WAN IP and trips http-crawl-non_statics"
        filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
        whitelist:
          reason: "gatus uptime prober"
          expression:
            # UA alone is spoofable; also require the home WAN IP the prober
            # hairpins out of. ponytail: hardcoded WAN IP, update if the ISP
            # changes it (Gatus would then start getting banned for crawling).
            - "evt.Meta.http_user_agent startsWith 'Gatus/' && evt.Meta.source_ip == '62.250.115.189'"
  postoverflows:
    s01-whitelist:
      spa-crawl-whitelist.yaml: |-
        name: hydaz/spa-crawl-whitelist
        description: "Whitelist http-crawl-non_statics on the SPA frontends"
        filter: "evt.Overflow.Alert.Scenario == 'crowdsecurity/http-crawl-non_statics'"
        whitelist:
          reason: "jellyfin/seerr web client legitimate API burst"
          expression:
            - "evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') in ['jellyfin.atoca.house', 'seerr.atoca.house']"
  config.yaml.local: |-
    api:
      server:
        auto_registration:
          enabled: true
          token: "${REGISTRATION_TOKEN}"
          allowed_ranges:
            - "127.0.0.1/32"
            - "10.244.0.0/16"
    db_config:
      type: postgresql
      host: "${DB_HOST}"
      port: 5432
      user: "${DB_USERNAME}"
      password: "${DB_PASSWORD}"
      db_name: "${DB_NAME}"
      sslmode: verify-full
      ssl_ca_cert: /etc/postgres-ca/ca.crt
      # Agent/appsec pods auto-register a machine per pod name; drop the ones
      # that stop logging in so they don't pile up as stale LPs in the Console.
      flush:
        agents_autodelete:
          login_password: 60m
  agent_config.yaml.local: |-
    api:
      client:
        unregister_on_exit: false
  appsec_config.yaml.local: |-
    api:
      client:
        unregister_on_exit: false
  profiles.yaml: |-
    # AppSec/WAF hits: short first ban (30m) since CRS and virtual-patching
    # can false-positive on SPAs and API clients, escalating by 30m for every
    # prior decision on the IP so repeat scanners don't return every few
    # minutes. GetDecisionsCount counts decisions still in the DB.
    name: appsec_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() contains "appsec"
    decisions:
      - type: ban
        duration: 30m
    duration_expr: Sprintf('%dm', (GetDecisionsCount(Alert.GetValue()) + 1) * 30)
    on_success: break
    ---
    # Default IP ban for all other scenarios: 24h (CrowdSec recommended
    # default), +24h for every prior decision on the IP.
    name: default_ip_remediation
    debug: false
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 24h
    duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 24)
    on_success: break
secrets:
  externalSecret:
    name: crowdsec-lapi-secrets
lapi:
  extraVolumes:
    - name: postgres-ca
      configMap:
        name: postgres-ca
  extraVolumeMounts:
    - name: postgres-ca
      mountPath: /etc/postgres-ca
      readOnly: true
  # Requests sized from 7d Prometheus data (p99 mem 43Mi, p95 cpu 6m). Chart
  # defaults request 500m/500Mi. Limits left at chart defaults.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Console enrollment is NOT done on startup: the chart's start script runs
  # `cscli console enroll` under `set -e`, so any CAPI 403 (free-tier 1h ban
  # on login bursts) crashloops LAPI, which keeps the ban alive. The engine
  # was enrolled once; enrollment is tied to the CAPI machine whose creds
  # live in the crowdsec-capi-credentials Secret. To re-enroll, run
  # `cscli console enroll --name cluster <key>` in the LAPI pod.
  storeCAPICredentialsInSecret: true
  # Stable `lapi-cscli` machine instead of a new random one per pod restart.
  storeLAPICscliCredentialsInSecret: true
  envFrom:
    - secretRef:
        name: crowdsec-secrets
    - secretRef:
        name: crowdsec-db-secrets
  persistentVolume:
    data:
      enabled: false
    config:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
agent:
  # DaemonSet: requests count on every node. 7d p99 mem 107Mi, p95 cpu 15m.
  # Chart defaults request 500m/250Mi. Limits left at chart defaults.
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  acquisition:
    # Envoy Gateway access logs (both external and internal). This is the
    # primary signal source — the `hydaz/envoy-logs` custom parser turns the
    # envoy JSON access-log format into nginx-compatible fields.
    - namespace: kube-system
      podName: atoca-house-*
      program: envoy
      poll_without_inotify: true
    # Cilium agent runs as a DaemonSet on every node and writes several
    # thousand lines per day (health checks, policy updates). We don't have
    # a parser for it, so lines are silently dropped at s01-parse — but the
    # `lines_read` counter still increments, which is what the CrowdSec
    # Console checks to decide whether an agent is healthy. Without this,
    # agents scheduled on nodes that happen to host neither an atoca-house
    # nor an authelia pod would trigger false "Log Processor: no logs read"
    # alerts. Pattern matches both `cilium-*` (agent) and `cilium-envoy-*`.
    # The `envoy-logs` parser uses an exact program match (`== 'envoy'`)
    # so it will not try to parse these lines.
    - namespace: kube-system
      podName: cilium-*
      program: cilium
      poll_without_inotify: true
    # Authelia access/auth logs for brute-force detection.
    - namespace: authelia
      podName: authelia-*
      program: authelia
      poll_without_inotify: true
    # Jellyfin auth logs. jellyfin.atoca.house is on the external Gateway
    # and Jellyfin has no 2FA, so the login endpoint is the exposed surface.
    # Authentication is delegated to LLDAP, but that is transparent here:
    # the LDAP plugin rejects the bind and Jellyfin's own UserManager still
    # emits `Authentication request for <user> has been denied (IP: <ip>)`,
    # which is the line `LePresidente/jellyfin-logs` greps for. Verified
    # against 10.11.11. The IP in that line is the real client (Jellyfin
    # `KnownProxies: 10.244.0.0/16` + the Gateway's xForwardedFor
    # trustedCIDRs), so bans land on the attacker, not on Envoy.
    - namespace: jellyfin
      podName: jellyfin-*
      program: jellyfin
      poll_without_inotify: true
    # Seerr auth logs. seerr.atoca.house is on the external Gateway and its
    # /api/v1/auth/jellyfin endpoint proxies straight through to Jellyfin,
    # so it is a second front door onto the same LLDAP directory. `program`
    # is `jellyseerr`, not `seerr`, because that is what the hub parser and
    # scenarios filter on.
    - namespace: seerr
      podName: seerr-*
      program: jellyseerr
      poll_without_inotify: true
    # Filebrowser auth logs, for MrShippeR/filebrowser (filebrowser-bf). The
    # collection was installed but nothing fed it.
    - namespace: filebrowser
      podName: filebrowser-*
      program: filebrowser
      poll_without_inotify: true
  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-cve
        LePresidente/authelia
        LePresidente/jellyfin
        LePresidente/jellyseerr
        MrShippeR/filebrowser
    - name: PARSERS
      value: crowdsecurity/cri-logs
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
appsec:
  enabled: true
  # 7d p99 mem 44Mi, p95 cpu 11m. Chart defaults request 500m/250Mi.
  # Limits left at chart defaults.
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
  podAnnotations:
    reloader.stakater.com/auto: "true"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      # appsec-default = vpatch + generic rules (in-band, blocking).
      # crowdsecurity/crs deliberately NOT enabled: its out-of-band config
      # SendAlert()s on every rule match, and CRS setup rule 901340 ("Enabling
      # body inspection") matches nearly every request with a body. With the
      # bouncer on both gateways that was ~800 alerts/h from LAN/internal
      # traffic (forge runner, argocd, ...), pinning the 5000-alert DB cap.
      # Re-enable only with a custom appsec-config that alerts on 949110
      # (anomaly threshold exceeded) alone.
      appsec_configs:
        - crowdsecurity/appsec-default
      labels:
        type: appsec
  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-crs
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
