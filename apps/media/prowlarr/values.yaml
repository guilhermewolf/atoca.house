controllers:
  prowlarr:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      prowlarr:
        image:
          repository: ghcr.io/home-operations/prowlarr
          tag: 3.0.0@sha256:262f02fc00831fa8ab26555e82a71d3d7b32ec220af6ce9cff6b53048eadddd5
          pullPolicy: IfNotPresent
        env:
          PROWLARR__APP__INSTANCENAME: Prowlarr
          PROWLARR__APP__THEME: dark
          PROWLARR__AUTH__METHOD: External
          PROWLARR__AUTH__REQUIRED: Enabled
          PROWLARR__LOG__DBENABLED: "False"
          PROWLARR__LOG__LEVEL: info
          PROWLARR__SERVER__PORT: &port 80
          PROWLARR__UPDATE__BRANCH: develop
        envFrom:
          - secretRef:
              name: "prowlarr-secret"
        probes:
          liveness:
            enabled: true
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: *port
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 1Gi
      exportarr:
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
        args: ["prowlarr"]
        env:
          PORT: &metricsPort 9707
          URL: http://localhost:80
          APIKEY:
            valueFrom:
              secretKeyRef:
                name: prowlarr-secret
                key: PROWLARR__AUTH__APIKEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.13/24"],
        "mac": "36:5c:a2:9d:4f:81"
      }]
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  prowlarr:
    controller: prowlarr
    ports:
      http:
        port: *port
      metrics:
        port: *metricsPort

serviceMonitor:
  prowlarr:
    endpoints:
      - port: metrics

route:
  prowlarr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - prowlarr.atoca.house
    rules:
      - backendRefs:
          - name: prowlarr
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  prowlarr:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /config
