controllers:
  qbittorrent:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      qbittorrent:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
        env:
          QBT_WEBUI_PORT: &port 80
          QBT_TORRENTING_PORT: &torrentPort 36300
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v2/app/version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 500m
            memory: 1280Mi
          limits:
            memory: 4Gi
      exporter:
        image:
          repository: ghcr.io/martabal/qbittorrent-exporter
          tag: v2.0.4@sha256:9289fc5ad5cef7af6af5af5ab5ed7b8d609827490ba374df858905d66da7ec5f
        env:
          # No credentials: qBittorrent's LocalHostAuth=false lets the sidecar in via localhost.
          QBITTORRENT_BASE_URL: http://localhost:80
          # qBittorrent >= 5.2 names the session cookie QBT_SID_<webui port>.
          QBITTORRENT_COOKIE_NAME: QBT_SID_80
          EXPORTER_PORT: &metricsPort 8090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.10/24"],
        "mac": "32:0b:d8:1f:b6:e4"
      }]
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  qbittorrent:
    controller: qbittorrent
    ports:
      http:
        port: *port
      metrics:
        port: *metricsPort

serviceMonitor:
  qbittorrent:
    endpoints:
      - port: metrics

route:
  qbittorrent:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - qbittorrent.atoca.house
    rules:
      - backendRefs:
          - name: qbittorrent
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /config/

  tmp:
    type: emptyDir

  media:
    type: nfs
    server: nas.internal
    path: /mnt/user/data/
    globalMounts:
      - path: /data
