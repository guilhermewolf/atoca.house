---
# Family-facing dashboard — home.atoca.house
# The sysadmin dashboard is a separate release: apps/productivity/glance-ops
controllers:
  glance:
    annotations:
      reloader.stakater.com/auto: "true"

    containers:
      glance:
        image:
          repository: glanceapp/glance
          tag: v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
        env:
          TZ: Europe/Amsterdam
          # --- Home Assistant --------------------------------------------
          HASS_URL: https://hass.atoca.house
          # --- Jellyfin ----------------------------------------------------
          JELLYFIN_URL: https://jellyfin.atoca.house
          # Shared/kiosk account — the "latest" widgets need a user-name, and
          # this keeps the family dashboard off anyone's personal account.
          JELLYFIN_USER: kiosk
          # --- Seerr (Overseerr-compatible API) ---------------------------
          OVERSEERR_URL: https://seerr.atoca.house
          # --- YouTube embed via a public RSS-Bridge instance -------------
          RSS_BRIDGE: https://rss-bridge.org/bridge01/
          YOUTUBE_CHANNEL: Kurzgesagt
        envFrom:
          - secretRef:
              name: glance
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

defaultPodOptions:
  # No cluster API access needed on the family dashboard.
  automountServiceAccountToken: false

service:
  glance:
    controller: glance
    ports:
      http:
        port: &port 80

route:
  glance:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - home.atoca.house
    rules:
      - backendRefs:
          - name: glance
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  config:
    type: configMap
    name: glance
    # Mounted as a directory so glance.yml can `$include:` the sibling widget
    # files (w-*.yml, gatus.yml) that live in the same ConfigMap.
    globalMounts:
      - path: /app/config
        readOnly: true
