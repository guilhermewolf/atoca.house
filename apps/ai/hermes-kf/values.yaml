---
defaultPodOptions:
  automountServiceAccountToken: false  # no RBAC/kubectl in this instance
  enableServiceLinks: false
  # agent.restart_drain_timeout is 60s; the k8s default 30s grace SIGKILLed the
  # gateway mid-drain. 120s covers the drain plus s6 service teardown.
  terminationGracePeriodSeconds: 120
  securityContext:
    # hermes-kf-agent uses s6-overlay: the entrypoint must start as root to fix
    # /run permissions, then drops to the image's internal hermes-kf user (uid 10000).
    # Forcing runAsNonRoot/runAsUser breaks s6 preinit, so only set fsGroup to
    # match the image user. This intentionally deviates from the repo-wide
    # readOnlyRootFilesystem/runAsNonRoot 99:100 defaults — required by this image.
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  hermes-kf:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      # Only LiteLLM gates scheduling: every model call goes through it. MCP
      # servers are optional at runtime (hermes reconnects), so they no longer
      # block the pod.
      annotations:
        k8s.ksgate.org/litellm-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "litellm",
            "namespace": "litellm",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/litellm-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "litellm",
            "namespace": "litellm"
          }
      schedulingGates:
        - name: k8s.ksgate.org/litellm-deployment
        - name: k8s.ksgate.org/litellm-service

    initContainers:
      # Seed config.yaml from git on every start (git is its source of truth).
      # Persona, memories and skills are NOT in git (private IDs; the repo is
      # public): they live only on this PVC, protected by Volsync, pushed from
      # a local private folder with its sync.sh (see the Outline runbook).
      copy-config:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        envFrom:
          - secretRef:
              name: hermes-kf-secret
        command:
          - sh
          - -c
          - |
            set -eu
            mkdir -p /opt/data/workspace
            cp /seed/config/config.yaml /opt/data/config.yaml
            # ${GROUP_ID} substituted here, before hermes reads the file.
            sed -i "s/\${GROUP_ID}/${GROUP_ID}/g" /opt/data/config.yaml
            chown -R 10000:10000 /opt/data/config.yaml /opt/data/workspace

      # Postiz analytics has no MCP tool (only scheduling does) and ask_postiz
      # requires an OpenAI key we don't want to give Postiz. The `postiz` CLI
      # hits the same REST API directly (analytics:platform/analytics:post)
      # with just POSTIZ_API_KEY, so install it once onto the persistent /opt/data
      # volume (survives pod restarts, no image rebuild needed since hermes-agent
      # is a third-party image) using the main image's own node/npm.
      install-postiz-cli:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            if [ ! -x /opt/data/npm-global/bin/postiz ]; then
              npm install --global --prefix /opt/data/npm-global postiz
            fi
            chown -R 10000:10000 /opt/data/npm-global
    containers:
      app:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
        args:
          - gateway
          - run
        env:
          HOME: /opt/data
          HERMES_HOME: /opt/data
          # Gateway HTTP API (programmatic access, e.g. from Open WebUI)
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: &apiPort "8642"
          # Web dashboard. Runs under s6 in this same container so it can manage
          # the gateway via the local service tree. Gated by the basic-auth
          # username/password provider (creds in secrets.yaml) since it's
          # bound to 0.0.0.0. --insecure must stay unset: combining it with
          # basic_auth breaks the health/startup probe (unauthenticated
          # /health gets redirected into the OAuth-only /auth/login route,
          # which 500s for a password-only provider).
          HERMES_DASHBOARD: "1"
          HERMES_DASHBOARD_HOST: 0.0.0.0
          HERMES_DASHBOARD_PORT: &dashPort "9119"
          HERMES_DASHBOARD_PUBLIC_URL: https://hermes-kf.atoca.house
          # s6 gives services ~3s to stop by default — far less than the 60s
          # gateway drain. Match terminationGracePeriodSeconds (ms).
          S6_SERVICES_GRACETIME: "90000"
          # Web search backend (in-cluster SearXNG)
          SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
          # postiz CLI (installed onto /opt/data by the install-postiz-cli init
          # container) for analytics — the MCP server has no analytics tool,
          # and ask_postiz needs an OpenAI key we're not giving Postiz.
          # POSTIZ_API_KEY comes from hermes-kf-secret below.
          PATH: /opt/data/npm-global/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          POSTIZ_API_URL: https://postiz.atoca.house/api
          # browser tool's sandbox-bypass auto-detection (euid==0 / docker /
          # apparmor-restricted-userns) never fires for this non-root
          # containerd pod, so Chromium's setuid sandbox fails to init and
          # it exits before writing DevToolsActivePort. Force the flags the
          # tool would've picked itself under Docker.
          AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
          # WhatsApp Baileys bridge, bot mode (still your personal number —
          # a second number is only a ban-risk recommendation, not required
          # here). Self-chat mode can't be used: the bridge hard-drops any
          # group message in that mode (isGroup && fromMe -> from_me_group),
          # only bot mode honors group_policy/group_allow_from. Group-only
          # access is enforced via config-map.yaml's whatsapp.dm_policy/
          # group_policy/group_allow_from.
          WHATSAPP_ENABLED: "true"
          WHATSAPP_MODE: bot
          # From hermes-kf-secret (envFrom): LITELLM_MASTER_KEY, OUTLINE_API_KEY,
          # POSTIZ_API_KEY, N8N_API_KEY, OPUS_API_KEY, GROUP_ID,
          # WHATSAPP_ALLOWED_USERS, dashboard basic-auth creds.
        envFrom:
          - secretRef:
              name: hermes-kf-secret
        securityContext:
          # No runAsNonRoot: s6-overlay init starts as root to fix /run and drop
          # to uid 10000. It needs exactly CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID
          # for that, plus KILL so root s6 can signal the uid-10000 services —
          # everything else is dropped. The image writes to its root fs, so
          # readOnlyRootFilesystem must stay false.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
        probes:
          # Liveness watches the gateway's own API server: the dashboard
          # (/api/status on 9119) keeps answering while the gateway is dead.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                # Dashboard's /health 500s behind basic_auth (BasicAuthProvider
                # has no OAuth start_login); /api/status is always public.
                path: /api/status
                port: 9119
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/status
                port: 9119
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 75m
            memory: 640Mi
          limits:
            memory: 4Gi

service:
  app:
    controller: hermes-kf
    ports:
      http:
        port: *dashPort
      api:
        port: *apiPort

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - hermes-kf.atoca.house
    rules:
      # Workaround for upstream bug (hermes-kf-agent v2026.7.1): with exactly one
      # auth provider registered, _auto_sso_response 302s unauthenticated page
      # loads to /auth/login?provider=basic — the OAuth-initiation route — but
      # BasicAuthProvider has no start_login, so it 500s. Redirect that route
      # back to the /login password form at the gateway. Safe here: basic is
      # the only provider, so no real OAuth flow can ever hit /auth/login.
      - matches:
          - path:
              type: Exact
              value: /auth/login
        filters:
          - type: RequestRedirect
            requestRedirect:
              path:
                type: ReplaceFullPath
                replaceFullPath: /login
              statusCode: 302
      - filters:
          # The dashboard pins its CORS/origin allow-list to localhost, so the
          # WebSocket handshake (Origin: https://hermes-kf.atoca.house) is rejected
          # with 403. Rewrite Origin to an allowed value — browsers don't enforce
          # CORS on the WS upgrade, so this only satisfies the server-side check.
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: Origin
                  value: http://localhost:9119
        backendRefs:
          - name: hermes-kf
            port: 9119
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /opt/data
  seed-config:
    type: configMap
    name: hermes-kf-config
    advancedMounts:
      hermes-kf:
        copy-config:
          - path: /seed/config
