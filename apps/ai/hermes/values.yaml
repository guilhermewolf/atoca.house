---
defaultPodOptions:
  automountServiceAccountToken: true
  enableServiceLinks: false
  # agent.restart_drain_timeout is 60s; the k8s default 30s grace SIGKILLed the
  # gateway mid-drain. 120s covers the drain plus s6 service teardown.
  terminationGracePeriodSeconds: 120
  securityContext:
    # hermes-agent uses s6-overlay: the entrypoint must start as root to fix
    # /run permissions, then drops to the image's internal hermes user (uid 10000).
    # Forcing runAsNonRoot/runAsUser breaks s6 preinit, so only set fsGroup to
    # match the image user. This intentionally deviates from the repo-wide
    # readOnlyRootFilesystem/runAsNonRoot 99:100 defaults — required by this image.
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  hermes:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      # Only LiteLLM gates scheduling: every model call goes through it. MCP
      # servers are optional at runtime (hermes reconnects), so they no longer
      # block the pod.
      annotations:
        k8s.ksgate.org/litellm-deployment: |
          {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "litellm",
            "namespace": "litellm",
            "expression": "has(resource.status.conditions) && resource.status.conditions.exists(c, c.type == 'Available' && c.status == 'True')"
          }
        k8s.ksgate.org/litellm-service: |
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "litellm",
            "namespace": "litellm"
          }
      schedulingGates:
        - name: k8s.ksgate.org/litellm-deployment
        - name: k8s.ksgate.org/litellm-service

    initContainers:
      # Seed config.yaml from git on every start (git is its source of truth).
      # Persona, memories and skills are NOT in git (private IDs; the repo is
      # public): they live only on this PVC, protected by Volsync, pushed from
      # a local private folder with its sync.sh (see the Outline runbook).
      copy-config:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        command:
          - sh
          - -c
          - |
            set -eu
            mkdir -p /opt/data/workspace
            cp /seed/config/config.yaml /opt/data/config.yaml
            # Git identity + credential helper for the agent's own clones under
            # /opt/data/workspace (the agent clones/fetches on demand per its
            # repo skill). Pushes read $GIT_HTTPS_TOKEN at runtime; the token is
            # never written to the volume.
            cat > /opt/data/.gitconfig <<'EOF'
            [user]
            	name = Hermes
            	email = hermes@atoca.house
            [init]
            	defaultBranch = main
            [safe]
            	directory = /opt/data/workspace/atoca.house
            [pull]
            	rebase = true
            [rebase]
            	autoStash = true
            [fetch]
            	prune = true
            [push]
            	default = current
            [credential "https://github.com"]
            	helper = "!f() { echo username=x-access-token; echo password=$GIT_HTTPS_TOKEN; }; f"
            EOF
            # The agent's terminal runs with HOME=/opt/data/home: same config there.
            mkdir -p /opt/data/home && cp /opt/data/.gitconfig /opt/data/home/.gitconfig
            chown -R 10000:10000 /opt/data/config.yaml /opt/data/.gitconfig /opt/data/home/.gitconfig /opt/data/workspace

      # Static Go CLIs onto the PVC, into /opt/data/.local/bin: already on the
      # image's PATH, which the agent's terminal keeps (a custom PATH env does
      # not reach the terminal). alpine/k8s's jq and yq are musl-linked and can't
      # run in the Debian app image: yq comes from copy-yq, use python3 for JSON.
      copy-tools:
        image:
          repository: docker.io/alpine/k8s
          tag: "1.37.1"
        command:
          - sh
          - -c
          - |
            set -eu
            mkdir -p /opt/data/.local/bin
            for b in kubectl helm kustomize kubeconform; do cp "/usr/bin/$b" /opt/data/.local/bin/; done
            chown -R 10000:10000 /opt/data/.local

      # yq: the official image ships a static binary (runs on Debian).
      copy-yq:
        image:
          repository: docker.io/mikefarah/yq
          tag: 4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
        securityContext:
          runAsUser: 0
        command:
          - sh
          - -c
          - |
            set -eu
            mkdir -p /opt/data/.local/bin
            cp /usr/bin/yq /opt/data/.local/bin/yq
            chown -R 10000:10000 /opt/data/.local

    containers:
      app:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
        args:
          - gateway
          - run
        env:
          TZ: Europe/Amsterdam
          HOME: /opt/data
          HERMES_HOME: /opt/data
          # Gateway HTTP API (programmatic access, e.g. from Open WebUI)
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: &apiPort "8642"
          # Web dashboard. Runs under s6 in this same container so it can manage
          # the gateway via the local service tree. Gated by the basic-auth
          # username/password provider (creds in secrets.yaml) since it's
          # bound to 0.0.0.0. --insecure must stay unset: combining it with
          # basic_auth breaks the health/startup probe (unauthenticated
          # /health gets redirected into the OAuth-only /auth/login route,
          # which 500s for a password-only provider).
          HERMES_DASHBOARD: "1"
          HERMES_DASHBOARD_HOST: 0.0.0.0
          HERMES_DASHBOARD_PORT: &dashPort "9119"
          HERMES_DASHBOARD_PUBLIC_URL: https://hermes.atoca.house
          # s6 gives services ~3s to stop by default — far less than the 60s
          # gateway drain. Match terminationGracePeriodSeconds (ms).
          S6_SERVICES_GRACETIME: "90000"
          # Web search backend (in-cluster SearXNG)
          SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
          # Discord gateway creds + allowlist + channel come from hermes-secret
          # (envFrom below): DISCORD_BOT_TOKEN, DISCORD_ALLOWED_USERS,
          # DISCORD_FREE_RESPONSE_CHANNELS. Kept out of git on purpose.
        envFrom:
          - secretRef:
              name: hermes-secret
          # Per-agent LiteLLM key minted by litellm-operator (litellm-key.yaml).
          - secretRef:
              name: litellm-key
        securityContext:
          # No runAsNonRoot: s6-overlay init starts as root to fix /run and drop
          # to uid 10000. It needs exactly CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID
          # for that, plus KILL so root s6 can signal the uid-10000 services —
          # everything else is dropped. The image writes to its root fs, so
          # readOnlyRootFilesystem must stay false.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
        probes:
          # Liveness watches the gateway's own API server: the dashboard
          # (/api/status on 9119) keeps answering while the gateway is dead.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8642
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                # Dashboard's /health 500s behind basic_auth (BasicAuthProvider
                # has no OAuth start_login); /api/status is always public.
                path: /api/status
                port: 9119
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/status
                port: 9119
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            # Bursty: local faster-whisper transcription runs on CPU here.
            cpu: 75m
            memory: 1Gi
          limits:
            memory: 4Gi

service:
  app:
    controller: hermes
    ports:
      http:
        port: *dashPort
      api:
        port: *apiPort

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - hermes.atoca.house
    rules:
      # Workaround for upstream bug (hermes-agent v2026.7.1): with exactly one
      # auth provider registered, _auto_sso_response 302s unauthenticated page
      # loads to /auth/login?provider=basic — the OAuth-initiation route — but
      # BasicAuthProvider has no start_login, so it 500s. Redirect that route
      # back to the /login password form at the gateway. Safe here: basic is
      # the only provider, so no real OAuth flow can ever hit /auth/login.
      - matches:
          - path:
              type: Exact
              value: /auth/login
        filters:
          - type: RequestRedirect
            requestRedirect:
              path:
                type: ReplaceFullPath
                replaceFullPath: /login
              statusCode: 302
      - filters:
          # The dashboard pins its CORS/origin allow-list to localhost, so the
          # WebSocket handshake (Origin: https://hermes.atoca.house) is rejected
          # with 403. Rewrite Origin to an allowed value — browsers don't enforce
          # CORS on the WS upgrade, so this only satisfies the server-side check.
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: Origin
                  value: http://localhost:9119
        backendRefs:
          - name: hermes
            port: 9119
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /opt/data
  seed-config:
    type: configMap
    name: hermes-config
    advancedMounts:
      hermes:
        copy-config:
          - path: /seed/config

serviceAccount:
  hermes: {}

# Broad read-only cluster access so the agent can introspect the homelab.
# Secrets are intentionally excluded.
rbac:
  roles:
    hermes-read-all:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources:
            [
              "pods",
              "pods/log",
              "nodes",
              "services",
              "namespaces",
              "configmaps",
              "persistentvolumes",
              "persistentvolumeclaims",
              "endpoints",
              "resourcequotas",
              "limitranges",
              "serviceaccounts",
              "events",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources:
            [
              "deployments",
              "daemonsets",
              "statefulsets",
              "replicasets",
              "controllerrevisions",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses", "ingressclasses", "networkpolicies"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["gateways", "httproutes", "grpcroutes", "referencegrants"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["storage.k8s.io"]
          resources:
            ["storageclasses", "csinodes", "csidrivers", "volumeattachments"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources:
            ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["metrics.k8s.io"]
          resources: ["nodes", "pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["argoproj.io"]
          resources: ["applications", "applicationsets", "appprojects"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["external-secrets.io"]
          resources: ["externalsecrets", "secretstores", "clustersecretstores"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["volsync.backube"]
          resources: ["replicationsources", "replicationdestinations"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources:
            [
              "prometheuses",
              "alertmanagers",
              "servicemonitors",
              "podmonitors",
              "prometheusrules",
              "thanosrulers",
              "probes",
            ]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources:
            [
              "volumesnapshots",
              "volumesnapshotcontents",
              "volumesnapshotclasses",
            ]
          verbs: ["get", "list", "watch"]
  bindings:
    hermes-read-all:
      type: ClusterRoleBinding
      roleRef:
        identifier: hermes-read-all
      subjects:
        - identifier: hermes
          serviceAccount: hermes
