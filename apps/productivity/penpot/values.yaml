# penpot values
#
# Penpot ships as three cooperating images: an nginx frontend (static app +
# reverse proxy), a JVM backend and a puppeteer/chromium exporter. They talk to
# each other over localhost, so all three run as containers of a single pod.
#
# Assets live in Garage (assets-s3 backend), not on a PVC: the backend hands the
# frontend a presigned URL and nginx follows it via its @handle_redirect
# location. Penpot's S3 client turns on path-style addressing automatically
# whenever an endpoint override is set, which is what Garage needs.

controllers:
  penpot:
    labels:
      postgres: "true"
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      backend:
        image:
          # renovate: datasource=docker depName=docker.io/penpotapp/backend
          repository: docker.io/penpotapp/backend
          tag: 2.17.0@sha256:471cdebf185be899ef7d7593e9cd7994b908ebd7ffb78ca547e3d843bb83536f
        env:
          PENPOT_PUBLIC_URI: &publicUri https://penpot.atoca.house
          PENPOT_FLAGS: &flags >-
            enable-login-with-password
            enable-registration
            enable-login-with-oidc
            enable-smtp
            disable-telemetry
          PENPOT_TELEMETRY_ENABLED: "false"
          # PENPOT_ASSETS_STORAGE_* was deprecated in 2.11 in favour of
          # PENPOT_OBJECTS_STORAGE_*
          PENPOT_OBJECTS_STORAGE_BACKEND: s3
          PENPOT_OBJECTS_STORAGE_S3_BUCKET: penpot
          PENPOT_OBJECTS_STORAGE_S3_REGION: eu-east-1
          PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
          # OIDC discovery targets the internal gateway, which resolves to a
          # site-local address — Penpot's SSRF guard blocks those unless the
          # host is explicitly allowlisted.
          PENPOT_SSRF_ALLOWED_HOSTS: auth.atoca.house
          # db 9 — see other apps for the indexes already taken on dragonfly
          PENPOT_REDIS_URI: &redisUri redis://dragonfly.dragonfly-cluster.svc.cluster.local:6379/9
          PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600" # 350MiB
          PENPOT_SMTP_TLS: "true"
          PENPOT_SMTP_SSL: "false"
          # OIDC against Authelia — discovery lives at
          # https://auth.atoca.house/.well-known/openid-configuration
          PENPOT_OIDC_BASE_URI: https://auth.atoca.house
          PENPOT_OIDC_CLIENT_ID: penpot
          PENPOT_OIDC_SCOPES: openid profile email
          PENPOT_OIDC_NAME_ATTR: name
          PENPOT_OIDC_EMAIL_ATTR: email
        envFrom:
          - secretRef:
              name: penpot-secret
          - secretRef:
              name: penpot-db-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: &backendPort 6060
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi

      exporter:
        image:
          # renovate: datasource=docker depName=docker.io/penpotapp/exporter
          repository: docker.io/penpotapp/exporter
          tag: 2.17.0@sha256:7e8beb6ef2bdb9d778e9bbcbf7feebf8c99a137b2d9eb3969450c0a1a49e41c5
        env:
          PENPOT_PUBLIC_URI: *publicUri
          PENPOT_INTERNAL_URI: http://localhost:8080
          PENPOT_REDIS_URI: *redisUri
        envFrom:
          - secretRef:
              name: penpot-secret
        probes:
          liveness: &exporterProbes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: &exporterPort 6061
              initialDelaySeconds: 30
              periodSeconds: 30
              failureThreshold: 5
          readiness: *exporterProbes
        securityContext:
          allowPrivilegeEscalation: false
          # chromium needs a writable profile/crash dir outside /tmp
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

      frontend:
        image:
          # renovate: datasource=docker depName=docker.io/penpotapp/frontend
          repository: docker.io/penpotapp/frontend
          tag: 2.17.0@sha256:861989dfff50f12b9de1358c6b0f3cc1e601d7a678db2826f3643d0f93438500
        env:
          PENPOT_PUBLIC_URI: *publicUri
          PENPOT_FLAGS: *flags
          PENPOT_OIDC_NAME: Authelia
          PENPOT_BACKEND_URI: http://localhost:6060
          PENPOT_EXPORTER_URI: http://localhost:6061
          PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
        probes:
          liveness: &feProbes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 8080
              initialDelaySeconds: 15
              periodSeconds: 30
              failureThreshold: 5
          readiness: *feProbes
        securityContext:
          allowPrivilegeEscalation: false
          # the entrypoint rewrites /etc/nginx/nginx.conf and
          # /var/www/app/js/config.js at boot, so the rootfs must be writable
          readOnlyRootFilesystem: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001 # `penpot` user in all three images
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

service:
  penpot:
    controller: penpot
    ports:
      http:
        port: *port

route:
  penpot:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - penpot.atoca.house
    rules:
      - backendRefs:
          - name: penpot
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  # NOT mounted on the frontend: its image ships nginx.conf.template (and the
  # resolver/mcp templates) in /tmp, and the entrypoint envsubsts them into
  # /etc/nginx at boot. An emptyDir there hides them and nginx silently falls
  # back to the stock config, serving the default welcome page.
  tmpfs:
    type: emptyDir
    advancedMounts:
      penpot:
        backend:
          - path: /tmp
            subPath: backend
        exporter:
          - path: /tmp
            subPath: exporter
  dshm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      penpot:
        exporter:
          - path: /dev/shm
