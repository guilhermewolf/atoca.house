---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-viewer
  namespace: mcp
---
# Built-in `view`: namespaced read access, excludes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-viewer
    namespace: mcp
---
# `view` skips cluster-scoped objects and most CRDs; add read on those.
# Core group is listed explicitly so Secrets stay out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io", "apiextensions.k8s.io", "metrics.k8s.io", "events.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - argoproj.io
      - ceph.rook.io
      - cert-manager.io
      - cilium.io
      - external-secrets.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - keda.sh
      - k8s.cni.cncf.io
      - monitoring.coreos.com
      - postgres-operator.crunchydata.com
      - snapshot.storage.k8s.io
      - toolhive.stacklok.dev
      - volsync.backube
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-cluster-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-viewer
    namespace: mcp
