monitoring:
  enabled: true
  createPrometheusRules: true

toolbox:
  enabled: true

route:
  dashboard:
    host:
      name: rook.atoca.house
      path: /
      pathType: PathPrefix
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system

operatorNamespace: rook-ceph

cephClusterSpec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.4
  cephConfig:
    global:
      bdev_enable_discard: "true" # quote
      bdev_async_discard_threads: "1" # quote
      osd_class_update_on_start: "false" # quote
      device_failure_prediction_mode: local # requires mgr module
    mgr:
      debug_mgr: "1/5" # default; stops Python DEBUG k8s-client "response body" PodList dumps from the rook module
  cleanupPolicy:
    wipeDevicesFromOtherClusters: true
  crashCollector:
    disable: false
  csi:
    readAffinity:
      enabled: false # https://github.com/ceph/ceph-csi/issues/5772
  dashboard:
    enabled: true
    urlPrefix: /
    ssl: false
    prometheusEndpoint: http://kube-prometheus-stack-moni-prometheus.monitoring.svc.cluster.local:9090
  mgr:
    modules:
      - name: diskprediction_local
        enabled: true
      - name: insights
        enabled: true
      - name: pg_autoscaler
        enabled: true
      - name: rook
        enabled: false
  network:
    provider: host
    addressRanges:
      public:
        - 192.168.40.0/24
      cluster:
        - 192.168.40.0/24
    connections:
      requireMsgr2: true
  resources:
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    mon:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 8Gi
    mgr-sidecar:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  # CVE-2025-30156: Ceph v20.2.4 (Tentacle) introduces the `aes256k` cephx key
  # type and flags the legacy `aes` cipher as insecure. Core daemons (mon, mgr,
  # osd, mds) must migrate; other clients may stay on `aes` indefinitely.
  # https://rook.io/docs/rook/latest-release/Storage-Configuration/Advanced/cephx-key-rotation/
  security:
    cephx:
      # Leave allowedCiphers unset (Rook then permits both ciphers). Restricting
      # it to ["aes256k"] while ANY key is still `aes` makes the cluster
      # unavailable — and the CSI keys below must stay `aes`.
      daemon:
        # keyType intentionally unset: Rook autodetects the best type for daemon
        # keys and the docs say not to pin it. Gen 2 already rotated these to
        # aes256k, which resolved the AUTH_INSECURE_SERVICE_KEY_TYPE error.
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
      csi:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 3
        # MUST stay "aes" until every node runs Linux kernel 7.0+ (Talos v1.13.8
        # ships 6.18). krbd cannot use aes256k keys on older kernels: volume
        # attach fails with `rados: ret=-22, Invalid argument` and every pod
        # with a ceph-block PVC hangs in Init.
        keyType: aes
        keepPriorKeyCountMax: 1 # keep prior key valid so live PV mounts survive
      rbdMirrorPeer:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k
  # Expected during the aes -> aes256k transition while CSI keys remain `aes`.
  # Flip each policy to `unmute` once the CSI keys are migrated so that any
  # accidental `aes` key raises a visible warning again.
  healthCheck:
    muteHealthWarning:
      AUTH_EMERGENCY_CIPHERS_SET:
        policy: mute
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
      AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
        policy: mute
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "node-01"
        devices:
          - name: "/dev/disk/by-id/nvme-FIKWOT_FN955_1TB_AA245040550"
      - name: "node-02"
        devices:
          - name: "/dev/disk/by-id/nvme-FIKWOT_FN955_1TB_AA245040379"
      - name: "node-03"
        devices:
          - name: "/dev/disk/by-id/nvme-FIKWOT_FN955_1TB_AA245040603"
      - name: "node-04"
        devices:
          - name: "/dev/disk/by-id/nvme-Samsung_SSD_980_PRO_1TB_S5GXNS0X326250J"
    config:
      osdsPerDevice: "1"

# Storage Classes
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host # Replicate across hosts
      replicated:
        size: 3
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true # Make this the default storage class
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      mountOptions:
        - discard
      parameters:
        compression_mode: aggressive
        compression_algorithm: zstd
        imageFormat: "2"
        imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: csi-ceph-blockpool
  isDefault: false
  deletionPolicy: Delete

cephFileSystems: []
cephObjectStores: []
