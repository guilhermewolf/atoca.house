---
controllers:
  garage:
    annotations:
      reloader.stakater.com/auto: "true"
    # Single LMDB writer on an RWO volume - never run two pods at once.
    strategy: Recreate
    containers:
      app:
        image:
          repository: dxflrs/garage
          tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
        envFrom:
          - secretRef:
              name: garage-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 500Mi
defaultPodOptions:
  securityContext:
    seccompProfile: { type: RuntimeDefault }
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      s3:
        port: &port 3900
      api:
        port: 3903

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - s3.atoca.house
    rules:
      - backendRefs:
          - name: garage
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

configMaps:
  config:
    data:
      configuration.toml: |
        metadata_dir = "/meta"
        data_dir = "/data"
        db_engine = "lmdb"
        metadata_auto_snapshot_interval = "6h"

        block_size = "10MiB"

        replication_factor = 1
        compression_level = 2

        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "127.0.0.1:3901"

        [s3_api]
        s3_region = "eu-east-1"
        api_bind_addr = "[::]:3900"
        root_domain = ".s3.atoca.house"

        [admin]
        api_bind_addr = "[::]:3903"

persistence:
  config:
    enabled: true
    type: configMap
    name: garage
    globalMounts:
      - path: /etc/garage.toml
        subPath: configuration.toml
  data:
    type: nfs
    server: nas.internal
    path: /mnt/user/garage/data
    globalMounts:
      - path: /data
  # LMDB metadata lives on Ceph, not NFS (LMDB locking/mmap is unsafe over NFS).
  # Only bulk object data stays on the NAS.
  meta:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 10Gi
    # Restore gate - see restore.yaml.
    dataSourceRef:
      apiGroup: volsync.backube
      kind: ReplicationDestination
      name: garage-restore
    globalMounts:
      - path: /meta
