---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Seed config.yaml for the hub. The shape stays in git; only the addresses and
# the MQTT password come from 1Password item `camcontrol`:
#
#   ZVE10_HOST     IP of the Sony ZV-E10 on the camera VLAN (PTP/IP)
#   SATELLITE_URL  base URL of the Pi satellite holding the Canon, e.g.
#                  http://10.0.0.5:8710
#   MQTT_PASSWORD  password for the `camcontrol` Mosquitto user
#
# Only the first start reads this — after that config.yaml lives on the PVC
# and the settings UI owns it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camcontrol-config-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yaml: |
          cameras:
            - id: zve10
              name: Sony ZV-E10
              transports:
                - driver: gphoto
                  port: "ptpip:{{ .ZVE10_HOST }}"
                  model: "Sony ZV-E10 (Control)"
            - id: sl3
              name: Canon SL3
              transports:
                - driver: satellite
                  url: "http://{{ .SATELLITE_URL }}:8710"
                  remote_id: sl3
          mqtt:
            enabled: true
            host: hass.atoca.house
            port: 1883
            username: camcontrol
            password: "{{ .MQTT_PASSWORD }}"
            base_topic: camcontrol
            discovery_prefix: homeassistant
            poll_interval: 15
  dataFrom:
    - extract:
        key: camcontrol-secrets
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camcontrol-r2-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .RESTIC_REPOSITORY }}/camcontrol"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-r2
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
