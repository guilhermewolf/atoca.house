---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victorialogs-mcp
spec:
  groupRef:
    name: mcp-tools
  # renovate: datasource=docker depName=ghcr.io/victoriametrics/mcp-victorialogs
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.11.0@sha256:0b3acd058159adc196ace66b2168895d4fbe6cb2ed75bbad49799863ac4dc56e
  env:
    # Only exposes VictoriaLogs' read-only query APIs; no auth on the
    # in-cluster endpoint.
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victoria-logs-server.victoria-logs.svc.cluster.local:9428
    # Native streamable HTTP instead of stdio: resources/list embeds the docs
    # and the stdio proxy breaks those large messages into invalid JSON-RPC.
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: ":8081"
  transport: streamable-http
  mcpPort: 8081
