---
controllers:
  dispatcharr:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      gluetun:
        image:
          # renovate: datasource=docker depName=ghcr.io/qdm12/gluetun
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        env:
          VPN_SERVICE_PROVIDER: airvpn
          VPN_TYPE: wireguard
          WIREGUARD_MTU: 1320
          SERVER_NAMES: Dalim,Piautos,Taiyangshou,Dedalus
          FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12,192.168.40.0/24
          FIREWALL_INPUT_PORTS: "9191"
          DOT: "off"
          DNS_ADDRESS: 10.96.0.10
          HEALTH_TARGET_ADDRESS: 1.1.1.1:443
        envFrom:
          - secretRef:
              name: dispatcharr-vpn-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["/gluetun-entrypoint", "healthcheck"]
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["/gluetun-entrypoint", "healthcheck"]
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: ["NET_ADMIN"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
    containers:
      dispatcharr:
        image:
          repository: ghcr.io/dispatcharr/dispatcharr
          tag: 0.29.0
        env:
          DISPATCHARR_ENV: modular
          DISPATCHARR_LOG_LEVEL: info
          DISPATCHARR_PORT: &port 9191
          REDIS_HOST: dragonfly.dragonfly-cluster.svc.cluster.local
          REDIS_PORT: 6379
          POSTGRES_PORT: 5432
        envFrom:
          - secretRef:
              name: dispatcharr-db-secret
        resources:
          requests:
            cpu: 10m
            memory: 768Mi
          limits:
            memory: 3Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
      celery:
        image:
          repository: ghcr.io/dispatcharr/dispatcharr
          tag: 0.29.0
        command:
          - /app/docker/entrypoint.celery.sh
        env:
          DISPATCHARR_ENV: modular
          DISPATCHARR_LOG_LEVEL: info
          REDIS_HOST: dragonfly.dragonfly-cluster.svc.cluster.local
          REDIS_PORT: 6379
          POSTGRES_PORT: 5432
          DJANGO_SETTINGS_MODULE: dispatcharr.settings
          PYTHONUNBUFFERED: "1"
        envFrom:
          - secretRef:
              name: dispatcharr-db-secret
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            memory: 6Gi

defaultPodOptions:
  annotations:
    k8s.ksgate.org/postgres-ready: |
      {
        "apiVersion": "postgres-operator.crunchydata.com/v1beta1",
        "kind": "PostgresCluster",
        "name": "postgres",
        "namespace": "crunchy-postgres-cluster",
        "expression": "has(resource.status.instances) && resource.status.instances.exists(i, i.readyReplicas >= 1)"
      }
    k8s.ksgate.org/postgres-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "postgres-pgbouncer",
        "namespace": "crunchy-postgres-cluster"
      }
    k8s.ksgate.org/dragonfly-ready: |
      {
        "apiVersion": "dragonflydb.io/v1alpha1",
        "kind": "Dragonfly",
        "name": "dragonfly",
        "namespace": "dragonfly-cluster",
        "expression": "has(resource.status) && has(resource.status.phase) && resource.status.phase == 'Ready'"
      }
    k8s.ksgate.org/dragonfly-service: |
      {
        "apiVersion": "v1",
        "kind": "Service",
        "name": "dragonfly",
        "namespace": "dragonfly-cluster"
      }
  schedulingGates:
    - name: k8s.ksgate.org/postgres-ready
    - name: k8s.ksgate.org/postgres-service
    - name: k8s.ksgate.org/dragonfly-ready
    - name: k8s.ksgate.org/dragonfly-service
  nodeSelector:
    node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"

service:
  dispatcharr:
    controller: dispatcharr
    ports:
      http:
        port: *port

route:
  dispatcharr:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - dispatcharr.atoca.house
    rules:
      - backendRefs:
          - name: dispatcharr
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /data

  tmpfs:
    type: emptyDir
    advancedMounts:
      dispatcharr:
        dispatcharr:
          - path: /tmp
            subPath: tmp
        gluetun:
          - path: /gluetun
            subPath: gluetun
          - path: /tmp
            subPath: gluetun-tmp
