---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name headlamp-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        OIDC_CLIENT_SECRET: "{{ .HEADLAMP_OAUTH_CLIENT_SECRET }}"
  # Same 1Password field Authelia reads, so the secret lives in one place.
  data:
    - secretKey: HEADLAMP_OAUTH_CLIENT_SECRET
      remoteRef:
        key: authelia
        property: HEADLAMP_OAUTH_CLIENT_SECRET
