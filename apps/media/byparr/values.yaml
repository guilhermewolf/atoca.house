---
controllers:
  byparr:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      byparr:
        image:
          # renovate: datasource=docker depName=ghcr.io/thephaseless/byparr
          repository: ghcr.io/thephaseless/byparr
          tag: 3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
          pullPolicy: IfNotPresent
        env:
          - name: PORT
            value: "8191"
          - name: LOG_LEVEL
            value: "INFO"
        probes:
          # /health launches a real Firefox session, so it is slow and must not
          # be probed aggressively. Startup gets a long budget for the first
          # browser launch; readiness/liveness stay generous afterwards.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 20
              timeoutSeconds: 180
              periodSeconds: 200
              failureThreshold: 5
          readiness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8191
              initialDelaySeconds: 0
              timeoutSeconds: 15
              periodSeconds: 60
              failureThreshold: 3
          liveness: *probe
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          # invisible-playwright writes into XDG_CACHE_HOME (/cache) at runtime
          # for the font manifest and geoip data, alongside the Firefox build
          # baked into the image there. A read-only rootfs breaks it.
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["192.168.90.22/24"],
        "mac": "5e:c3:71:0a:8d:46"
      }]
  securityContext:
    # Image is built for uid/gid 1000 (uv-managed Python and /cache are owned
    # by it), so this deviates from the repo-wide 99:100 default.
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: byparr
    ports:
      http:
        primary: true
        port: 8191
        targetPort: 8191

route:
  app:
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - name: atoca-house-internal
        namespace: kube-system
    hostnames:
      - byparr.atoca.house
    rules:
      - backendRefs:
          - name: byparr
            port: 8191
        matches:
          - path:
              type: PathPrefix
              value: /

persistence:
  # Firefox profile scratch space
  tmpfs:
    type: emptyDir
    sizeLimit: 2Gi
    globalMounts:
      - path: /tmp
  # Firefox needs shared memory well above the 64Mi default
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 512Mi
    globalMounts:
      - path: /dev/shm
